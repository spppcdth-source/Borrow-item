<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ระบบใบยืมเครื่องมือ - ศูนย์สนับสนุนการตรวจวัดมลพิษ</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Kanit:wght@500;600;700&display=swap');

@font-face{
  font-family:'TH Sarabun PSK';
  src: url('https://cdn.jsdelivr.net/gh/SarabunConsortium/TH-Sarabun-PSK@master/THSarabunPSK%20Regular.ttf') format('truetype');
  font-weight:400; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'TH Sarabun PSK';
  src: url('https://cdn.jsdelivr.net/gh/SarabunConsortium/TH-Sarabun-PSK@master/THSarabunPSK%20Bold.ttf') format('truetype');
  font-weight:700; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'TH Sarabun PSK';
  src: url('https://cdn.jsdelivr.net/gh/SarabunConsortium/TH-Sarabun-PSK@master/THSarabunPSK%20Italic.ttf') format('truetype');
  font-weight:400; font-style:italic; font-display:swap;
}
@font-face{
  font-family:'TH Sarabun PSK';
  src: url('https://cdn.jsdelivr.net/gh/SarabunConsortium/TH-Sarabun-PSK@master/THSarabunPSK%20BoldItalic.ttf') format('truetype');
  font-weight:700; font-style:italic; font-display:swap;
}

:root[data-theme="light"]{
  --bg: #f3f7f6;
  --bg-grad1: #e9f9f3;
  --bg-grad2: #eef6ff;
  --card: #ffffff;
  --text: #16302b;
  --subtle: #5b6b68;
  --border: #e1e8e6;
  --input-bg: #ffffff;
  --input-border: #d7e2df;
  --header-bg: linear-gradient(120deg,#0f766e,#0891b2 55%,#0369a1);
  --header-text: #ffffff;
  --primary: #0f766e;
  --primary-dark: #0d5f59;
  --chip-bg: #f4faf8;
  --shadow: 0 1px 3px rgba(15,60,50,.08), 0 6px 18px rgba(15,60,50,.06);
}
:root[data-theme="dark"]{
  --bg: #0f1a18;
  --bg-grad1: #0b1512;
  --bg-grad2: #0c1620;
  --card: #16211f;
  --text: #eaf3f1;
  --subtle: #9db3af;
  --border: #223330;
  --input-bg: #101c1a;
  --input-border: #2a3d39;
  --header-bg: linear-gradient(120deg,#0b3d38,#0e5266 55%,#0b3f5e);
  --header-text: #eafffb;
  --primary: #2dd4bf;
  --primary-dark: #14b8a6;
  --chip-bg: #16211f;
  --shadow: 0 1px 3px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
}

*{ box-sizing: border-box; }
html,body{ margin:0; padding:0; }
body{
  font-family: 'Sarabun', 'Kanit', system-ui, sans-serif;
  background:
    radial-gradient(1200px 500px at 10% -5%, var(--bg-grad1), transparent),
    radial-gradient(1200px 500px at 100% 0%, var(--bg-grad2), transparent),
    var(--bg);
  color: var(--text);
  min-height: 100vh;
}
h1,h2,h3{ font-family:'Kanit','Sarabun',sans-serif; }

.header-band{ background: var(--header-bg); color: var(--header-text); border-radius: 0 0 28px 28px; box-shadow: var(--shadow); }
.header-title{ color: var(--header-text); }
.header-sub{ color: rgba(255,255,255,.85); }
.logo-badge{ width:64px; height:64px; border-radius:14px; background:rgba(255,255,255,.92); display:flex; align-items:center; justify-content:center; padding:6px; box-shadow:0 2px 8px rgba(0,0,0,.15); flex-shrink:0; }
.logo-badge svg{ width:100%; height:100%; display:block; }
@media (min-width:768px){ .logo-badge{ width:80px; height:80px; } }

.tabbar{ display:flex; gap:8px; flex-wrap:wrap; }
.tab-btn{ padding:10px 16px; border-radius:12px; background:rgba(255,255,255,.12); color:var(--header-text); font-weight:600; border:1px solid rgba(255,255,255,.25); cursor:pointer; transition:.15s; font-size:14px;}
.tab-btn:hover{ background:rgba(255,255,255,.22); }
.tab-active{ background:#ffffff; color:#0f766e; }

.btn-theme{ width:38px; height:38px; border-radius:10px; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.3); cursor:pointer; font-size:16px;}

/* ===== Notification Bell ===== */
.notif-wrap{ position:relative; }
.notif-bell{ position:relative; width:38px; height:38px; border-radius:10px; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.3); cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; transition:.15s; color:var(--header-text); }
.notif-bell:hover{ background:rgba(255,255,255,.28); }
.notif-bell svg{ width:19px; height:19px; display:block; }
.notif-bell.has-alert{ animation: notifShake 2.4s ease-in-out infinite; }
.notif-bell.has-alert svg{ animation: notifGlow 1.6s ease-in-out infinite; }
@keyframes notifGlow{
  0%,100%{ filter: drop-shadow(0 0 0 rgba(220,38,38,0)); color: var(--header-text); }
  50%{ filter: drop-shadow(0 0 6px rgba(248,113,113,.95)); color:#fecaca; }
}
@keyframes notifShake{
  0%,92%,100%{ transform:rotate(0deg); }
  93%{ transform:rotate(-12deg); }
  94.5%{ transform:rotate(10deg); }
  96%{ transform:rotate(-8deg); }
  97.5%{ transform:rotate(5deg); }
  99%{ transform:rotate(0deg); }
}
.notif-badge{ position:absolute; top:-5px; right:-5px; min-width:17px; height:17px; padding:0 4px; border-radius:999px; background:#dc2626; color:#fff; font-size:10px; font-weight:800; line-height:17px; text-align:center; box-shadow:0 0 0 2px var(--primary,#0f766e); }
.notif-badge.pulse{ animation: notifBadgePulse 1.4s ease-in-out infinite; }
.tab-corner-badge{ position:absolute; top:-7px; right:-7px; min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:#dc2626; color:#fff; font-size:10.5px; font-weight:800; line-height:18px; text-align:center; box-shadow:0 0 0 2px var(--card,#fff); animation: notifBadgePulse 1.4s ease-in-out infinite; }
@keyframes notifBadgePulse{
  0%,100%{ box-shadow:0 0 0 2px var(--primary,#0f766e), 0 0 0 0 rgba(220,38,38,.65); }
  50%{ box-shadow:0 0 0 2px var(--primary,#0f766e), 0 0 0 6px rgba(220,38,38,0); }
}
.notif-panel{ position:absolute; top:48px; right:0; width:340px; max-width:88vw; max-height:420px; overflow:hidden; display:flex; flex-direction:column; background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:14px; box-shadow: 0 12px 32px rgba(0,0,0,.22); z-index:60; }
@media (max-width:480px){ .notif-panel{ position:fixed; top:auto; bottom:0; left:0; right:0; width:100%; max-width:100%; border-radius:16px 16px 0 0; max-height:70vh; } }
.notif-panel-head{ display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid var(--border); flex-shrink:0; }
.notif-panel-title{ font-weight:700; font-size:14px; }
.notif-panel-mark{ font-size:12px; font-weight:600; color: var(--primary); background:none; border:none; cursor:pointer; padding:2px 4px; }
.notif-panel-mark:hover{ text-decoration:underline; }
.notif-panel-body{ overflow-y:auto; flex:1; }
.notif-item{ display:flex; gap:10px; align-items:flex-start; padding:11px 14px; border-bottom:1px solid var(--border); cursor:pointer; transition:.12s; }
.notif-item:last-child{ border-bottom:none; }
.notif-item:hover{ background: var(--chip-bg); }
.notif-item.unread{ background: rgba(220,38,38,.06); }
.notif-icon{ width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
.notif-icon.new{ background:rgba(15,118,110,.12); }
.notif-icon.late{ background:rgba(220,38,38,.12); }
.notif-text{ flex:1; min-width:0; }
.notif-title{ font-size:13px; font-weight:700; margin-bottom:2px; }
.notif-sub{ font-size:12px; color:var(--subtle); }
.notif-time{ font-size:10.5px; color:var(--subtle); margin-top:3px; }
.notif-dot{ width:7px; height:7px; border-radius:999px; background:#dc2626; flex-shrink:0; margin-top:5px; }
.notif-empty{ padding:32px 16px; text-align:center; color:var(--subtle); font-size:13px; }

/* ===== Notification Toast (พรีวิวแจ้งเตือนแบบเด้งจางๆ) ===== */
.notif-toast-container{ position:fixed; top:76px; right:16px; z-index:9999; display:flex; flex-direction:column; gap:8px; pointer-events:none; max-width:92vw; }
@media (max-width:480px){ .notif-toast-container{ left:16px; right:16px; top:auto; bottom:16px; align-items:stretch; } }
.notif-toast{ pointer-events:auto; display:flex; gap:10px; align-items:flex-start; background:var(--card); color:var(--text); border:1px solid var(--border); box-shadow:var(--shadow); border-radius:14px; padding:11px 14px; width:300px; max-width:100%; opacity:0; transform:translateY(-10px) scale(.98); transition:opacity .35s ease, transform .35s ease; }
@media (max-width:480px){ .notif-toast{ width:100%; } }
.notif-toast.show{ opacity:1; transform:translateY(0) scale(1); }
.notif-toast-icon{ width:30px; height:30px; border-radius:9px; background:rgba(15,118,110,.12); display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
.notif-toast-icon.late{ background:rgba(220,38,38,.12); }
.notif-toast-text{ flex:1; min-width:0; }
.notif-toast-title{ font-size:13px; font-weight:700; }
.notif-toast-sub{ font-size:12px; color:var(--subtle); margin-top:1px; }
.btn-ghost{ padding:9px 14px; border-radius:10px; background:var(--card); border:1px solid var(--border); color:var(--text); cursor:pointer; font-weight:600; font-size:13.5px; transition:.15s;}
.btn-ghost:hover{ background: var(--chip-bg); }
.btn-primary{ padding:10px 18px; border-radius:10px; background: var(--primary); color:#fff; border:none; cursor:pointer; font-weight:700; font-size:14px; box-shadow: 0 4px 12px rgba(15,118,110,.3); transition:.15s;}
.btn-primary:hover{ background: var(--primary-dark); }
.btn-mini-primary{ padding:5px 10px; border-radius:8px; background:#16a34a; color:#fff; border:none; cursor:pointer; font-weight:700; font-size:11.5px; white-space:nowrap; transition:.15s; }
.btn-mini-primary:hover{ background:#15803d; }
.btn-calib-done{ display:inline-flex; align-items:center; justify-content:center; gap:5px; padding:6px 13px; border-radius:999px; background:#ecfdf5; color:#047857; border:1px solid #a7f3d0; cursor:pointer; font-weight:600; font-size:11.5px; white-space:nowrap; transition:.15s ease; }
.btn-calib-done svg{ width:12.5px; height:12.5px; flex-shrink:0; }
.btn-calib-done:hover{ background:#d1fae5; border-color:#6ee7b7; color:#047857; box-shadow:0 2px 8px rgba(5,150,105,.18); transform:translateY(-1px); }
.btn-calib-done:active{ transform:translateY(0); box-shadow:none; }
:root[data-theme="dark"] .btn-calib-done{ background:rgba(16,185,129,.12); color:#6ee7b7; border-color:rgba(16,185,129,.35); }
:root[data-theme="dark"] .btn-calib-done:hover{ background:rgba(16,185,129,.2); border-color:rgba(16,185,129,.5); }
.btn-danger{ padding:9px 14px; border-radius:10px; background:#fef2f2; color:#dc2626; border:1px solid #fecaca; cursor:pointer; font-weight:600; font-size:13.5px;}
:root[data-theme="dark"] .btn-danger{ background:#3a1414; color:#f87171; border-color:#5c1f1f; }
.btn-early-return{ padding:9px 14px; border-radius:10px; background:#eff6ff; color:#0369a1; border:1px solid #bae6fd; cursor:pointer; font-weight:600; font-size:13.5px; transition:.15s;}
.btn-early-return:hover{ background:#dbeafe; }
:root[data-theme="dark"] .btn-early-return{ background:#0c1c2e; color:#7dd3fc; border-color:#0e3a5c; }

.card{ background: var(--card); border:1px solid var(--border); border-radius:18px; box-shadow: var(--shadow); }

.lbl{ display:block; font-size:13px; font-weight:600; color:var(--subtle); margin-bottom:5px; }
.inp{ width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid var(--input-border); background: var(--input-bg); color:var(--text); font-size:14px; font-family:inherit; }
.inp:focus{ outline:none; border-color: var(--primary); }
.inp-sm{ padding:6px 8px; border-radius:8px; border:1.5px solid var(--input-border); background:var(--input-bg); color:var(--text); font-size:12.5px; font-family:inherit; }
.hint-be{ font-size:11.5px; color:var(--subtle); margin-top:3px; }
.empty-hint{ padding:20px; text-align:center; color:var(--subtle); background:var(--chip-bg); border-radius:12px; font-size:13.5px; border:1px dashed var(--border);}

.cat-chip{ padding:9px 16px; border-radius:999px; border:2px solid var(--c); background:var(--c2); color:var(--text); font-weight:600; font-size:13.5px; cursor:pointer; transition:.15s;}
:root[data-theme="dark"] .cat-chip{ background:transparent; }
.cat-chip-active{ background: var(--c); color:#fff; }

.ms-dropdown{ position:relative; }
.ms-dropdown-btn{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 12px; border-radius:10px; border:1.5px solid var(--input-border); background:var(--input-bg); color:var(--text); font-size:13.5px; font-family:inherit; cursor:pointer; text-align:left; }
.ms-dropdown-btn:hover{ border-color: var(--primary); }
.ms-dropdown-btn-open{ border-color: var(--primary); }
.ms-dropdown-caret{ color:var(--subtle); font-size:11px; transition:.15s; }
.ms-dropdown-btn-open .ms-dropdown-caret{ transform:rotate(180deg); }
.ms-dropdown-panel{ position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:30; background:var(--card); border:1.5px solid var(--input-border); border-radius:12px; box-shadow: var(--shadow); padding:8px; }
.ms-dropdown-search{ width:100%; margin-bottom:6px; }
.ms-dropdown-search-wrap{ position:relative; margin-bottom:6px; }
.ms-dropdown-search-wrap .ms-dropdown-search{ margin-bottom:0; padding-left:2em; }
.ms-dropdown-search-icon{ position:absolute; left:0.6em; top:50%; transform:translateY(-50%); width:1em; height:1em; color:var(--muted, #888); pointer-events:none; }
.ms-dropdown-list{ max-height:200px; overflow-y:auto; }
.ms-dropdown-empty{ padding:14px 8px; text-align:center; color:var(--subtle); font-size:13px; }
.ms-dropdown-item{ display:flex; align-items:center; gap:9px; padding:8px 9px; border-radius:8px; cursor:pointer; font-size:13.5px; }
.ms-dropdown-item:hover{ background: var(--chip-bg); }
.ms-dropdown-item input{ width:16px; height:16px; accent-color: var(--primary); flex-shrink:0; }

.cat-grid{ display:grid; grid-auto-flow:column; grid-auto-columns:minmax(160px,1fr); gap:12px; overflow-x:auto; overflow-y:hidden; padding:6px 4px 14px; margin:-6px -4px -14px; scrollbar-width:none; -ms-overflow-style:none; }
.cat-grid::-webkit-scrollbar{ display:none; height:0; }
.cat-card{ position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; padding:22px 14px 16px; border-radius:16px; border:1.5px solid var(--border); background:var(--card); color:var(--text); cursor:pointer; transition:.18s ease; overflow:hidden; }
.cat-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--c); opacity:0; transition:.18s ease; }
.cat-card:hover{ border-color:var(--c); transform:translateY(-2px); box-shadow:0 10px 22px -10px color-mix(in srgb, var(--c) 55%, transparent); }
.cat-card:hover::before{ opacity:1; }
.cat-card-active{ border-color:var(--c); background:var(--c2); box-shadow:0 0 0 1.5px var(--c) inset, 0 10px 22px -10px color-mix(in srgb, var(--c) 55%, transparent); }
.cat-card-active::before{ opacity:1; }
:root[data-theme="dark"] .cat-card-active{ background:color-mix(in srgb, var(--c) 14%, transparent); }
.cat-card-check{ position:absolute; top:10px; right:10px; width:19px; height:19px; border-radius:999px; background:var(--c); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; line-height:1; box-shadow:0 2px 6px color-mix(in srgb, var(--c) 55%, transparent); }
.cat-card-icon-wrap{ width:48px; height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:color-mix(in srgb, var(--c) 15%, transparent); color:var(--c); font-size:24px; transition:.18s ease; }
.cat-card:hover .cat-card-icon-wrap, .cat-card-active .cat-card-icon-wrap{ background:var(--c); color:#fff; }
.cat-card-name{ font-weight:700; font-size:14px; margin-top:3px; }
.cat-card-count{ font-size:11.5px; color:var(--subtle); font-weight:600; }
.cat-card-pending{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700; color:#b45309; background:rgba(180,83,9,.1); border:1px solid rgba(180,83,9,.25); padding:3px 9px; border-radius:999px; margin-top:3px; white-space:nowrap; }
:root[data-theme="dark"] .cat-card-pending{ background:rgba(251,191,36,.12); border-color:rgba(251,191,36,.3); color:#fcd34d; }

.tool-panel{ border:1.5px solid var(--border); border-left:6px solid var(--c); border-radius:14px; overflow:hidden; }
.tool-panel-head{ padding:10px 14px; font-weight:700; background: var(--c2); color:var(--text); }
:root[data-theme="dark"] .tool-panel-head{ background:rgba(255,255,255,.03); }
.tool-list{ padding:6px 10px 10px; }
.tool-row{ display:flex; align-items:center; gap:10px; padding:8px 6px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.tool-row:last-child{ border-bottom:none; }
.tool-row-disabled{ opacity:.5; }
.chk{ width:17px; height:17px; accent-color: var(--primary); }
.qty-badge{ font-size:11.5px; padding:3px 9px; border-radius:999px; background:#dcfce7; color:#15803d; font-weight:700; white-space:nowrap;}
:root[data-theme="dark"] .qty-badge{ background:#0e2a1c; color:#4ade80; }
.qty-zero{ background:#fee2e2; color:#b91c1c; }
:root[data-theme="dark"] .qty-zero{ background:#3a1414; color:#f87171; }
.qty-input{ width:56px; padding:5px 6px; border-radius:8px; border:1.5px solid var(--input-border); background:var(--input-bg); color:var(--text); font-size:13px; }

.success-banner{ background: linear-gradient(90deg,#ecfdf5,#eff6ff); border:1.5px solid #a7f3d0; border-radius:16px; padding:16px 20px; }
:root[data-theme="dark"] .success-banner{ background: linear-gradient(90deg,#0e2a1c,#0c1c2e); border-color:#14532d; }

.pill{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700; background:var(--chip-bg); color:var(--subtle); }
.pill-ok{ background:#dcfce7; color:#15803d; }
:root[data-theme="dark"] .pill-ok{ background:rgba(34,197,94,.22); color:#4ade80; border:1px solid rgba(74,222,128,.45); }
.pill-warn{ background:#fef3c7; color:#92400e; }
:root[data-theme="dark"] .pill-warn{ background:rgba(245,158,11,.24); color:#fcd34d; border:1px solid rgba(251,191,36,.5); }
.pill-danger{ background:#fee2e2; color:#b91c1c; }
:root[data-theme="dark"] .pill-danger{ background:rgba(239,68,68,.26); color:#fca5a5; border:1px solid rgba(248,113,113,.55); }
.calib-row-danger{ background:rgba(254,226,226,.5); }
.calib-row-warn{ background:rgba(254,243,199,.5); }
:root[data-theme="dark"] .calib-row-danger{ background:rgba(58,20,20,.4); }
:root[data-theme="dark"] .calib-row-warn{ background:rgba(58,42,14,.4); }
.pill-clock{ background:rgba(255,255,255,.16); color:var(--header-text); border:1px solid rgba(255,255,255,.28); font-weight:600; font-size:12.5px; padding:5px 12px; letter-spacing:.2px; }
.mini-chip{ font-size:11px; padding:2px 8px; border-radius:999px; background: color-mix(in srgb, var(--c) 18%, transparent); border:1px solid var(--c); color:var(--text); white-space:nowrap;}

.table-wrap{ overflow-x:auto; }
.data-table{ width:100%; border-collapse:collapse; font-size:13px; }
.data-table th{ text-align:left; padding:9px 10px; background:var(--chip-bg); color:var(--subtle); font-weight:700; white-space:nowrap; border-bottom:2px solid var(--border);}
.data-table td{ padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }

const MEM = {}; // fallback in-memory store (used if Firestore is unreachable)

async function stGet(key, shared){
  // ข้อมูลที่ไม่ต้องแชร์ (เช่น ธีมของหน้าจอ) เก็บไว้ในเครื่องด้วย localStorage พอ
  if(!shared){
    try{
      const v = localStorage.getItem('local:'+key);
      return v !== null ? JSON.parse(v) : null;
    }catch(e){ return MEM[key] !== undefined ? MEM[key] : null; }
  }
  try{
    const snap = await db.collection(FS_COLLECTION).doc(key).get();
    if(!snap.exists) return null;
    const data = snap.data();
    return data && ('value' in data) ? data.value : null;
  }catch(e){ return MEM[key] !== undefined ? MEM[key] : null; }
}
async function stSet(key, value, shared){
  if(!shared){
    try{ localStorage.setItem('local:'+key, JSON.stringify(value)); }
    catch(e){ MEM[key] = value; }
    return;
  }
  try{ await db.collection(FS_COLLECTION).doc(key).set({ value: value }); }
  catch(e){ MEM[key] = value; }
}

let notifReadBorrows = new Set();
let notifReadLate = new Set();
let notifReadCalib = new Set();
async function loadNotifReadState(){
  const seeded = await stGet('notif:seeded', false);
  const rb = await stGet('notif:readBorrows', false);
  const rl = await stGet('notif:readLate', false);
  const rc = await stGet('notif:readCalib', false);
  notifReadBorrows = new Set(Array.isArray(rb) ? rb : []);
  notifReadLate = new Set(Array.isArray(rl) ? rl : []);
  notifReadCalib = new Set(Array.isArray(rc) ? rc : []);
  if(!seeded){
    // ครั้งแรกที่เปิดระบบในเครื่องนี้ ให้ถือว่ารายการที่มีอยู่แล้วเป็น "เคยเห็นแล้ว" ทั้งหมด
    // เพื่อไม่ให้แจ้งเตือนย้อนหลังของเก่าทั้งหมดพรวดเดียว
    state.borrows.forEach(b=>notifReadBorrows.add(b.id));
    lateActiveBorrows().forEach(b=>notifReadLate.add(b.id));
    calibAlertItems().forEach(e=>notifReadCalib.add(e.id));
    await persistNotifReadState();
    await stSet('notif:seeded', true, false);
  }
}
async function persistNotifReadState(){
  await stSet('notif:readBorrows', Array.from(notifReadBorrows), false);
  await stSet('notif:readLate', Array.from(notifReadLate), false);
  await stSet('notif:readCalib', Array.from(notifReadCalib), false);
}
function unreadNewBorrows(){
  return state.borrows
    .filter(b=>!notifReadBorrows.has(b.id))
    .sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
}
function unreadLateReturns(){
  return lateActiveBorrows().filter(b=>!notifReadLate.has(b.id));
}
// เครื่องมือที่ถึงกำหนด/ใกล้ถึงกำหนดสอบเทียบภายใน 30 วัน (รวมที่เลยกำหนดแล้ว)
function calibAlertItems(){
  return state.equipment.filter(e=>{
    if(!e.nextCalib) return false;
    const days = calibDaysLeft(e.nextCalib);
    return days!==null && days<=30;
  }).sort((a,b)=> (a.nextCalib||'').localeCompare(b.nextCalib||''));
}
function unreadCalibAlerts(){
  return calibAlertItems().filter(e=>!notifReadCalib.has(e.id));
}
function notifUnreadCount(){ return unreadNewBorrows().length + unreadLateReturns().length + unreadCalibAlerts().length; }
function notifTimeAgo(iso){
  if(!iso) return '';
  const then = new Date(iso).getTime();
  if(isNaN(then)) return '';
  const diffSec = Math.max(0, Math.round((Date.now()-then)/1000));
  if(diffSec < 60) return 'เมื่อสักครู่';
  const diffMin = Math.round(diffSec/60);
  if(diffMin < 60) return `${diffMin} นาทีที่แล้ว`;
  const diffHr = Math.round(diffMin/60);
  if(diffHr < 24) return `${diffHr} ชั่วโมงที่แล้ว`;
  const diffDay = Math.round(diffHr/24);
  return `${diffDay} วันที่แล้ว`;
}
async function toggleNotifPanel(){
  state.notif.open = !state.notif.open;
  render();
}
async function markAllNotifRead(){
  state.borrows.forEach(b=>notifReadBorrows.add(b.id));
  lateActiveBorrows().forEach(b=>notifReadLate.add(b.id));
  calibAlertItems().forEach(e=>notifReadCalib.add(e.id));
  await persistNotifReadState();
  render();
}
async function openNotifItem(type, id){
  if(type==='new'){ notifReadBorrows.add(id); }
  else if(type==='late'){ notifReadLate.add(id); }
  else if(type==='calib'){ notifReadCalib.add(id); }
  await persistNotifReadState();
  state.notif.open = false;
  if(type==='calib'){
    if(!state.loggedIn){ render(); return; }
    state.tab = 'manage';
    state.manage.view = 'calib';
    const e = state.equipment.find(x=>x.id===id);
    if(e){
      state.manage.calib = state.manage.calib || {catFilter:'', statusFilter:'', search:''};
      state.manage.calib.search = e.assetCode || e.name || '';
    }
    render();
    return;
  }
  const b = state.borrows.find(x=>x.id===id);
  if(!state.loggedIn){ render(); return; }
  state.tab = 'return';
  state.returnSubTab = type==='late' ? 'late' : 'all';
  state.returnSearch = b ? (b.code || '') : '';
  render();
}

function beYear(y){ return y + 543; }
// แปลง Date -> "YYYY-MM-DD" โดยใช้เวลาท้องถิ่น (ห้ามใช้ toISOString() เพราะจะแปลงเป็น UTC
// ซึ่งในโซนเวลาไทย (+7) จะทำให้เที่ยงคืนของวันนั้นๆ กลายเป็นวันก่อนหน้าใน UTC -> วันที่เพี้ยนไป 1 วัน)
function toLocalISODate(d){
  if(!(d instanceof Date) || isNaN(d)) return null;
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
// ตรวจว่าสตริงเป็นวันที่รูปแบบ ISO (YYYY-MM-DD) ที่ถูกต้องจริงหรือไม่
// ใช้ป้องกันไม่ให้ค่าที่เพี้ยน (เช่น "20261-08-1" จากข้อมูลเก่าที่เสียหาย) หลุดไปแสดงผลตรงๆ
function isValidISODate(s){
  if(!s || typeof s !== 'string') return false;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const d = new Date(s+'T00:00:00');
  return !isNaN(d) && toLocalISODate(d)===s;
}
// พยายามกู้วันที่จากสตริงที่เพี้ยน โดยดึงเฉพาะตัวเลขทั้งหมดแล้วตีความเป็น YYYYMMDD
// คืนค่า Date ที่ถูกต้อง หรือ null ถ้ากู้ไม่ได้
function salvageDateDigits(s){
  if(!s) return null;
  const digits = String(s).replace(/\D/g,'');
  if(digits.length<8) return null;
  const y = parseInt(digits.slice(0,4),10);
  const mo = parseInt(digits.slice(4,6),10);
  const da = parseInt(digits.slice(6,8),10);
  if(y<1900||y>2200||mo<1||mo>12||da<1||da>31) return null;
  const d = new Date(y, mo-1, da);
  return isNaN(d) ? null : d;
}
// ซ่อมรายการเครื่องมือที่ lastCalib/nextCalib เพี้ยนรูปแบบ (ไม่ใช่ YYYY-MM-DD ที่ถูกต้อง)
// คำนวณ nextCalib ใหม่จาก lastCalib (ถ้ากู้ได้) + รอบสอบเทียบ ให้ถูกต้องเสมอ
// ตั้ง "รอบสอบเทียบ (ปี)" ของเครื่องมือทุกชิ้นเป็น 1 ปี แล้วคำนวณวันสอบเทียบครั้งถัดไปใหม่ (ล่าสุด + 1 ปี)
async function setAllCalibCycleOne(){
  const targets = state.equipment.filter(e=> parseInt(e.calibCycle,10) !== 1);
  if(targets.length===0){ alert('เครื่องมือทุกชิ้นมีรอบสอบเทียบ 1 ปีอยู่แล้ว'); return; }
  if(!confirm(`พบเครื่องมือ ${targets.length} รายการที่รอบสอบเทียบไม่ใช่ 1 ปี\n\nต้องการตั้งเป็น 1 ปี และคำนวณวันสอบเทียบครั้งถัดไปใหม่ใช่หรือไม่?`)) return;
  targets.forEach(e=>{ e.calibCycle = 1; });
  syncNextCalib();
  autoUpdateCalibStatus();
  await saveEquipment();
  render();
  alert(`ตั้งรอบสอบเทียบเป็น 1 ปี สำเร็จ ${targets.length} รายการ`);
}
async function repairCalibDates(){
  let fixedCount = 0;
  const details = [];
  state.equipment.forEach(e=>{
    let changed = false;
    // normalize calibCycle ให้เป็นตัวเลขจริงเสมอ (ป้องกันบั๊กปีเพี้ยนจากการต่อสตริง เช่น 2026+"1"="20261")
    if(e.calibCycle!=null && typeof e.calibCycle !== 'number'){
      const n = parseInt(e.calibCycle,10);
      e.calibCycle = isNaN(n) ? 1 : n;
      changed = true;
    }
    let last = e.lastCalib ? e.lastCalib.slice(0,10) : null;
    if(last && !isValidISODate(last)){
      const salvaged = salvageDateDigits(last);
      const before = e.lastCalib;
      e.lastCalib = salvaged ? toLocalISODate(salvaged) : null;
      changed = true;
      details.push(`${e.name} (${e.assetCode||'-'}): สอบเทียบล่าสุด "${before}" → "${e.lastCalib||'-'}"`);
    }
    let next = e.nextCalib ? e.nextCalib.slice(0,10) : null;
    if(next && !isValidISODate(next)){
      const before = e.nextCalib;
      if(e.lastCalib && isValidISODate(e.lastCalib)){
        const cycle = parseInt(e.calibCycle,10) || 1;
        const d = new Date(e.lastCalib+'T00:00:00');
        d.setFullYear(d.getFullYear()+cycle);
        e.nextCalib = toLocalISODate(d);
      } else {
        const salvaged = salvageDateDigits(next);
        e.nextCalib = salvaged ? toLocalISODate(salvaged) : null;
      }
      changed = true;
      details.push(`${e.name} (${e.assetCode||'-'}): สอบเทียบครั้งถัดไป "${before}" → "${e.nextCalib||'-'}"`);
    }
    // เคสข้อมูลค้าง: ไม่มีวันสอบเทียบล่าสุดแล้ว (เคยถูกเคลียร์) แต่วันสอบเทียบครั้งถัดไปยังค้างค่าเก่าอยู่ (เกิดจากบั๊กเดิมที่แก้ไปแล้ว) — ล้างให้ตรงกัน
    if(!e.lastCalib && e.nextCalib){
      const before = e.nextCalib;
      e.nextCalib = null;
      changed = true;
      details.push(`${e.name} (${e.assetCode||'-'}): ล้างวันสอบเทียบครั้งถัดไปที่ค้างอยู่ "${before}" เนื่องจากไม่มีวันสอบเทียบล่าสุดแล้ว`);
    }
    if(changed) fixedCount++;
  });
  if(fixedCount===0){ alert('ไม่พบวันที่ที่ผิดรูปแบบในระบบ'); return; }
  await saveEquipment();
  render();
  alert(`ซ่อมข้อมูลวันที่สำเร็จ ${fixedCount} รายการ:\n\n${details.join('\n')}`);
}
// หาเครื่องมือต้นฉบับใน EQUIPMENT_SEED ที่ตรงกับเครื่องมือปัจจุบัน (เทียบจาก id ก่อน แล้วค่อย fallback ไปเทียบจากรหัสครุภัณฑ์)
function findSeedItem(e){
  let s = EQUIPMENT_SEED.find(x=>x.id===e.id);
  if(s) return s;
  if(e.assetCode && e.assetCode!=='ไม่มีเลขครุภัณฑ์'){
    s = EQUIPMENT_SEED.find(x=>x.assetCode===e.assetCode);
  }
  return s;
}
/* ===================== ซ่อมข้อมูล: กู้คืนสถานะ "ชำรุด" ที่เคยถูกเปลี่ยนเป็น "รอสอบเทียบ" โดยผิดพลาด =====================
   เดิมฟังก์ชัน autoUpdateCalibStatus() (และอีก 2 จุดที่บันทึกเครื่องมือ) จะเปลี่ยนสถานะใช้งาน (useStatus)
   ของเครื่องมือเป็น "รอสอบเทียบ" ทันทีที่วันสอบเทียบครั้งถัดไปเลยกำหนด โดย "ไม่ได้" กันไว้ว่าเครื่องมือ
   ชิ้นนั้นถูกแจ้ง "ชำรุด" อยู่ก่อนแล้ว ทำให้เครื่องมือที่ชำรุดถูกเขียนทับสถานะกลายเป็น "รอสอบเทียบ" ไปในวันถัดไป
   (ตอนนี้โค้ดที่เกี่ยวข้องทั้ง 3 จุดถูกแก้ให้กันเครื่องมือที่ "ชำรุด"/"ส่งสอบเทียบ" ไว้แล้ว ไม่เกิดซ้ำอีก)
   แต่ข้อมูลที่เคยถูกเขียนทับไปแล้วในฐานข้อมูลจะไม่ถูกแก้ย้อนหลังให้อัตโนมัติ ฟังก์ชันนี้จึงเทียบกับข้อมูลตั้งต้น
   ใน EQUIPMENT_SEED (ซึ่งบันทึกไว้ว่าเครื่องมือชิ้นไหน "ชำรุด" มาตั้งแต่แรก) แล้วกู้สถานะกลับให้ครั้งเดียว
====================================================================================== */
async function repairBrokenStatus(){
  let fixedCount = 0;
  const details = [];
  state.equipment.forEach(e=>{
    if(e.useStatus === 'รอสอบเทียบ'){
      const s = findSeedItem(e);
      if(s && s.useStatus === 'ชำรุด'){

}

   เวอร์ชันก่อนหน้าของระบบเคยมีฟีเจอร์ "ปิดใบยืมอัตโนมัติ" ที่ตั้งสถานะเป็น 'auto-returned'

async function migrateLegacyAutoReturned(){
  let migrated = false;
  state.borrows.forEach(b=>{
    if(b.status === 'auto-returned'){
      b.status = 'active';
      delete b.autoReturnedAt;
      delete b.actualReturnedAt;
      (b.itemsExpanded||[]).forEach(rec=>{ rec.returned = false; delete rec.returnedAt; });
      migrated = true;
    }
  });
  if(migrated) await saveBorrows();
}

async function migrateItemsExpandedFingerprint(){

/* ===================== Availability logic ===================== */
// ตรวจว่าช่วงวันที่สองช่วงทับซ้อนกันหรือไม่ (แบบ inclusive, เทียบสตริง YYYY-MM-DD ได้ตรงๆ)
function dateRangesOverlap(startA, endA, startB, endB){
  if(!startA || !endA || !startB || !endB) return true; // ถ้าไม่มีข้อมูลวันที่ครบ ให้ถือว่าอาจทับซ้อน (ปลอดภัยไว้ก่อน)
  return startA <= endB && startB <= endA;
}
// ตรวจว่ารหัสครุภัณฑ์นี้ "ใช้อ้างอิงตัวเครื่องได้จริง" หรือไม่ (ไม่ใช่ค่าว่าง/ค่า placeholder
// เช่น "ไม่มีเลขครุภัณฑ์", "-" ที่เครื่องมือหลายชิ้นอาจใช้ค่าเดียวกันซ้ำกันได้)
function isUsableAssetCode(code){
  if(!code) return false;
  const c = String(code).trim();
  if(!c || c === '-') return false;
  if(c.replace(/\s/g,'').includes('ไม่มี')) return false;
  return true;
}
// เครื่องมือชิ้นนี้ถูกจอง/ถืออยู่ "ในช่วงวันที่ที่ต้องการยืม" หรือไม่
// (แทนที่ตรรกะเดิมที่เช็คแค่ "มีใบยืม active อยู่หรือเปล่า" โดยไม่สนวันที่เลย
//  ซึ่งทำให้ใบยืมที่จองวันในอนาคตไปแล้ว บล็อกใบยืมอื่นที่วันที่ไม่ได้ทับซ้อนกันจริง)
// รับพารามิเตอร์เป็น "ตัวเครื่องมือ" ทั้งชิ้น (ไม่ใช่แค่ id) เพื่อให้เทียบได้ทั้งจาก id และจากรหัสครุภัณฑ์
// เหตุผล: ถ้าแอดมิน "ล้างฐานข้อมูลทั้งหมด" แล้วนำเข้าเครื่องมือใหม่ ระบบจะสร้าง id ใหม่ให้ทุกครั้ง
// ทำให้ใบยืมเก่าที่ยังไม่คืน (อ้างอิง id เดิม) หลุดการเชื่อมโยงกับเครื่องมือชิ้นเดิมที่นำเข้าใหม่
// การเทียบรหัสครุภัณฑ์เพิ่มเป็นชั้นสำรอง ช่วยให้ระบบยังจำได้ว่าเครื่องมือชิ้นนี้ถูกยืมค้างอยู่จริง
// จัดสรร \"ชิ้นที่ถือจริง\" ให้ใบยืมที่ id เดิมหายไป (เครื่องมือไม่มีรหัสครุภัณฑ์ เช่น กล่องโฟม)
// - แต่ละใบยืมได้ชิ้นตามจำนวนที่ยืม โดยไม่ซ้ำกับใบอื่นที่ช่วงวันที่ทับซ้อนกัน (ใบที่วันที่ไม่ทับกันใช้ชิ้นเดียวกันได้)
// - ผลคงที่ไม่ว่าจะถามด้วยช่วงวันที่ไหน และเก็บแคชไว้จนกว่าข้อมูลใบยืม/คลังจะเปลี่ยน
let __orphanAllocCache = { sig:null, map:null };
function getOrphanAllocation(){
  const today = todayISO();
  const equipment = state.equipment || [];
  const eqIds = new Set(equipment.map(e=>e.id));
  const active = state.borrows.filter(b=>b.status === 'active');
  const sig = today+'#'+equipment.length+'#'+active.map(b=>b.id+':'+((b.itemsExpanded&&b.itemsExpanded.length)? b.itemsExpanded.filter(x=>!x.returned).length : 'i')).join('|');
  if(__orphanAllocCache.sig === sig) return __orphanAllocCache.map;
  const rangeOf = b => [b.borrowDate, (b.returnDate && b.returnDate < today) ? '9999-12-31' : b.returnDate];
  const ordered = active.slice().sort((a,b)=> String(a.createdAt||a.code).localeCompare(String(b.createdAt||b.code)));
  const validBy = new Map();
  ordered.forEach(b=>{
    const s = new Set();
    ((b.itemsExpanded && b.itemsExpanded.length) ? b.itemsExpanded : []).forEach(x=>{ if(!x.returned && x.equipmentId && eqIds.has(x.equipmentId)) s.add(x.equipmentId); });
    validBy.set(b.id, s);
  });
  const map = new Map();
  ordered.forEach(b=>{
    const list = (b.itemsExpanded && b.itemsExpanded.length) ? b.itemsExpanded : (b.items||[]);
    const counts = {};
    list.forEach(it=>{
      if(it.returned || !it.category || !it.name) return;
      if(isUsableAssetCode(it.assetCode)) return;
      if(it.equipmentId && eqIds.has(it.equipmentId)) return;
      const k = it.category+'|'+it.name;
      counts[k] = (counts[k]||0) + ((list === b.items) ? (parseInt(it.qty,10)||1) : 1);
    });
    const mine = new Set();
    map.set(b.id, mine);
    const [s1,e1] = rangeOf(b);
    Object.keys(counts).forEach(k=>{
      const cut = k.indexOf('|');
      const cat = k.slice(0,cut), name = k.slice(cut+1);
      const unavailable = new Set(validBy.get(b.id));
      ordered.forEach(o=>{
        if(o === b) return;
        const [s2,e2] = rangeOf(o);
        if(!dateRangesOverlap(s1,e1,s2,e2)) return;
        validBy.get(o.id).forEach(id=>unavailable.add(id));
        (map.get(o.id) || []).forEach(id=>unavailable.add(id));
      });
      // เลือกชิ้นที่ "ยังไม่เคยถูกจัดให้ใบยืมอื่นเลย" ก่อน (ถึงวันที่ไม่ทับกัน) เพื่อให้นับจำนวนที่ว่างแบบระมัดระวัง
      const usedAnywhere = new Set();
      ordered.forEach(o=>{ if(o===b) return; validBy.get(o.id).forEach(id=>usedAnywhere.add(id)); (map.get(o.id)||[]).forEach(id=>usedAnywhere.add(id)); });
      const cands = equipment.filter(q=> q.category===cat && q.name===name && !isUsableAssetCode(q.assetCode) && !unavailable.has(q.id));
      cands.sort((x,y)=> (usedAnywhere.has(x.id)?1:0) - (usedAnywhere.has(y.id)?1:0));
      cands.slice(0, counts[k]).forEach(q=>mine.add(q.id));
    });
  });
  __orphanAllocCache = { sig, map };
  return map;
}
function unitIsHeldForRange(equipment, borrowDate, returnDate){
  const equipmentId = (typeof equipment === 'object' && equipment) ? equipment.id : equipment;
  const equipmentAssetCode = (typeof equipment === 'object' && equipment) ? equipment.assetCode : null;
  const equipmentCategory = (typeof equipment === 'object' && equipment) ? equipment.category : null;
  const equipmentName = (typeof equipment === 'object' && equipment) ? equipment.name : null;
  const equipmentOrder = (typeof equipment === 'object' && equipment) ? equipment.order : null;
  const assetCodeUsable = isUsableAssetCode(equipmentAssetCode);
  const today = todayISO();
  for(const b of state.borrows){
    if(b.status !== 'active') continue;
    const list = (b.itemsExpanded && b.itemsExpanded.length) ? b.itemsExpanded : b.items;
    const usesUnit = (()=>{
      let orphanCount = 0;   // จำนวนชิ้น (ไม่มีรหัสครุภัณฑ์) ที่ใบยืมถืออยู่ แต่ id เดิมไม่มีในคลังแล้ว
      for(const it of list){
        if(it.returned) continue;
        // จับคู่ตาม "ประเภท + ชื่อเครื่องมือ + รหัสครุภัณฑ์" ที่บันทึกไว้ในใบยืมนั้นเลย
        if(it.category && it.name){
          if(it.category !== equipmentCategory || it.name !== equipmentName) continue;
          const itCodeUsable = isUsableAssetCode(it.assetCode);
          if(itCodeUsable || assetCodeUsable){
            if(itCodeUsable && assetCodeUsable && String(it.assetCode).split(',').map(s=>s.trim()).includes(String(equipmentAssetCode).trim())) return true;
            continue;
          }
          // ทั้งสองฝั่งไม่มีรหัสครุภัณฑ์ (เช่น กล่องโฟม): แยกชิ้นด้วย id
          if(it.equipmentId === equipmentId) return true;
          const idStillExists = it.equipmentId && (state.equipment||[]).some(q=>q.id === it.equipmentId);
          if(!idStillExists) orphanCount += (list === b.items ? (parseInt(it.qty,10)||1) : 1);
        } else if(it.equipmentId === equipmentId){
          return true;   // ใบยืมเก่าที่ไม่มีข้อมูลประเภท/ชื่อ: ใช้ id
        }
      }
      // id เดิมหายไป → ใช้ผลจัดสรรชิ้นที่ใบยืมนี้ถืออยู่จริง (ไม่ซ้ำกับใบอื่นที่ช่วงวันที่ทับกัน)
      if(orphanCount > 0){
        const alloc = getOrphanAllocation().get(b.id);
        if(alloc && alloc.has(equipmentId)) return true;
      }
      return false;
    })();
    if(!usesUnit) continue;
    // ใบยืมนี้ยัง "active" และเครื่องมือชิ้นนี้ "ยังไม่คืน" — ถ้าเลยกำหนดวันคืน (returnDate) มาแล้ว
    // แปลว่าเครื่องมือชิ้นนี้ยังถูกถืออยู่จริงเกินกว่าช่วงวันที่แจ้งไว้ตอนแรก (ยืมสาย/ค้างคืน)
    // จึงต้องถือว่า "ถูกถืออยู่" ต่อเนื่องไปเรื่อย ๆ จนกว่าจะมีคนกดคืนจริง ไม่ใช่จำกัดแค่ช่วง borrowDate–returnDate เดิม
    // มิฉะนั้นเมื่อวันนี้ผ่านพ้นกำหนดคืนไปแล้ว ระบบจะเข้าใจผิดว่าเครื่องมือ "ว่าง" ทั้งที่ยังไม่ได้คืนจริง
    const effectiveEnd = (b.returnDate && b.returnDate < today) ? '9999-12-31' : b.returnDate;
    if(dateRangesOverlap(b.borrowDate, effectiveEnd, borrowDate, returnDate)) return true;
  }
  return false;
}
// เผื่อเรียกโดยไม่ระบุช่วงวันที่ (เช่น หน้าจัดการเครื่องมือทั่วไป) — ใช้ "วันนี้" เป็นค่าเริ่มต้น
// เพื่อบอกว่าตอนนี้ ณ ขณะนี้ เครื่องมือถูกถืออยู่จริงหรือไม่
function unitIsHeld(equipment, borrowDate, returnDate){
  const bd = borrowDate || todayISO();
  const rd = returnDate || todayISO();
  return unitIsHeldForRange(equipment, bd, rd);
}

/* ===================== Per-item return tracking ===================== */
// Returns one row per item-name within a borrow, with per-unit return progress
function itemGroupsForBorrow(b){
  return (b.items||[]).map(it=>{
    const unitIds = (it.equipmentIds && it.equipmentIds.length) ? it.equipmentIds.slice() : (it.equipmentId? [it.equipmentId] : []);
    const returnedUnitIds = unitIds.filter(id=>{
      const rec = (b.itemsExpanded||[]).find(x=>x.equipmentId===id);
      return rec && rec.returned;
    });
    const remainingUnitIds = unitIds.filter(id=>!returnedUnitIds.includes(id));
    return {
      name: it.name, category: it.category, assetCode: it.assetCode, qty: it.qty,
      unitIds, returnedUnitIds, remainingUnitIds,
      returnedQty: returnedUnitIds.length, remainingQty: remainingUnitIds.length,
    };
  });
}
function borrowReturnedUnitCount(b){ return (b.itemsExpanded||[]).filter(x=>x.returned).length; }
function borrowTotalUnitCount(b){ return (b.itemsExpanded && b.itemsExpanded.length) ? b.itemsExpanded.length : (b.items||[]).reduce((s,i)=>s+i.qty,0); }
function isBorrowFullyReturned(b){
  if(!b.itemsExpanded || !b.itemsExpanded.length) return false;
  return b.itemsExpanded.every(x=>x.returned);
}
function isBorrowPartiallyReturned(b){
  const c = borrowReturnedUnitCount(b);
  return c>0 && !isBorrowFullyReturned(b);
}
function borrowStatusBadge(b){
  if(b.status==='early-returned') return '<span class="pill pill-ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.16em;margin-right:0.32em;display:inline-block;flex:none"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg> คืนก่อน</span>';
  if(b.status==='late-returned') return '<span class="pill pill-danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.16em;margin-right:0.32em;display:inline-block;flex:none"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> เลยระยะเวลายืม</span>';
  if(b.status==='returned') return '<span class="pill pill-ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.16em;margin-right:0.32em;display:inline-block;flex:none"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> ตามระยะเวลา</span>';
  if(isBorrowPartiallyReturned(b)) return `<span class="pill pill-warn">คืนบางส่วน (${borrowReturnedUnitCount(b)}/${borrowTotalUnitCount(b)})</span>`;
  if(b.status==='active' && borrowTimingCategory(b)==='late') return `<span class="pill pill-danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.16em;margin-right:0.32em;display:inline-block;flex:none"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> เลยกำหนดคืนแล้ว ${daysLate(b)} วัน (ยังไม่คืน)</span>`;
  return '<span class="pill pill-ok">อนุมัติ/ใช้งานอยู่</span>';
}
function itemsSummaryLine(b){
  // one-line summary showing returned progress per item, e.g. "กล้อง x2 (คืนแล้ว 1), เชือก x1"
  return itemGroupsForBorrow(b).map(g=>{
    const extra = g.returnedQty>0 ? ` (คืนแล้ว ${g.returnedQty}/${g.qty})` : '';
    return esc(g.name)+' x'+g.qty+extra;
  }).join(', ');
}
function isCalibExpired(item){
  if(!item.nextCalib) return false;
  const today = todayISO();
  return item.nextCalib < today;
}
/* บังคับให้ "สอบเทียบครั้งถัดไป" = "สอบเทียบล่าสุด" + รอบสอบเทียบ (ปี) เสมอ
   แก้ปัญหาข้อมูลที่ import จาก Excel หรือค้างจากของเก่า ทำให้วันถัดไปไม่ตรงกับวันล่าสุด (เช่น ล่าสุด 2026 แต่ถัดไปเป็น 2025) */
function syncNextCalib(list){
  let changed = false;
  (list || state.equipment).forEach(e=>{
    // รอบสอบเทียบทุกชิ้นคงที่ 1 ปี
    if(e.calibCycle !== 1){ e.calibCycle = 1; changed = true; }
    const last = e.lastCalib ? String(e.lastCalib).slice(0,10) : '';
    if(!last || !isValidISODate(last)) return;
    const cycle = 1;
    const d = new Date(last+'T00:00:00');
    d.setFullYear(d.getFullYear() + cycle);
    const expected = toLocalISODate(d);
    const cur = e.nextCalib ? String(e.nextCalib).slice(0,10) : '';
    if(cur !== expected){
      e.nextCalib = expected;
      if(e.importLockNextCalib !== undefined) e.importLockNextCalib = expected;
      changed = true;
    }
  });
  return changed;
}
/* ===================== Auto-update สถานะใช้งาน ตามวันสอบเทียบครั้งถัดไป =====================
   ถ้าวันที่ "สอบเทียบครั้งถัดไป" (nextCalib) ของเครื่องมือ เกินวันที่ปัจจุบันแล้ว (เลยกำหนด)
   ระบบจะปรับ "สถานะใช้งาน" (useStatus) ของเครื่องมือชิ้นนั้นให้เป็น "รอสอบเทียบ" ให้อัตโนมัติทันที
====================================================================================== */
function autoUpdateCalibStatus(list){
  const today = todayISO();
  let changed = false;
  (list || state.equipment).forEach(item=>{
    // สถานะที่มาจากไฟล์นำเข้า: ยึดตามไฟล์ ไม่ปรับอัตโนมัติ จนกว่าวันสอบเทียบครั้งถัดไปจะถูกเปลี่ยน (เช่น บันทึกผลสอบเทียบใหม่)
    if(item.importLockNextCalib !== undefined && item.importLockNextCalib === (item.nextCalib||'')) return;
    if(item.nextCalib && item.nextCalib < today && item.useStatus !== 'รอสอบเทียบ' && item.useStatus !== 'ชำรุด' && item.useStatus !== 'ส่งสอบเทียบ'){
      item.useStatus = 'รอสอบเทียบ';
      changed = true;
    }
  });
  return changed;
}
function isReadyBorrowable(item, borrowDate, returnDate){
  return item.useStatus === 'ใช้งานได้' && !isCalibExpired(item) && !unitIsHeld(item, borrowDate, returnDate);
}
function isPendingCalibBorrowable(item, borrowDate, returnDate){
  if(unitIsHeld(item, borrowDate, returnDate)) return false;
  return item.useStatus === 'รอสอบเทียบ' || (item.useStatus === 'ใช้งานได้' && isCalibExpired(item));
}
function isBorrowable(item, borrowDate, returnDate){
  return isReadyBorrowable(item, borrowDate, returnDate) || isPendingCalibBorrowable(item, borrowDate, returnDate);
}
// group by category+name -> { readyItems (พร้อมใช้ ให้ยืมก่อน), pendingItems (รอสอบเทียบ ให้ยืมทีหลัง), availItems (รวม เรียงพร้อมใช้ก่อน) }
// borrowDate/returnDate = ช่วงวันที่ที่ต้องการยืม ถ้าไม่ส่งมาจะ default เป็น "วันนี้" (สถานะ ณ ปัจจุบัน)
function groupEquipment(category, borrowDate, returnDate){
  const groups = {};
  state.equipment.filter(e=>e.category===category).forEach(e=>{
    const key = e.name;
    if(!groups[key]) groups[key] = { name: e.name, category, items: [], readyItems: [], pendingItems: [], availItems: [] };
    groups[key].items.push(e);
    if(isReadyBorrowable(e, borrowDate, returnDate)) groups[key].readyItems.push(e);
    else if(isPendingCalibBorrowable(e, borrowDate, returnDate)) groups[key].pendingItems.push(e);
  });
  Object.values(groups).forEach(g=>{
    g.availItems = g.readyItems.concat(g.pendingItems);
    g.order = Math.min(...g.items.map(x=> (typeof x.order==='number') ? x.order : Infinity));
  });
  return Object.values(groups).sort((a,b)=>{
    if(a.order!==b.order) return a.order-b.order;
    return a.name.localeCompare(b.name,'th');
  });
}

// เรียงลำดับใหม่: ให้กลุ่มเครื่องมือ (ชื่อเดียวกัน) ในหมวดหมู่หนึ่ง ๆ เรียงตาม newOrderNames ที่แอดมินกำหนด
async function saveEquipmentOrder(category, newOrderNames){
  newOrderNames.forEach((name, idx)=>{
    state.equipment.forEach(e=>{
      if(e.category===category && e.name===name){ e.order = idx; }
    });
  });
  await saveEquipment();
}

async function moveEquipGroup(category, name, dir){
  const groups = groupEquipment(category);
  const idx = groups.findIndex(g=>g.name===name);
  const swapIdx = idx + dir;
  if(idx<0 || swapIdx<0 || swapIdx>=groups.length) return;
  const names = groups.map(g=>g.name);
  [names[idx], names[swapIdx]] = [names[swapIdx], names[idx]];
  await saveEquipmentOrder(category, names);
  render();
}

function nextOrderForCategory(cat){
  let max = -1;
  state.equipment.forEach(e=>{
    if(e.category===cat && typeof e.order==='number') max = Math.max(max, e.order);
  });
  return max+1;
}

// กำหนดค่า order เริ่มต้นให้เครื่องมือที่ยังไม่มีค่า (เรียกครั้งแรกหลังโหลดข้อมูล)
function ensureEquipOrder(){
  let changed = false;
  const seenInCat = {};
  state.equipment.forEach(e=>{
    if(typeof e.order !== 'number'){
      const key = e.category;
      if(seenInCat[key]===undefined) seenInCat[key] = 0;
      e.order = seenInCat[key]++;
      changed = true;
    } else {
      const key = e.category;
      seenInCat[key] = Math.max(seenInCat[key]||0, e.order+1);
    }
  });
  return changed;
}


// ตัดใบยืมที่ id ซ้ำกัน (เกิดจากการกดยืนยันซ้ำในอดีต) เหลือไว้ใบแรกของแต่ละ id
function dedupeBorrowsById(list){
  if(!Array.isArray(list)) return list;
  const seen = new Set();
  return list.filter(b=>{
    if(!b || !b.id) return true;
    if(seen.has(b.id)) return false;
    seen.add(b.id); return true;
  });
}

// ข้อมูลเก่าที่บันทึกไว้เป็น "สตฉ" (ไม่มีจุด) ทั้งชื่อหน่วยงานและรหัสใบยืม ให้แสดง/นับรวมเป็น "สตฉ." (ปรับในหน่วยความจำเท่านั้น)
// ชื่อหมวดเก่า: "ด้านคอมพิวเตอร์" -> "คอมพิวเตอร์" (ตัดคำว่า "ด้าน" ออก) และ "เสียง"/"ยานพาหนะ" -> "ด้านเสียง"/"ด้านยานพาหนะ" (ปรับในหน่วยความจำเท่านั้น)
const LEGACY_CAT_MAP = {'ด้านคอมพิวเตอร์':'คอมพิวเตอร์', 'เสียง':'ด้านเสียง', 'ยานพาหนะ':'ด้านยานพาหนะ'};
function fixLegacyCat(x){
  if(x && typeof x.category === 'string' && LEGACY_CAT_MAP[x.category]) x.category = LEGACY_CAT_MAP[x.category];
}
function normalizeLegacyCategories(list){
  if(Array.isArray(list)) list.forEach(fixLegacyCat);
  return list;
}
function normalizeLegacyDepts(list){
  const fixCode = (c)=> (typeof c === 'string' && c.indexOf('สตฉ-') === 0) ? 'สตฉ.-' + c.slice(4) : c;
  if(Array.isArray(list)) list.forEach(x=>{
    if(!x) return;
    if(x.dept === 'สตฉ') x.dept = 'สตฉ.';
    // รหัสใบยืม/ใบคืนเก่า เช่น สตฉ-0001/2569 -> สตฉ.-0001/2569
    if(x.code) x.code = fixCode(x.code);
    fixLegacyCat(x);
    if(Array.isArray(x.items)) x.items.forEach(fixLegacyCat);
    if(Array.isArray(x.itemsExpanded)) x.itemsExpanded.forEach(fixLegacyCat);
    if(x.borrowCode) x.borrowCode = fixCode(x.borrowCode);
  });
  return list;
}

function nextBorrowCode(dept){
  const prefix = dept;
  const count = state.borrows.filter(b=>b.dept===dept).length + 1;
  return `${prefix}-${String(count).padStart(4,'0')}/${beYear(new Date().getFullYear())}`;
}
function nextReturnCode(dept){
  const prefix = dept;
  const count = state.returns.filter(r=>r.dept===dept).length + 1;
  return `${prefix}-คส-${String(count).padStart(4,'0')}/${beYear(new Date().getFullYear())}`;
}


const root = document.getElementById('app');
let dragCtx = null;
let dragRAF = null;
function render(){
  if(dragCtx) return; // ระหว่างลากจัดลำดับ ห้ามวาดหน้าจอใหม่ (กันรายการหลุด/กระตุกจากข้อมูล realtime ที่เข้ามาระหว่างลาก)
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = (active && typeof active.selectionStart==='number') ? active.selectionStart : null;
  const selEnd = (active && typeof active.selectionEnd==='number') ? active.selectionEnd : null;
  // จำตำแหน่งเลื่อนของหน้าจอและของรายการใน dropdown ตัวกรอง ไว้คืนค่าหลังวาดใหม่ (กันหน้าเด้งขึ้นบน/รายการเด้งกลับต้นทุกครั้งที่ติ๊กเลือก)
  const _sx = window.scrollX, _sy = window.scrollY;
  const _dlScroll = {};
  document.querySelectorAll('.ms-dropdown-list').forEach(el=>{ const k = el.closest('[data-dropdown]'); if(k) _dlScroll[k.dataset.dropdown] = el.scrollTop; });
  const _keepScroll = Object.keys(_dlScroll).length > 0;

  root.innerHTML = `
    ${renderHeader()}
    <div class="max-w-7xl mx-auto px-4 pb-16" id="main-content">
      ${state.tab==='borrow' ? renderBorrowTab() : ''}
      ${state.tab==='return' ? (state.loggedIn ? renderReturnTab() : renderLogin('return')) : ''}
      ${state.tab==='manage' ? (state.loggedIn ? renderManageTab() : renderLogin('manage')) : ''}
      ${state.tab==='reports' ? (state.loggedIn ? renderReportsTab() : renderLogin('reports')) : ''}
    </div>
    ${renderPrintSlipContainer()}
    ${state.pendingBorrow ? renderConfirmBorrowModal() : ''}
    ${state.viewingBorrowId ? renderBorrowDetailModal() : ''}
    ${state.slipPreviewId ? renderSlipPreviewModal() : ''}
    ${state.partialReturnId ? renderPartialReturnModal() : ''}
    ${state.availCal ? renderAvailabilityCalendarModal() : ''}
    ${state.calibConfirmIds ? renderCalibConfirmModal() : ''}
    ${state.repairConfirmIds ? renderRepairConfirmModal() : ''}
    ${state.clearConfirm ? renderClearConfirmModal() : ''}
    ${state.expandedChart ? renderChartExpandModal() : ''}
  `;
  attachHandlers();
  if(state.slipPreviewId) fitSlipPreview();
  if(typeof updateLiveClock==='function') updateLiveClock();

  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!==null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }

  if(state.tab==='reports' && state.loggedIn) drawReportCharts();

  if(_keepScroll){
    document.querySelectorAll('.ms-dropdown-list').forEach(el=>{ const k = el.closest('[data-dropdown]'); if(k && _dlScroll[k.dataset.dropdown]!=null) el.scrollTop = _dlScroll[k.dataset.dropdown]; });
    window.scrollTo({ left:_sx, top:_sy, behavior:'instant' });
  }
}

  const hasAlert = count > 0;
  return `

    const tx = x.type==='new' ? (x.b.createdAt||'') : (x.type==='late' ? (x.b.returnDate||'') : (x.e.nextCalib||''));
    const ty = y.type==='new' ? (y.b.createdAt||'') : (y.type==='late' ? (y.b.returnDate||'') : (y.e.nextCalib||''));

            <div class="notif-icon late"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.16em;margin-right:0.32em;display:inline-block;flex:none"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>

              <div class="notif-sub">${esc(b.dept||'-')} • ${esc(b.name||'-')} • เลยกำหนด ${dl} วัน</div>

            </div>

          </div>`;
        }
      }).join('')}
    </div>
  </div>`;
}

/* ===================== ตาราง "คืนเครื่องมือแต่ละชิ้น" =====================
   แถวหัว = ใบยืม (รหัสใบยืม + สรุปทั้งหมด/คืนแล้ว/ค้าง)
   แถวย่อย = เครื่องมือแต่ละชิ้นในใบยืมนั้น พร้อมวันที่คืนจริง (อิงจาก returnedAt ที่บันทึกตอนกดคืนในระบบ)
   แสดงเฉพาะใบยืมที่มีการคืนแล้วอย่างน้อย 1 ชิ้น */
function unitReturnIso(b, rec){
  if(!rec || !rec.returned) return '';
  let iso = rec.returnedAt ? String(rec.returnedAt).slice(0,10) : '';
  if(!iso && b.actualReturnedAt) iso = toLocalISODate(new Date(b.actualReturnedAt));
  return iso;
}
function unitReturnBadge(b, rec){
  if(!rec.returned) return '<span class="pill pill-warn">ยังไม่คืน</span>';
  const iso = unitReturnIso(b, rec), due = b.returnDate;
  if(!iso) return '<span class="pill">คืนแล้ว (ไม่ระบุวัน)</span>';
  if(!due || iso < due) return '<span class="pill pill-ok">คืนก่อนกำหนด</span>';
  if(iso === due) return '<span class="pill pill-ok">คืนตามระยะเวลา</span>';
  const d = Math.round((new Date(iso+'T00:00:00') - new Date(due+'T00:00:00'))/86400000);
  return `<span class="pill pill-danger">เลยกำหนด ${d} วัน</span>`;
}
/* ----- ตัวกรองช่วงเวลา (อิงวันที่คืนจริง) — แยกอิสระจากตัวกรองในหน้ารายงาน ----- */
function itemReturnPeriod(){
  if(!state.itemReturnPeriod){
    const n = new Date();
    state.itemReturnPeriod = { mode:'month', month:n.getMonth(), year:n.getFullYear(), fy:n.getFullYear()+543, half:'oct-mar', weekStart:'' };
  }
  return state.itemReturnPeriod;
}
function itemReturnRange(){
  const p = itemReturnPeriod();
  if(p.mode==='all') return null;
  if(p.mode==='week') return weekRange(p.weekStart || todayISO());
  if(p.mode==='month') return monthRange(p.month, p.year);
  if(p.mode==='half') return halfRange(p.half, p.fy);
  if(p.mode==='fy') return fiscalRange(p.fy);
  return null;
}
function unitInRange(u, range){
  if(!range) return true;
  return !!u.iso && u.iso >= range.start && u.iso <= range.end;
}
/* ใบยืมที่มีการคืนอย่างน้อย 1 ชิ้นในช่วง range (null = ทั้งหมด)
   แถวย่อยที่แสดง = ชิ้นที่คืนในช่วงนั้น + ชิ้นที่ยังไม่คืน (ชิ้นที่คืนนอกช่วงจะถูกซ่อน) */
function itemReturnGroups(range){
  const groups = [];
  state.borrows.forEach(b=>{
    const exp = b.itemsExpanded || [];
    if(!exp.some(r=>r.returned)) return;
    const units = exp.map(rec=>{
      const it = (b.items||[]).find(i=>{
        const ids = (i.equipmentIds && i.equipmentIds.length) ? i.equipmentIds : (i.equipmentId ? [i.equipmentId] : []);
        return ids.includes(rec.equipmentId);
      });
      const eq = state.equipment.find(x=>x.id===rec.equipmentId);
      return {
        rec,
        name: rec.name || (eq && eq.name) || (it && it.name) || 'เครื่องมือ',
        assetCode: rec.assetCode || (eq && eq.assetCode) || '',
        iso: unitReturnIso(b, rec),
      };
    });
    if(!units.some(u=>u.rec.returned && unitInRange(u, range))) return;
    groups.push({ b, allUnits: units, shown: units.filter(u=> !u.rec.returned || unitInRange(u, range)) });
  });
  return groups;
}
/* ผลลัพธ์ที่แสดงจริง = ช่วงเวลา + คำค้นหา
   - ค้นหาตรงกับชื่อเครื่องมือ/รหัสครุภัณฑ์ -> แสดงเฉพาะหัวใบยืม + เครื่องมือชิ้นที่ตรงเท่านั้น
   - ค้นหาตรงกับรหัสใบยืม/ผู้ยืม/หน่วยงาน/พื้นที่ -> แสดงเครื่องมือทุกชิ้นของใบนั้น */
function itemReturnView(){
  const q = (state.returnSearch||'').trim().toLowerCase();
  const range = itemReturnRange();
  let groups = itemReturnGroups(range);
  let searching = false;
  if(q){
    const out = [];
    groups.forEach(g=>{
      const matched = g.shown.filter(u=> u.name.toLowerCase().includes(q) || String(u.assetCode).toLowerCase().includes(q));
      if(matched.length){ out.push({ ...g, shown: matched, byUnit:true }); return; }
      const b = g.b;
      if((b.code||'').toLowerCase().includes(q) || (b.name||'').toLowerCase().includes(q)
         || (b.dept||'').toLowerCase().includes(q) || (b.province||'').toLowerCase().includes(q)) out.push(g);
    });
    groups = out; searching = true;
  }
  groups.forEach(g=>{
    const isos = g.shown.filter(u=>u.rec.returned && u.iso && unitInRange(u, range)).map(u=>u.iso).sort();
    g.firstIso = isos[0] || ''; g.lastIso = isos[isos.length-1] || '';
  });
  groups.sort((x,y)=> (y.lastIso||'').localeCompare(x.lastIso||'') || (x.b.code||'').localeCompare(y.b.code||''));
  return { groups, range, q, searching };
}
function renderItemReturnTable(){
  const p = itemReturnPeriod();
  const { groups, range, q, searching } = itemReturnView();
  const collapsed = state.itemReturnCollapsed || (state.itemReturnCollapsed = {});
  const totalReturned = groups.reduce((s,g)=>s+g.shown.filter(u=>u.rec.returned).length,0);
  let prevInfo = '';
  if(range){
    const prev = getPreviousRange(range);
    prevInfo = ` • เทียบกับช่วงก่อนหน้า ${fmtDateBE(prev.start)} — ${fmtDateBE(prev.end)} (พบใบยืม ${itemReturnGroups(prev).length} รายการ)`;
  }
  const chev = (open)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;transition:.15s;transform:rotate(${open?90:0}deg)"><polyline points="9 18 15 12 9 6"/></svg>`;
  const sel = (v,cur)=> v===cur ? 'selected' : '';
  return `
    <div class="flex flex-wrap gap-3 items-end mb-3">
      <div>
        <label class="lbl">ช่วงเวลา (วันที่คืนจริง)</label>
        <select id="ir-mode" class="inp">
          <option value="week" ${sel('week',p.mode)}>รายสัปดาห์</option>
          <option value="month" ${sel('month',p.mode)}>รายเดือน</option>
          <option value="half" ${sel('half',p.mode)}>ราย 6 เดือน</option>
          <option value="fy" ${sel('fy',p.mode)}>รายปีงบประมาณ</option>
          <option value="all" ${sel('all',p.mode)}>ทั้งหมด</option>
        </select>
      </div>
      ${p.mode==='week' ? `<div><label class="lbl">วันเริ่มสัปดาห์</label><input type="date" id="ir-week" class="inp" value="${p.weekStart||todayISO()}"/></div>` : ''}
      ${p.mode==='month' ? `
        <div><label class="lbl">เดือน</label>
          <select id="ir-month" class="inp">${THAI_MONTHS.map((m,i)=>`<option value="${i}" ${p.month===i?'selected':''}>${m}</option>`).join('')}</select>
        </div>
        <div><label class="lbl">ปี พ.ศ.</label><input type="number" id="ir-year" class="inp" value="${beYear(p.year)}"/></div>` : ''}
      ${p.mode==='half' ? `
        <div><label class="lbl">ช่วง</label>
          <select id="ir-half" class="inp">
            <option value="oct-mar" ${sel('oct-mar',p.half)}>ตุลาคม - มีนาคม</option>
            <option value="apr-sep" ${sel('apr-sep',p.half)}>เมษายน - กันยายน</option>
          </select>
        </div>
        <div><label class="lbl">ปีงบประมาณ พ.ศ.</label><input type="number" id="ir-fy" class="inp" value="${p.fy}"/></div>` : ''}
      ${p.mode==='fy' ? `<div><label class="lbl">ปีงบประมาณ พ.ศ.</label><input type="number" id="ir-fy2" class="inp" value="${p.fy}"/></div>` : ''}
    </div>
    <div class="text-sm subtle mb-4">${range ? `ช่วงข้อมูล: ${fmtDateBE(range.start)} — ${fmtDateBE(range.end)} • ` : 'ช่วงข้อมูล: ทั้งหมด • '}พบใบยืม ${groups.length} รายการ${prevInfo}</div>
    <div class="mb-4">
      <label class="lbl">ค้นหา (รหัสใบยืม / ผู้ยืม / หน่วยงาน / พื้นที่ / ชื่อเครื่องมือ / รหัสครุภัณฑ์)</label>
      <input id="ret-search" class="inp" value="${esc(state.returnSearch||'')}" placeholder="พิมพ์เพื่อค้นหา หรือเว้นว่างเพื่อดูรายการทั้งหมด"/>
    </div>
    <h3 class="font-bold mb-1">รายละเอียดการคืนเครื่องมือแต่ละชิ้น</h3>
    <p class="text-sm subtle mb-3">${groups.length} ใบยืม • คืนแล้ว ${totalReturned} ชิ้น • วันที่คืนจริงอิงจากวันที่กดคืนในระบบ • ${searching ? 'ค้นหาตรงกับชื่อเครื่องมือ จะแสดงเฉพาะชิ้นที่ตรงกัน' : 'กดที่แถวใบยืมเพื่อย่อ/ขยายรายการเครื่องมือ'}</p>
    ${groups.length>0 ? `<div class="flex gap-2 mb-3 flex-wrap">
      <button type="button" class="btn-ghost" data-act="collapse-all-item-return">ย่อทั้งหมด (เห็นเฉพาะหัวใบยืม)</button>
      <button type="button" class="btn-ghost" data-act="expand-all-item-return">ขยายทั้งหมด</button>
    </div>` : ''}
    ${groups.length===0 ? `<div class="empty-hint">${q ? 'ไม่พบรายการคืนที่ตรงกับคำค้นหานี้ในช่วงเวลาที่เลือก' : 'ไม่มีการคืนเครื่องมือในช่วงเวลาที่เลือก'}</div>` : `
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr>
          <th>ใบยืม / เครื่องมือ</th><th>วันที่ยืม</th><th>กำหนดคืน</th><th>วันที่คืน (จริง)</th><th>สถานะ</th>
          <th style="text-align:center">ทั้งหมด</th><th style="text-align:center">คืนแล้ว</th><th style="text-align:center">ค้าง</th>
        </tr></thead>
        <tbody>
          ${groups.map(g=>{
            const b = g.b;
            const open = (g.byUnit && searching) ? true : !collapsed[b.id];
            const total = g.allUnits.length;
            const done = g.allUnits.filter(u=>u.rec.returned).length;
            const left = total - done;
            const lastTxt = g.lastIso ? (g.firstIso!==g.lastIso ? fmtDateShort(g.firstIso)+' – '+fmtDateShort(g.lastIso) : fmtDateShort(g.lastIso)) : '-';

/* ย่อ/ขยายใบยืมในหน้าต่างตัวอย่างให้พอดีจอ (ทั้งกว้างและสูง) ไม่ต้องเลื่อน
   ถ้าย่อจนเล็กเกินอ่านไม่ออก (ใบยืมยาวหลายรายการ) จะยึดความกว้างเป็นหลักแล้วเลื่อนขึ้นลงแทน */
function fitSlipPreview(){
  const box = document.querySelector('.slip-preview-scroll');
  const fit = document.querySelector('.slip-preview-fit');
  const paper = document.querySelector('.slip-preview-paper');
  if(!box || !fit || !paper) return;
  const apply = ()=>{
    paper.style.transform = 'none';
    const pw = paper.offsetWidth, ph = paper.offsetHeight;
    if(!pw || !ph) return;
    // เลขหน้า (รหัสอ้างอิง + หน้า/ทั้งหมด) มุมขวาบนของแต่ละหน้า A4 เหมือนตอนพิมพ์/PDF
    paper.querySelectorAll('.slip-pageno').forEach(n=>n.remove());
    const pagePx = pw * 297 / 210, totalPg = Math.max(1, Math.ceil((ph - 4) / pagePx));
    for(let i=0;i<totalPg;i++){
      const n = document.createElement('div');
      n.className = 'slip-pageno';
      n.style.top = (i*pagePx + pw*14/210) + 'px';
      n.textContent = (paper.dataset.ref||'') + '\u00A0\u00A0\u00A0' + (i+1) + '/' + totalPg;
      paper.appendChild(n);
    }
    const top = box.getBoundingClientRect().top;
    box.style.maxHeight = Math.max(200, window.innerHeight - top - 24) + 'px';
    const availW = box.clientWidth - 24;
    const availH = window.innerHeight - top - 24 - 24;
    const sW = availW / pw, sH = availH / ph;
    let scale = Math.min(sW, sH, 1.6);
    if(scale < 0.6) scale = Math.min(sW, 1.6);   // เล็กเกินไป -> ยึดความกว้าง แล้วเลื่อนแนวตั้ง
    if(state.slipExpanded) scale = Math.min(sW, 3);   // โหมดขยาย: ยึดความกว้างเต็มจอ แล้วเลื่อนอ่านแนวตั้ง
    paper.style.transform = 'scale(' + scale + ')';
    fit.style.width = (pw * scale) + 'px';
    fit.style.height = (ph * scale) + 'px';
  };
  apply();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if(document.querySelector('.slip-preview-paper')===paper) apply(); });
  setTimeout(()=>{ if(document.querySelector('.slip-preview-paper')===paper) apply(); }, 250);
}
window.addEventListener('resize', ()=>{ if(state.slipPreviewId) fitSlipPreview(); });

/* วันที่คืนจริงของเครื่องมือแต่ละชิ้น (บันทึกเป็นวันที่ admin กดคืน) — ข้อมูลเก่าที่ไม่มี returnedAt จะใช้วันที่ปิดใบยืมแทนถ้ามี */
function returnedDateLabel(b, unitId){
  const rec = (b.itemsExpanded||[]).find(x=>x.equipmentId===unitId);
  let iso = rec && rec.returnedAt ? String(rec.returnedAt).slice(0,10) : '';
  if(!iso && b.actualReturnedAt) iso = toLocalISODate(new Date(b.actualReturnedAt));
  return iso ? 'เมื่อ ' + fmtDateBE(iso) : 'ไม่ระบุวันที่คืน';
}

function openPartialReturn(id){
  const b = state.borrows.find(x=>x.id===id);
  if(!b) return;
  state.partialReturnId = id;
  // ค่าเริ่มต้น: เลือกทุกชิ้นที่ยังไม่คืนไว้ก่อน (กด "ยืนยันคืน" เฉยๆ = คืนทั้งหมดเหมือนเดิม)
  const sel = new Set();
  itemGroupsForBorrow(b).forEach(g=>g.remainingUnitIds.forEach(uid=>sel.add(uid)));
  state.partialReturnSelected = sel;
  render();
}
async function returnSelectedItems(id, unitIds){
  const b = state.borrows.find(x=>x.id===id);
  if(!b || !unitIds || !unitIds.length) return;
  const today = todayISO();   // วันที่คืน = วันที่ admin กดคืนจริงเท่านั้น (ไม่รับค่าย้อนหลัง/ล่วงหน้าจากภายนอก)
  (b.itemsExpanded||[]).forEach(rec=>{
    if(!rec.returned && unitIds.includes(rec.equipmentId)){ rec.returned = true; rec.returnedAt = today; }
  });
  if(isBorrowFullyReturned(b)){
    let newStatus;
    if(!b.returnDate || today < b.returnDate) newStatus = 'early-returned';
    else if(today === b.returnDate) newStatus = 'returned';
    else newStatus = 'late-returned';
    b.status = newStatus;
    b.actualReturnedAt = new Date().toISOString();
  }
  state.partialReturnId = null;
  state.partialReturnSelected = new Set();
  await saveBorrows();
  render();
}

              <div class="tool-row ${remain===0?'tool-row-disabled':''}">

                <input type="number" min="1" max="${single?1:remain}" value="${qty||1}" class="qty-input"
                  ${remain===0||!checked?'disabled':''} ${single?'readonly title="ยืมได้ครั้งละ 1 รายการ"':''}
                  data-act="qty-tool" data-cat="${cat}" data-name="${escAttr(g.name)}"/>
              </div>${single ? `<div class="hint-be" style="padding:2px 14px 8px 40px;color:#b45309"><b>หมายเหตุ :</b> ยืมได้ครั้งละ 1 รายการ — จำนวนที่ต้องการยืมให้เขียนในช่องว่างในใบยืม</div>` : ''}`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function renderSuccessBanner(){
  const b = state.borrows.find(x=>x.id===state.lastCreatedBorrowId);
  if(!b) return '';
  const ns = state.notifyStatus[b.id];
  let noteHTML = '';
  if(ns==='sending') noteHTML = `<div class="text-sm mt-1" style="color:#0369a1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.16em;margin-right:0.32em;display:inline-block;flex:none"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> กำลังสร้างไฟล์ PDF อัปโหลด และส่งอีเมลแจ้งเตือนแอดมินอัตโนมัติ...</div>`;

  else if(ns==='sent_no_link') noteHTML = `<div class="text-sm mt-1" style="color:#92400e"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.16em;margin-right:0.32em;display:inline-block;flex:none"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> ส่งอีเมลแจ้งเตือนแอดมินแล้ว แต่ไม่มีลิงก์ไฟล์ (ยังไม่ได้ตั้งค่า Cloudinary) กรุณากด "ดาวน์โหลด PDF" แล้วส่งเอง</div>`;
  else if(ns==='failed') noteHTML = `<div class="text-sm mt-1" style="color:#b91c1c"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.16em;margin-right:0.32em;display:inline-block;flex:none"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> ส่งอีเมลแจ้งเตือนอัตโนมัติไม่สำเร็จ กรุณากดปุ่ม "แจ้งเตือนแอดมิน" ด้านล่างเพื่อลองใหม่</div>`;
  return `

    <div class="flex items-center justify-between flex-wrap gap-3">
      <div>
        <div class="font-bold text-lg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.16em;margin-right:0.32em;display:inline-block;flex:none"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> ยื่นคำขอยืมสำเร็จ — รหัสใบยืม: ${b.code}</div>
        <div class="text-sm subtle">ระบบได้บันทึกรายการเรียบร้อยแล้ว สามารถพิมพ์/ดาวน์โหลดใบยืมได้ด้านล่าง</div>
        ${noteHTML}

        <button class="btn-ghost" data-act="dismiss-banner">ปิด</button>
      </div>
    </div>
  </div>`;
}

function renderCalibConfirmModal(){
  const ids = state.calibConfirmIds || [];
  const list = ids.map(id=>state.equipment.find(x=>x.id===id)).filter(Boolean);
  if(list.length===0){ state.calibConfirmIds=null; return ''; }
  const baseDateISO = (state.calibConfirmForm && state.calibConfirmForm.date) || todayISO();
  const nextDateFor = (e, baseISO)=>{
    const cycle = parseInt(e.calibCycle,10) || 1;
    const d = new Date((baseISO||todayISO())+'T00:00:00');
    d.setFullYear(d.getFullYear()+cycle);
    return toLocalISODate(d);
  };
  const isMulti = list.length>1;
  const bodyHtml = isMulti
    ? `<div class="calib-confirm-list">
        ${list.map(e=>`
          <div class="calib-confirm-list-item">
            <div class="calib-confirm-list-name">${esc(e.name)}</div>
            <div class="calib-confirm-list-sub">${esc(e.assetCode||'-')} &nbsp;•&nbsp; กำหนดใหม่ <span class="calib-confirm-nextdate-preview" data-cycle="${parseInt(e.calibCycle,10)||1}">${fmtDateBEShort2(nextDateFor(e, baseDateISO))}</span></div>
          </div>`).join('')}
      </div>`
    : `<div class="calib-confirm-detail">
        <div class="calib-confirm-row"><span class="subtle">รายการ</span><b>${esc(list[0].name)}</b></div>
        <div class="calib-confirm-row"><span class="subtle">รหัสพัสดุ</span><span>${esc(list[0].assetCode||'-')}</span></div>
        <div class="calib-confirm-row"><span class="subtle">กำหนดสอบเทียบครั้งถัดไป</span><span class="calib-confirm-nextdate-preview" data-cycle="${parseInt(list[0].calibCycle,10)||1}">${fmtDateBEShort2(nextDateFor(list[0], baseDateISO))}</span></div>
      </div>`;
  const form = state.calibConfirmForm || {};
  const formHtml = `
    <div class="calib-confirm-form mt-4">
      <div><label class="lbl">วันที่สอบเทียบ *</label>
        <input type="date" id="calib-confirm-date" class="inp" value="${esc(baseDateISO)}"/>
      </div>
      <div><label class="lbl">หน่วยงานที่ทำ *</label>
        <input type="text" id="calib-confirm-agency" class="inp" placeholder="เช่น บริษัท/หน่วยงานผู้สอบเทียบ" value="${esc(form.agency||'')}"/>
      </div>
      <div><label class="lbl">ค่าใช้จ่าย (บาท) *</label>
        <input type="number" id="calib-confirm-cost" class="inp" min="0" step="0.01" placeholder="0.00" value="${esc(form.cost||'')}"/>
      </div>
      <div><label class="lbl">รายการแก้ไข *</label>
        <textarea id="calib-confirm-fixitems" class="inp" rows="3" placeholder="ระบุรายการที่ได้ทำการแก้ไข/ปรับปรุง">${esc(form.fixItems||'')}</textarea>
      </div>
      ${state.calibConfirmError ? `<div class="calib-confirm-form-error">${esc(state.calibConfirmError)}</div>` : ''}
    </div>`;
  return `
  <div class="modal-backdrop" data-act="cancel-calib-confirm">
    <div class="modal-card calib-confirm-card">
      <div class="calib-confirm-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h3 class="text-lg font-bold mb-1 text-center">ยืนยันผลการสอบเทียบ</h3>
      <p class="text-sm subtle mb-4 text-center">${isMulti ? `ยืนยันว่าเครื่องมือทั้ง ${list.length} รายการนี้ได้ทำการสอบเทียบเสร็จเรียบร้อยแล้วใช่หรือไม่?` : 'ยืนยันว่าเครื่องมือนี้ได้ทำการสอบเทียบเสร็จเรียบร้อยแล้วใช่หรือไม่?'}</p>
      ${bodyHtml}
      ${formHtml}
      <div class="mt-6 flex justify-end gap-2">
        <button class="btn-ghost" data-act="cancel-calib-confirm">ยกเลิก</button>
        <button class="btn-primary" data-act="confirm-calib-done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.16em;margin-right:0.32em;display:inline-block;flex:none"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> ยืนยัน สอบเทียบแล้ว${isMulti?` (${list.length})`:''}</button>
      </div>
    </div>
  </div>`;

      <div><label class="lbl">ค่าใช้จ่าย (บาท) *</label>
        <input type="number" id="repair-confirm-cost" class="inp" min="0" step="0.01" placeholder="0.00" value="${esc(form.cost||'')}"/>
      </div>
      <div><label class="lbl">รายละเอียดการซ่อม *</label>
        <textarea id="repair-confirm-fixitems" class="inp" rows="3" placeholder="ระบุอาการชำรุด/รายการที่ได้ทำการซ่อมแซม">${esc(form.fixItems||'')}</textarea>
      </div>

  <div class="modal-backdrop" data-act="cancel-repair-confirm">
    <div class="modal-card calib-confirm-card">
      <div class="calib-confirm-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>

      </div>
    </div>
  </div>`;
}

function renderClearConfirmModal(){
  const cc = state.clearConfirm;
  if(!cc) return '';
  const now = Date.now();
  const locked = cc.lockedUntil && cc.lockedUntil > now;
  const secsLeft = locked ? Math.ceil((cc.lockedUntil - now)/1000) : 0;
  return `
  <div class="modal-backdrop" data-act="cancel-clear-confirm">
    <div class="modal-card calib-confirm-card">
      <div class="calib-confirm-icon" style="color:#ef4444;border-color:#ef4444">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      </div>
      <h3 class="text-lg font-bold mb-1 text-center">${esc(cc.title || 'ล้างฐานข้อมูลเครื่องมือทั้งหมด')}</h3>
      <p class="text-sm subtle mb-4 text-center">${cc.warnHtml}</p>
      <div class="mt-2">
        <label class="lbl">กรอกรหัสยืนยันเพื่อดำเนินการต่อ *</label>
        <input type="password" id="clear-confirm-code" class="inp" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
          placeholder="รหัสยืนยัน" ${locked?'disabled':''} />
        ${cc.error ? `<div class="calib-confirm-form-error">${esc(cc.error)}</div>` : ''}
        ${locked ? `<div class="calib-confirm-form-error">กรอกผิดหลายครั้งเกินไป กรุณารออีก ${secsLeft} วินาทีแล้วลองใหม่</div>` : ''}
      </div>
      <div class="mt-6 flex justify-end gap-2">
        <button class="btn-ghost" data-act="cancel-clear-confirm">ยกเลิก</button>
        <button class="btn-danger" data-act="confirm-clear-do" ${locked?'disabled':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.16em;margin-right:0.32em;display:inline-block;flex:none"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> ${cc.kind==='dashboard' ? 'ยืนยันล้างข้อมูล Dashboard' : 'ยืนยันล้างฐานข้อมูล'}</button>
      </div>
    </div>
  </div>`;
}
