const SLIP_LOGO_PRINT = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="18mm" height="17.6mm" viewBox="0 0 203 199"><image width="203" height="199" href="' + SLIP_LOGO + '"/></svg>');
function buildSlipHTML(b){
  const itemsRows = b.items.map((it,i)=>{
    const codes = String(it.assetCode||'-').split(',').map(s=>s.trim()).filter(Boolean);
    const codeHtml = (codes.length? codes.map(c=>`<div class="assetcode-line">${esc(c)}</div>`).join('') : '-');
    return `
    <tr>
      <td class="c">${i+1}</td>
      <td>${esc(it.category||'-')}</td>
      <td>${esc(it.name)}</td>
      <td class="assetcode-cell">${codeHtml}</td>
      <td class="c">${it.qty}</td>
      <td class="chk-cell"></td>
      <td class="chk-cell"></td>
    </tr>`;
  }).join('');
  const bookingDateISO = b.createdAt ? b.createdAt.slice(0,10) : null;
  return `
  <div class="slip-page">
    <div class="slip-header-line"><img class="slip-logo" src="${SLIP_LOGO}" alt=""/><span>ใบยืมเครื่องมือ กตพ.</span></div>

    <div class="slip-field-row slip-field-two">
      <div><b>ใบยืมเลขที่ :</b> ${esc(slipHeaderRef(b.code))}</div>
      <div class="slip-col2"><b>วันที่จอง :</b> ${bookingDateISO? esc(fmtDateBE(bookingDateISO)) : '-'}${b.createdTime? ' &nbsp; เวลา '+esc(b.createdTime) : ''}</div>
    </div>
    <div class="slip-field-row"><b>เรียน หน.ศูนย์สนับสนุนฯ ผ่าน ผอ.${esc(b.dept||'')}</b></div>
    <div class="slip-field-row slip-field-two">
      <div><b>ชื่อ-นามสกุล ผู้ยืม :</b> ${esc(b.name)}</div>
      <div class="slip-col2">${b.position?'<b>ตำแหน่ง :</b> '+esc(b.position):''}</div>
    </div>
    <div class="slip-field-row slip-field-two">
      <div><b>วันที่ยืม :</b> ${esc(fmtDateBE(b.borrowDate))}</div>
      <div class="slip-col2"><b>ถึงวันที่ :</b> ${esc(fmtDateBE(b.returnDate))}</div>
    </div>
    <div class="slip-field-row"><b>พื้นที่นำไปใช้งาน :</b> ${esc(b.province)}${b.notes?' &nbsp;&nbsp; <b>กรณี :</b> '+esc(b.notes):''}</div>

    <div class="slip-section-title-row">
      <div class="slip-section-title">รายการเครื่องมือที่ยืม</div>
    </div>
    <table class="slip-table">
      <thead><tr><th style="width:6%">ลำดับ</th><th style="width:11%">ประเภท</th><th>ชื่อเครื่องมือ</th><th style="width:22%">รหัสครุภัณฑ์</th><th style="width:7%">จำนวน</th><th class="chk-col" style="width:9%">สภาพ<br/>ก่อนใช้งาน</th><th class="chk-col" style="width:9%">สภาพ<br/>หลังใช้งาน</th></tr></thead>
      <tbody>${itemsRows}
        <tr class="slip-remark-row">
          <td colspan="4" style="border:none;padding:4px 0 0;vertical-align:bottom;"><div style="display:flex;align-items:flex-end;white-space:nowrap;height:2.1em;"><span style="flex-shrink:0;"><b>หมายเหตุ :</b></span><span style="flex:1 1 auto;border-bottom:1px dotted rgba(0,0,0,.55);height:0;min-width:1.5em;margin:0 0 0.3em 6px;"></span></div></td>
          <td colspan="3" style="border:none;padding:4px 0 0;vertical-align:bottom;"><div style="display:flex;align-items:flex-end;justify-content:flex-end;white-space:nowrap;height:2.1em;"><span>ผู้ตรวจสอบ</span></div></td>
        </tr>
      </tbody>
    </table>
    <table class="sig-grid"><tbody>
      <tr>${buildSigBox('ผู้ยืม')}${buildSigBox('ผู้ให้ยืม')}</tr>
      <tr>${buildSigBox('ผู้คืนพัสดุ')}${buildSigBox('ผู้รับคืนพัสดุ')}</tr>
    </tbody></table>
  </div>`;
}

function printSlip(id){
  const b = state.borrows.find(x=>x.id===id);
  if(!b) return;
  document.getElementById('print-area').innerHTML = buildSlipHTML(b);
  document.body.classList.add('printing-slip');

  // ใส่เลขหน้ามุมขวาบน (เฉพาะตอนพิมพ์ใบยืม) ด้วย CSS @page margin box ล้วนๆ ไม่กระทบวิธีพิมพ์เดิม
  const pageNumStyle = document.createElement('style');
  pageNumStyle.id = 'slip-page-number-style';
  const refCssText = slipHeaderRef(b.code).replace(/\\/g,'\\\\').replace(/"/g,'\\"').replace(/[\r\n]/g,' ');
  pageNumStyle.textContent = `@media print{
    @page{ margin-top:18mm;
      @top-left{ content:url('${SLIP_LOGO_PRINT}'); vertical-align:bottom; text-align:left; padding-left:14mm; }
      @top-right{ content: "${refCssText}\\A0\\A0\\A0(" counter(page) "/" counter(pages) ")"; font-size:14pt; color:#000; font-family:'TH Sarabun PSK','Sarabun',sans-serif; vertical-align:bottom; padding-bottom:7mm; }
      @top-center{ content:""; } @bottom-left{ content:""; } @bottom-center{ content:""; } @bottom-right{ content:""; } }
    body.printing-slip .slip-page{ padding-top:0; }
    body.printing-slip .slip-logo{ display:none; }
  }`;
  document.head.appendChild(pageNumStyle);

  const doPrint = ()=>{
    // สองรอบ requestAnimationFrame เพื่อรอให้เบราว์เซอร์จัดเลย์เอาต์/ความกว้างคอลัมน์ของตาราง
    // ให้เสร็จก่อนสั่งพิมพ์ ไม่งั้นรอบแรกที่กดจะพิมพ์ด้วยเลย์เอาต์เก่าที่ยังไม่ถูกจัดใหม่
    // (คอลัมน์ตารางบีบจนข้อความตกบรรทัดเยอะ กลายเป็น 2 หน้า)
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        window.print();
        setTimeout(()=>{
          document.body.classList.remove('printing-slip');
          pageNumStyle.remove();
        }, 500);
      });
    });
  };

  // รอให้ฟอนต์ที่ใช้ในใบยืมโหลดเสร็จก่อน (ถ้าเบราว์เซอร์รองรับ) เพื่อกันปัญหาความกว้างตัวอักษร
  // เปลี่ยนหลังพิมพ์ไปแล้วในบางเครื่อง
  // โลโก้ในขอบบน (@top-left) ต้องโหลดให้เสร็จก่อนสั่งพิมพ์ ไม่งั้นรอบแรกจะไม่ขึ้น
  const logoReady = new Promise(res=>{ const im = new Image(); im.onload = im.onerror = ()=>res(); im.src = SLIP_LOGO_PRINT; window._slipLogoImg = im; });
  if(document.fonts && document.fonts.ready){
    Promise.all([document.fonts.ready, logoReady]).then(doPrint).catch(doPrint);
  } else {
    logoReady.then(doPrint);
  }
}

async function buildPDFDataUriFromHTML(html, css, refText){
  if(!window.html2canvas || !window.jspdf) throw new Error('ไม่พบไลบรารีสร้าง PDF (html2canvas/jsPDF)');
  const { jsPDF } = window.jspdf;

  const container = document.createElement('div');
  container.style.position = 'fixed';
  container.style.left = '-99999px';
  container.style.top = '0';
  container.style.width = '210mm';
  container.style.background = '#ffffff';
  container.innerHTML = `<style>${css}</style>${html}`;
  document.body.appendChild(container);

  // รอให้ฟอนต์ TH Sarabun PSK โหลดเสร็จ + เลย์เอาต์เสถียรก่อนจับภาพ
  // (ปกติฟอนต์ควรถูก preload ไว้แล้วตั้งแต่เปิดหน้าเว็บผ่าน preloadSlipFonts() แต่ยังคงกันเผื่อไว้ที่นี่ด้วย
  // สำหรับกรณีที่ผู้ใช้กดสร้าง PDF เร็วมากก่อนฟอนต์โหลดเสร็จ)
  try{
    await Promise.all([
      document.fonts.load("400 14pt 'TH Sarabun PSK'"),
      document.fonts.load("700 14pt 'TH Sarabun PSK'"),
    ]);
    await document.fonts.ready;
  }catch(e){ /* ถ้าโหลดฟอนต์ไม่สำเร็จ จะ fallback ไปฟอนต์อื่นแทน */ }

  // บังคับให้เบราว์เซอร์รีโฟลว์/รีเพนต์ด้วยฟอนต์ที่โหลดเสร็จแล้วจริงๆ ก่อนวัดขนาด/จับภาพ
  // (แค่รอ document.fonts.ready อย่างเดียว บางเบราว์เซอร์ยังไม่ทันสลับฟอนต์ในเฟรมถัดไปทันที
  // ทำให้ตอนกดครั้งแรกในเซสชัน คอลัมน์ตารางยังคำนวณจากฟอนต์สำรอง กลายเป็นคอลัมน์แคบผิดปกติ)
  void container.offsetHeight; // force reflow ครั้งแรก
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  void container.offsetHeight; // force reflow อีกครั้งหลัง 2 เฟรม
  await new Promise(r=>setTimeout(r, 120));

  try{ await Promise.all(Array.from(container.querySelectorAll('img')).map(im=>im.decode?im.decode().catch(()=>{}):Promise.resolve())); }catch(e){}
  const PDF_PAGE_WIDTH_MM = 210, PDF_PAGE_HEIGHT_MM = 297, PDF_EXTRA_GAP_MM = 10; // ขนาด A4 + ระยะห่างพิเศษจากหัวกระดาษเมื่อถูกดันไปหน้าใหม่

  // ป้องกันไม่ให้แถวในตารางรายการเครื่องมือถูกตัด/ซ้อนกันข้ามหน้ากระดาษ -> ถ้าแถวไหนไม่พอ ดันทั้งแถวไปเริ่มหน้าใหม่
  try{
    const rows = Array.from(container.querySelectorAll('.slip-table tr'));
    for(const row of rows){
      const containerRect = container.getBoundingClientRect();
      const ratioMmPerPx = PDF_PAGE_WIDTH_MM / containerRect.width;
      const rowRect = row.getBoundingClientRect();
      const topMm = (rowRect.top - containerRect.top) * ratioMmPerPx;
      const bottomMm = (rowRect.bottom - containerRect.top) * ratioMmPerPx;
      for(let boundary = PDF_PAGE_HEIGHT_MM; boundary < bottomMm; boundary += PDF_PAGE_HEIGHT_MM){
        if(topMm < boundary && boundary < bottomMm){
          const gapPx = (boundary - topMm + PDF_EXTRA_GAP_MM) / ratioMmPerPx;
          const colCount = row.children.length || 1;
          const spacer = document.createElement('tr');
          spacer.innerHTML = `<td colspan="${colCount}" style="border:none; padding:0; height:${gapPx}px;"></td>`;
          row.parentNode.insertBefore(spacer, row);
          break;
        }
      }
    }
  }catch(e){ /* ถ้าคำนวณไม่ได้ ปล่อยผ่าน ใช้เลย์เอาต์ปกติ */ }

  // ป้องกันไม่ให้ส่วนลงชื่อ (sig-grid) ถูกตัดข้ามหน้ากระดาษ -> ถ้าไม่พอ ดันทั้งบล็อกไปหน้าถัดไป
  try{
    const sigEl = container.querySelector('.sig-grid');
    if(sigEl){
      const containerRect = container.getBoundingClientRect();
      const ratioMmPerPx = PDF_PAGE_WIDTH_MM / containerRect.width;
      const sigRect = sigEl.getBoundingClientRect();
      const topMm = (sigRect.top - containerRect.top) * ratioMmPerPx;
      const bottomMm = (sigRect.bottom - containerRect.top) * ratioMmPerPx;
      for(let boundary = PDF_PAGE_HEIGHT_MM; boundary < bottomMm; boundary += PDF_PAGE_HEIGHT_MM){
        if(topMm < boundary && boundary < bottomMm){
          const extraPx = (boundary - topMm + PDF_EXTRA_GAP_MM) / ratioMmPerPx;
          const currentMarginTop = parseFloat(getComputedStyle(sigEl).marginTop) || 0;
          sigEl.style.marginTop = (currentMarginTop + extraPx) + 'px';
          break;
        }
      }
    }
  }catch(e){ /* ถ้าคำนวณไม่ได้ ปล่อยผ่าน ใช้เลย์เอาต์ปกติ */ }

  let dataUri;
  try{
    const canvas = await html2canvas(container, { scale: 1.3, useCORS: true, backgroundColor: '#ffffff' });
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth;
    const imgHeight = canvas.height * imgWidth / canvas.width;
    const imgData = canvas.toDataURL('image/jpeg', 0.72);

    let heightLeft = imgHeight;
    let position = 0;
    pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while(heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }

    // ใส่เลขหน้าที่มุมขวาบนของทุกหน้า
    const totalPages = pdf.internal.getNumberOfPages();
    for(let p = 1; p <= totalPages; p++){
      pdf.setPage(p);
      // วาดข้อความ "เลขที่ใบยืม (หน้า/ทั้งหมด)" เป็นภาพ เพราะ jsPDF ไม่มีฟอนต์ไทย — ใช้ฟอนต์/ขนาดเดียวกับตัวอักษรในใบยืม (TH Sarabun PSK 14pt)
      const topText = (refText ? refText + '\u00A0\u00A0\u00A0' : '') + `(${p}/${totalPages})`;
      const cv = document.createElement('canvas');
      const sc = 8, fontPx = 14;
      const cx = cv.getContext('2d');
      const fnt = `${fontPx*sc}px 'TH Sarabun PSK','Sarabun',sans-serif`;
      cx.font = fnt;
      const tw = cx.measureText(topText).width;
      cv.width = Math.ceil(tw)+4; cv.height = Math.ceil(fontPx*sc*1.5);
      cx.font = fnt;
      cx.fillStyle = '#000000'; cx.textBaseline = 'middle';
      cx.fillText(topText, 2, cv.height/2);
      const wMm = cv.width/sc*0.3528, hMm = cv.height/sc*0.3528;
      pdf.addImage(cv.toDataURL('image/png'), 'PNG', pageWidth - 10 - wMm, 17.5 - hMm*0.62, wMm, hMm);
    }

    dataUri = pdf.output('datauristring');
  } finally {
    document.body.removeChild(container);
  }
  return dataUri;
}
async function buildSlipPDFDataUri(b){
  return buildPDFDataUriFromHTML(buildSlipHTML(b), SLIP_STANDALONE_CSS, slipHeaderRef(b.code));
}
function downloadSlipPDF(id){

    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }).catch(err=>{
    alert('สร้างไฟล์ PDF ไม่สำเร็จ: ' + err.message);

function dataUriToBlob(dataUri){
  const [header, base64] = dataUri.split(',');
  const mimeMatch = header.match(/data:(.*?);base64/);
  const mime = mimeMatch ? mimeMatch[1] : 'application/pdf';
  const bin = atob(base64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type: mime});
}


async function uploadSlipPDFToCloudinary(b){
  if(!CLOUDINARY_READY) throw new Error('ยังไม่ได้ตั้งค่า Cloudinary (CLOUDINARY_CONFIG)');
  const pdfDataUri = await buildSlipPDFDataUri(b);
  const blob = dataUriToBlob(pdfDataUri);
  const form = new FormData();
  form.append('file', blob, pdfFileName(b));
  form.append('upload_preset', CLOUDINARY_CONFIG.uploadPreset);
  form.append('public_id', `borrow-slips/${b.code.replace(/[\/\\]/g,'-')}-${Date.now()}`);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CONFIG.cloudName}/raw/upload`, {
    method: 'POST', body: form,
  });
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error('อัปโหลดไฟล์ขึ้น Cloudinary ไม่สำเร็จ: ' + t);
  }
  const data = await res.json();
  if(!data.secure_url) throw new Error('ไม่พบลิงก์ไฟล์จาก Cloudinary');
  return data.secure_url;
}

function calibDaysLeft(nextCalib){
  if(!nextCalib) return null;
  const today = new Date(todayISO()+'T00:00:00');
  const next = new Date(nextCalib.slice(0,10)+'T00:00:00');
  return Math.round((next-today)/86400000);
}
function calibStatusInfo(nextCalib){
  const days = calibDaysLeft(nextCalib);
  if(days===null) return {cls:'', pill:'', label:'-'};
  if(days<0) return {cls:'calib-row-danger', pill:'pill-danger', label:`เลยกำหนด ${Math.abs(days)} วัน`};
  if(days<=90) return {cls:'calib-row-warn', pill:'pill-warn', label:`เหลือ ${days} วัน`};
  return {cls:'calib-row-ok', pill:'pill-ok', label:`เหลือ ${days} วัน`};
}
function renderCalibTab(){
  const cm = state.manage.calib || (state.manage.calib = {catFilter:'', statusFilter:'', search:''});
  let items = state.equipment.filter(e=>!!e.nextCalib);
  if(cm.catFilter) items = items.filter(e=>e.category===cm.catFilter);
  if(cm.search) items = items.filter(e=>(e.name+e.assetCode+e.brand+e.model).toLowerCase().includes(cm.search.toLowerCase()));
  items = items.map(e=>({...e, calibInfo:calibStatusInfo(e.nextCalib), calibDaysLeft:calibDaysLeft(e.nextCalib)}));
  if(cm.statusFilter==='danger') items = items.filter(e=>e.calibInfo.pill==='pill-danger');
  else if(cm.statusFilter==='warn') items = items.filter(e=>e.calibInfo.pill==='pill-warn');
  else if(cm.statusFilter==='ok') items = items.filter(e=>e.calibInfo.pill==='pill-ok');
  // เรียงเป็น 3 กลุ่มตามสถานะ: ใกล้ถึงกำหนด ก่อน -> ยังไม่ถึงกำหนด -> เลยกำหนดแล้ว (ในแต่ละกลุ่มเรียงจากใกล้เคียงที่สุดไปหาน้อยที่สุด)
  const CALIB_GROUP_ORDER = { 'pill-warn':0, 'pill-ok':1, 'pill-danger':2 };
  items.sort((a,b)=>{
    const pa = CALIB_GROUP_ORDER[a.calibInfo.pill] ?? 3;
    const pb = CALIB_GROUP_ORDER[b.calibInfo.pill] ?? 3;
    if(pa !== pb) return pa - pb;
    return Math.abs(a.calibDaysLeft ?? Infinity) - Math.abs(b.calibDaysLeft ?? Infinity);
  });
  const countDanger = state.equipment.filter(e=>e.nextCalib && calibStatusInfo(e.nextCalib).pill==='pill-danger').length;
  const countWarn = state.equipment.filter(e=>e.nextCalib && calibStatusInfo(e.nextCalib).pill==='pill-warn').length;
  const countOk = state.equipment.filter(e=>e.nextCalib && calibStatusInfo(e.nextCalib).pill==='pill-ok').length;
  return `
  <div class="card p-5">
    <p class="text-sm subtle mb-4">แสดงกำหนดการสอบเทียบของเครื่องมือ โดยอิงจากวันที่ในช่อง "สอบเทียบครั้งถัดไป" — <svg viewBox="0 0 24 24" fill="#16a34a" style="width:0.55em;height:0.55em;vertical-align:0.02em;margin-right:0.32em;display:inline-block;flex:none"><circle cx="12" cy="12" r="10"/></svg> ยังไม่ถึงกำหนด (มากกว่า 90 วัน) &nbsp; <svg viewBox="0 0 24 24" fill="#f59e0b" style="width:0.55em;height:0.55em;vertical-align:0.02em;margin-right:0.32em;display:inline-block;flex:none"><circle cx="12" cy="12" r="10"/></svg> ใกล้ถึงกำหนด (ภายใน 90 วัน) &nbsp; <svg viewBox="0 0 24 24" fill="#dc2626" style="width:0.55em;height:0.55em;vertical-align:0.02em;margin-right:0.32em;display:inline-block;flex:none"><circle cx="12" cy="12" r="10"/></svg> เลยกำหนดสอบเทียบแล้ว</p>
    <div class="flex flex-wrap gap-3 items-end mb-4">
      <div>
        <label class="lbl">หมวดหมู่</label>
        <select id="cb-cat" class="inp">
          <option value="">ทั้งหมด</option>
          ${CATEGORIES.map(c=>`<option value="${c}" ${cm.catFilter===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="lbl">สถานะการสอบเทียบ</label>
        <select id="cb-status" class="inp">
          <option value="">ทั้งหมด</option>
          <option value="danger" ${cm.statusFilter==='danger'?'selected':''}>เลยกำหนดแล้ว (${countDanger})</option>
          <option value="warn" ${cm.statusFilter==='warn'?'selected':''}>ใกล้ถึงกำหนด ≤ 90 วัน (${countWarn})</option>
          <option value="ok" ${cm.statusFilter==='ok'?'selected':''}>ยังไม่ถึงกำหนด (${countOk})</option>
        </select>
      </div>
      <div class="flex-1 min-w-[180px]">
        <label class="lbl">ค้นหา</label>
        <input id="cb-search" class="inp" placeholder="ชื่อเครื่องมือ / รหัสครุภัณฑ์ / ยี่ห้อ" value="${esc(cm.search)}"/>
      </div>
    </div>
    <div class="flex flex-wrap gap-2 mb-3">
      <span class="pill pill-danger"><svg viewBox="0 0 24 24" fill="#dc2626" style="width:0.55em;height:0.55em;vertical-align:0.02em;margin-right:0.32em;display:inline-block;flex:none"><circle cx="12" cy="12" r="10"/></svg> เลยกำหนด ${countDanger} เครื่อง</span>
      <span class="pill pill-warn"><svg viewBox="0 0 24 24" fill="#f59e0b" style="width:0.55em;height:0.55em;vertical-align:0.02em;margin-right:0.32em;display:inline-block;flex:none"><circle cx="12" cy="12" r="10"/></svg> ใกล้ถึงกำหนด ${countWarn} เครื่อง</span>
      <span class="pill pill-ok"><svg viewBox="0 0 24 24" fill="#16a34a" style="width:0.55em;height:0.55em;vertical-align:0.02em;margin-right:0.32em;display:inline-block;flex:none"><circle cx="12" cy="12" r="10"/></svg> ยังไม่ถึงกำหนด ${countOk} เครื่อง</span>
    </div>
    <div class="text-sm subtle mb-2">พบ ${items.length} รายการ (แสดงเฉพาะเครื่องมือที่มีข้อมูลสอบเทียบ)</div>
    <div class="table-wrap">
      <table class="data-table calib-plan-table">
        <thead><tr>
          <th class="text-center" style="width:36px"><input type="checkbox" class="calib-checkbox" id="calib-select-all" ${items.length>0 && items.every(e=>state.calibSelected.has(e.id))?'checked':''}/></th>
          <th>ประเภท</th>
          <th class="text-center">ลำดับที่</th>
          <th>รหัสพัสดุ</th>
          <th>รายละเอียดพัสดุ</th>
          <th class="text-center">จำนวน</th>
          <th>รายการที่ต้องสอบเทียบ</th>
          <th>กำหนดสอบเทียบ</th>
          <th class="text-right">ราคา</th>
          <th>สอบเทียบล่าสุด</th>
          <th>เวลาคงเหลือ</th>
          <th>หมายเหตุ</th>
        </tr></thead>
        <tbody>
          ${items.length===0 ? `<tr><td colspan="12" class="text-center subtle py-6">ไม่พบข้อมูล</td></tr>` : items.map((e,idx)=>`
            <tr class="${e.calibInfo.cls} ${state.calibSelected.has(e.id)?'calib-row-selected':''}">
              <td class="text-center"><input type="checkbox" class="calib-checkbox calib-row-check" data-id="${e.id}" ${state.calibSelected.has(e.id)?'checked':''}/></td>
              <td><span class="mini-chip" style="--c:${CATEGORY_COLOR[e.category]?.bg||'#888'}">${e.category}</span></td>
              <td class="text-center">${idx+1}</td>
              <td class="font-mono text-xs calib-asset-code">${esc(e.assetCode||'-')}</td>
              <td class="text-xs">
                <div class="font-medium">${esc(e.name)}</div>
                ${equipDetailLine(e) ? `<div class="subtle">${esc(equipDetailLine(e))}</div>` : ''}
              </td>
              <td class="text-center text-xs calib-qty-cell">1 เครื่อง</td>
              <td class="text-xs">${e.calibItem ? esc(e.calibItem) : '<span class="subtle">-</span>'}</td>
              <td class="text-xs font-semibold calib-asset-code">${fmtDateBEShort2(e.nextCalib.slice(0,10))}</td>
              <td class="text-xs text-right">${e.price ? Number(e.price).toLocaleString('th-TH') : '<span class="subtle">-</span>'}</td>
              <td class="text-xs">${e.lastCalib?fmtDateBEShort2(e.lastCalib.slice(0,10)):'<span class="subtle">-</span>'}</td>
              <td class="text-xs" style="white-space:nowrap;"><span class="pill ${e.calibInfo.pill}" style="white-space:nowrap;">${e.calibInfo.label}</span></td>
              <td class="text-xs">${e.remark ? esc(e.remark) : ''}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>
  ${renderCalibSelectionBar()}`;
}

function renderHistoryTab(){
  const hm = state.manage.history || (state.manage.history = {catFilter:'', typeFilter:'', search:''});
  let records = [];
  state.equipment.forEach(e=>{
    (Array.isArray(e.calibHistory)?e.calibHistory:[]).forEach(h=>records.push({...h, type:'calib', equip:e}));
    (Array.isArray(e.repairHistory)?e.repairHistory:[]).forEach(h=>records.push({...h, type:'repair', equip:e}));
  });
  if(hm.catFilter) records = records.filter(r=>r.equip.category===hm.catFilter);
  if(hm.typeFilter) records = records.filter(r=>r.type===hm.typeFilter);
  if(hm.search) records = records.filter(r=>(r.equip.name+r.equip.assetCode+r.equip.brand+r.equip.model).toLowerCase().includes(hm.search.toLowerCase()));
  records.sort((a,b)=> (b.recordedAt||b.date||'').localeCompare(a.recordedAt||a.date||''));
  const countCalib = records.filter(r=>r.type==='calib').length;
  const countRepair = records.filter(r=>r.type==='repair').length;
  return `
  <div class="card p-5">
    <div class="flex flex-wrap gap-3 items-start justify-between mb-1">
      <p class="text-sm subtle mb-4 flex-1 min-w-[240px]">ประวัติการดำเนินงานทั้งหมดที่มาจากการกดยืนยันในแท็บ "การสอบเทียบ" และ "เครื่องมือที่ชำรุด" เรียงจากรายการล่าสุดไปเก่าสุด</p>
      <button class="btn-danger" data-act="clear-manage-history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.16em;margin-right:0.32em;display:inline-block;flex:none"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> ล้างประวัติ</button>
    </div>
    <div class="flex flex-wrap gap-3 items-end mb-4">
      <div>
        <label class="lbl">หมวดหมู่</label>
        <select id="hs-cat" class="inp">
          <option value="">ทั้งหมด</option>
          ${CATEGORIES.map(c=>`<option value="${c}" ${hm.catFilter===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="lbl">ประเภทงาน</label>
        <select id="hs-type" class="inp">
          <option value="">ทั้งหมด</option>
          <option value="calib" ${hm.typeFilter==='calib'?'selected':''}>สอบเทียบ</option>
          <option value="repair" ${hm.typeFilter==='repair'?'selected':''}>ซ่อมเครื่องมือ</option>
        </select>
      </div>
      <div class="flex-1 min-w-[180px]">
        <label class="lbl">ค้นหา</label>
        <input id="hs-search" class="inp" placeholder="ชื่อเครื่องมือ / รหัสครุภัณฑ์ / ยี่ห้อ" value="${esc(hm.search)}"/>
      </div>
    </div>
    <div class="flex flex-wrap gap-2 mb-3">
      <span class="pill pill-ok"><svg viewBox="0 0 24 24" fill="#16a34a" style="width:0.55em;height:0.55em;vertical-align:0.02em;margin-right:0.32em;display:inline-block;flex:none"><circle cx="12" cy="12" r="10"/></svg> สอบเทียบแล้ว ${countCalib} รายการ</span>
      <span class="pill pill-warn"><svg viewBox="0 0 24 24" fill="#f59e0b" style="width:0.55em;height:0.55em;vertical-align:0.02em;margin-right:0.32em;display:inline-block;flex:none"><circle cx="12" cy="12" r="10"/></svg> ซ่อมเสร็จแล้ว ${countRepair} รายการ</span>
    </div>
    <div class="text-sm subtle mb-2">พบ ${records.length} รายการ</div>
    <div class="table-wrap">
      <table class="data-table calib-plan-table">
        <thead><tr>
          <th style="width:110px">วันที่ดำเนินการ</th>
          <th>ประเภทงาน</th>
          <th>ประเภท</th>
          <th>รหัสพัสดุ</th>
          <th>รายละเอียดพัสดุ</th>
          <th>หน่วยงาน/ผู้ดำเนินการ</th>
          <th class="text-right">ค่าใช้จ่าย</th>
          <th>รายละเอียดการดำเนินงาน</th>
        </tr></thead>
        <tbody>
          ${records.length===0 ? `<tr><td colspan="8" class="text-center subtle py-6">ยังไม่มีประวัติการดำเนินงาน</td></tr>` : records.map(r=>`
            <tr>
              <td class="text-xs font-semibold calib-asset-code">${fmtDateBEShort2((r.date||'').slice(0,10))}</td>
              <td class="text-xs"><span class="pill ${r.type==='calib'?'pill-ok':'pill-warn'}" style="white-space:nowrap;">${r.type==='calib'?'สอบเทียบ':'ซ่อมเครื่องมือ'}</span></td>
              <td><span class="mini-chip" style="--c:${CATEGORY_COLOR[r.equip.category]?.bg||'#888'}">${r.equip.category}</span></td>
              <td class="font-mono text-xs calib-asset-code">${esc(r.equip.assetCode||'-')}</td>
              <td class="text-xs">
                <div class="font-medium">${esc(r.equip.name)}</div>
                ${equipDetailLine(r.equip) ? `<div class="subtle">${esc(equipDetailLine(r.equip))}</div>` : ''}

              <td class="text-xs">${r.agency ? esc(r.agency) : '<span class="subtle">-</span>'}</td>
              <td class="text-xs text-right">${(typeof r.cost==='number'&&!isNaN(r.cost)) ? r.cost.toLocaleString('th-TH') : '<span class="subtle">-</span>'}</td>
              <td class="text-xs">${r.fixItems ? esc(r.fixItems) : '<span class="subtle">-</span>'}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

function renderReorderTab(){

            </div>
          </div>`).join('')}
      </div>
    </div>

}

        <div><label class="lbl">รหัสครุภัณฑ์</label><input id="em-assetCode" class="inp" value="${esc(e.assetCode||'')}"/></div>
        <div><label class="lbl">ยี่ห้อ</label><input id="em-brand" class="inp" value="${esc(e.brand||'')}"/></div>
        <div><label class="lbl">รุ่น</label><input id="em-model" class="inp" value="${esc(e.model||'')}"/></div>
        <div><label class="lbl">Serial Number</label><input id="em-serial" class="inp" value="${esc(e.serial||'')}"/></div>
        <div><label class="lbl">รอบสอบเทียบ (ปี)</label><input type="number" id="em-calibCycle" class="inp" value="1" readonly title="รอบสอบเทียบคงที่ 1 ปี"/></div>
        <div><label class="lbl">ปี พ.ศ. ที่ได้มา</label><input id="em-yearGot" class="inp" value="${esc(e.yearGot||'')}"/></div>
        <div><label class="lbl">พารามิเตอร์ที่วัดได้</label><input id="em-params" class="inp" value="${esc(e.params||'')}"/></div>
      </div>
      <div class="flex justify-end gap-2 mt-5">
        <button class="btn-ghost" data-act="close-modal">ยกเลิก</button>
        <button class="btn-primary" data-act="save-equip" data-id="${e.id||''}">บันทึก</button>
      </div>
    </div>
  </div>`;
}


function renderCalendar(){
  const c = state.calendar;
  const first = new Date(c.year, c.month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(c.year, c.month+1, 0).getDate();
  const today = todayISO();
  // สำหรับแต่ละวันในเดือนนี้ ให้รวบรวม "ใบยืมทุกใบที่ช่วงวันยืม-คืนครอบคลุมวันนั้น"
  // (ไม่ใช่แค่ใบยืมที่เริ่มยืมวันนั้นวันเดียวเหมือนเดิม) เพื่อให้ admin เห็นภาพรวมว่าวันไหน
  // มีเครื่องมือถูกจอง/ถืออยู่บ้าง ตลอดทั้งช่วงที่ยืม ไม่ใช่แค่วันแรกที่สร้างใบยืม
  // แต่ละใบยืมในแต่ละวันจะถูกจัดกลุ่มเป็น 3 สถานะ:
  //   - "คืนแล้ว"  : ใบยืมนั้นถูกกดคืนไปแล้วจริง (status ไม่ใช่ active)
  //   - "ยืมอยู่"  : ใบยืม active และวันนั้นมาถึงแล้วหรือคือวันนี้ (ของจริงถูกถืออยู่/เคยถูกถืออยู่วันนั้น)
  //   - "จอง"     : ใบยืม active แต่วันนั้นยังไม่มาถึง (จองล่วงหน้าไว้ ยังไม่ได้มารับเครื่องมือ)
  const borrowsByDay = {};
  for(let d=1; d<=daysInMonth; d++){
    const dayISO = `${c.year}-${String(c.month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayBorrows = state.borrows.filter(b=> b.borrowDate && b.returnDate && dateRangesOverlap(b.borrowDate, b.returnDate, dayISO, dayISO));
    if(dayBorrows.length) borrowsByDay[d] = dayBorrows.map(b=>{
      let cat = 'returned';
      if(b.status==='active') cat = (dayISO <= today) ? 'active' : 'reserved';
      return { b, cat };
    });
  }
  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell cal-empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const items = borrowsByDay[d]||[];
    const activeN = items.filter(x=>x.cat==='active').length;
    const reservedN = items.filter(x=>x.cat==='reserved').length;
    const returnedN = items.filter(x=>x.cat==='returned').length;
    const cellCls = activeN>0 ? 'calday-active' : (reservedN>0 ? 'calday-reserved' : (returnedN>0 ? 'calday-returned' : ''));
    const isSel = c.selectedDay===d;
    cells += `<div class="cal-cell ${cellCls} ${isSel?'cal-sel':''}" data-act="cal-day" data-day="${d}">
      <div class="cal-daynum">${d}</div>
      ${items.length? `<div class="calday-badges">
        ${activeN? `<span class="calday-badge calday-badge-active"><svg viewBox="0 0 24 24" fill="#dc2626" style="width:0.55em;height:0.55em;vertical-align:0.02em;margin-right:0.32em;display:inline-block;flex:none"><circle cx="12" cy="12" r="10"/></svg> มีใบยืมอยู่ ${activeN}</span>`:''}
        ${reservedN? `<span class="calday-badge calday-badge-reserved"><svg viewBox="0 0 24 24" fill="#f59e0b" style="width:0.55em;height:0.55em;vertical-align:0.02em;margin-right:0.32em;display:inline-block;flex:none"><circle cx="12" cy="12" r="10"/></svg> มีการจอง ${reservedN}</span>`:''}
        ${returnedN? `<span class="calday-badge calday-badge-returned"><svg viewBox="0 0 24 24" fill="#9ca3af" style="width:0.55em;height:0.55em;vertical-align:0.02em;margin-right:0.32em;display:inline-block;flex:none"><circle cx="12" cy="12" r="10"/></svg> คืนแล้ว ${returnedN}</span>`:''}
      </div>`:''}
    </div>`;
  }
  // เรียงใบยืม: อนุมัติ/ใช้งานอยู่ (รวมเลยกำหนด) → คืนบางส่วน → คืนแล้ว/คืนก่อน/คืนช้า (คงลำดับเดิมในกลุ่มเดียวกัน)
  const slipRank = (b)=> (b.status!=='active') ? 2 : (isBorrowPartiallyReturned(b) ? 1 : 0);
  const dayList = c.selectedDay ? (borrowsByDay[c.selectedDay]||[]).slice().sort((x,y)=> slipRank(x.b)-slipRank(y.b)) : [];
  return `
  <div class="card p-5">
    <div class="flex items-center justify-between mb-4">
      <button class="btn-ghost" data-act="cal-prev">‹ เดือนก่อน</button>
      <div class="font-bold text-lg">${THAI_MONTHS[c.month]} พ.ศ. ${beYear(c.year)}</div>
      <button class="btn-ghost" data-act="cal-next">เดือนถัดไป ›</button>
    </div>
    <p class="text-sm subtle mb-2">นับตลอดช่วงวันที่ยืม-คืนของทุกใบยืม ไม่ใช่แค่วันที่สร้างใบยืม — คลิกวันที่เพื่อดูรายละเอียด</p>
    <div class="avail-legend mb-3">
      <span><span class="avail-legend-dot" style="background:#f87171"></span><svg viewBox="0 0 24 24" fill="#dc2626" style="width:0.55em;height:0.55em;vertical-align:0.02em;margin-right:0.32em;display:inline-block;flex:none"><circle cx="12" cy="12" r="10"/></svg> มีใบยืมอยู่ (ถือเครื่องมืออยู่จริง)</span>
      <span><span class="avail-legend-dot" style="background:#fbbf24"></span><svg viewBox="0 0 24 24" fill="#f59e0b" style="width:0.55em;height:0.55em;vertical-align:0.02em;margin-right:0.32em;display:inline-block;flex:none"><circle cx="12" cy="12" r="10"/></svg> มีการจอง (จองล่วงหน้า ยังไม่มารับ)</span>
      <span><span class="avail-legend-dot" style="background:#cbd5d1"></span><svg viewBox="0 0 24 24" fill="#9ca3af" style="width:0.55em;height:0.55em;vertical-align:0.02em;margin-right:0.32em;display:inline-block;flex:none"><circle cx="12" cy="12" r="10"/></svg> คืนแล้ว</span>
    </div>
    <div class="cal-grid cal-grid-head">
      ${['อา','จ','อ','พ','พฤ','ศ','ส'].map(d=>`<div class="cal-headcell">${d}</div>`).join('')}
    </div>
    <div class="cal-grid">${cells}</div>
  </div>
  ${c.selectedDay? `
  <div class="card p-5 mt-4">
    <h3 class="font-bold mb-3">รายการที่มีเครื่องมือถูกจอง/ยืมในวันที่ ${c.selectedDay} ${THAI_MONTHS[c.month]} พ.ศ. ${beYear(c.year)}</h3>
    ${dayList.length===0? `<div class="empty-hint">ไม่มีรายการในวันนี้</div>` : dayList.map(x=>{ const b=x.b; return `
      <div class="borrow-item-card">
        <div class="flex justify-between flex-wrap gap-2">
          <div>
            <div class="font-bold">${b.code} — ${esc(b.name)} (${esc(b.dept)})</div>
            <div class="text-sm subtle">ยืมตั้งแต่วันที่ ${fmtDateBE(b.borrowDate)} ถึงวันที่ ${fmtDateBE(b.returnDate)} • พื้นที่: ${esc(b.province)}</div>
            <div class="text-sm subtle">รายการ: ${itemsSummaryLine(b)}</div>
            <div class="text-xs mt-1">${borrowStatusBadge(b)}</div>
          </div>
          <div class="flex gap-2 items-start">
            <button class="btn-ghost" data-act="print-slip" data-id="${b.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.16em;margin-right:0.32em;display:inline-block;flex:none"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> พิมพ์</button>
            ${b.status==='active' ? `<button class="btn-early-return" data-act="return-now" data-id="${b.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.16em;margin-right:0.32em;display:inline-block;flex:none"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg> คืนเครื่องมือ</button>` : ''}
          </div>
        </div>
      </div>`;}).join('')}
  </div>` : ''}
  `;
}

/* ===================== ปฏิทินสถานะการจอง/ยืม ต่อรายการเครื่องมือ (public, ไม่ต้องล็อกอิน) =====================
   ให้ user ทั่วไปเห็นว่าเครื่องมือแต่ละชื่อ มีวันไหนที่ถูกจอง/ยืมไปแล้วบ้าง ก่อนกรอกใบยืม
   หมายเหตุด้านความเป็นส่วนตัว: หน้าจอนี้เปิดให้บุคคลทั่วไปดูได้โดยไม่ต้องล็อกอิน จึงแสดงเฉพาะ
   "จำนวนว่าง/ไม่ว่างรวม" ต่อวันเท่านั้น ไม่แสดงชื่อ-เบอร์โทร-หน่วยงานของผู้ยืมคนอื่น
   (ถ้าล็อกอินเป็นเจ้าหน้าที่อยู่แล้ว จะเห็นรายละเอียดใบยืมเพิ่มเติมเมื่อกดที่วันนั้นๆ) */
function openAvailabilityCalendar(cat, name){
  const f = state.form;
  const base = f.borrowDate || todayISO();
  const d = new Date(base+'T00:00:00');
  state.availCal = { cat, name, year: d.getFullYear(), month: d.getMonth(), selectedDay: null };
  render();
}
function availCalShift(dir){
  const c = state.availCal;
  if(!c) return;
  let m = c.month + dir, y = c.year;
  if(m<0){ m=11; y--; } else if(m>11){ m=0; y++; }
  c.month = m; c.year = y; c.selectedDay = null;
  render();
}
function unitsForToolName(cat, name){
  // ไม่นับเครื่องมือที่ "ชำรุด" เพราะให้ยืมไม่ได้อยู่แล้ว (ให้ตรงกับตัวเลข "คงเหลือ" ที่หน้ารายการ)
  return state.equipment.filter(e=>e.category===cat && e.name===name && e.useStatus !== 'ชำรุด');
}
function renderAvailabilityCalendarModal(){
  const c = state.availCal;
  if(!c) return '';
  const units = unitsForToolName(c.cat, c.name);
  const total = units.length;
  const first = new Date(c.year, c.month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(c.year, c.month+1, 0).getDate();

  function dayStats(dayISO){
    const bookedIds = units.filter(u=>unitIsHeldForRange(u, dayISO, dayISO)).map(u=>u.id);
    return { total, booked: bookedIds.length, free: total - bookedIds.length };
  }
  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell cal-empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dayISO = `${c.year}-${String(c.month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const s = dayStats(dayISO);
    const cls = s.free<=0 ? 'avail-full' : (s.free<total ? 'avail-partial' : 'avail-free');
    const isSel = c.selectedDay===d;
    cells += `<div class="cal-cell ${cls} ${isSel?'cal-sel':''}" data-act="avail-cal-day" data-day="${d}">
      <div class="cal-daynum">${d}</div>
      <div class="avail-dot">ว่าง ${s.free}/${s.total}</div>
    </div>`;
  }

  let dayDetail = '';
  if(c.selectedDay){
    const dayISO = `${c.year}-${String(c.month+1).padStart(2,'0')}-${String(c.selectedDay).padStart(2,'0')}`;
    const s = dayStats(dayISO);
    dayDetail = `
    <div class="mt-4" style="border-top:1px solid var(--border); padding-top:14px;">
      <div class="font-bold mb-2">วันที่ ${c.selectedDay} ${THAI_MONTHS[c.month]} พ.ศ. ${beYear(c.year)}</div>
      <div class="text-sm subtle mb-2">ว่างให้ยืม ${s.free} จากทั้งหมด ${s.total} เครื่อง${s.booked>0? ` • ถูกจอง/ยืมอยู่ ${s.booked} เครื่อง`:''}</div>
      ${state.loggedIn ? renderAvailDayBorrowList(c.cat, c.name, dayISO) : (s.booked>0? `<div class="hint-be">เข้าสู่ระบบในฐานะเจ้าหน้าที่เพื่อดูรายละเอียดใบยืมที่จองวันนี้</div>` : '')}
    </div>`;
  }

  return `
  <div class="modal-backdrop" data-act="close-modal">
    <div class="modal-card">
      <div class="flex items-start justify-between gap-3 mb-1">
        <h3 class="text-lg font-bold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.16em;margin-right:0.32em;display:inline-block;flex:none"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> คิวการจอง/ยืม — ${esc(c.name)}</h3>
        <button class="icon-btn" data-act="close-modal" title="ปิด">&times;</button>
      </div>
      <div class="text-sm subtle mb-4">มีทั้งหมด ${total} เครื่อง — เลือกวันในปฏิทินเพื่อดูจำนวนว่างของวันนั้น</div>
      <div class="flex items-center justify-between mb-3">
        <button class="btn-ghost" data-act="avail-cal-prev">‹ เดือนก่อน</button>
        <div class="font-bold">${THAI_MONTHS[c.month]} พ.ศ. ${beYear(c.year)}</div>
        <button class="btn-ghost" data-act="avail-cal-next">เดือนถัดไป ›</button>
      </div>
      <div class="cal-grid cal-grid-head">
        ${['อา','จ','อ','พ','พฤ','ศ','ส'].map(d=>`<div class="cal-headcell">${d}</div>`).join('')}
      </div>
      <div class="cal-grid">${cells}</div>
      <div class="avail-legend mt-3">
        <span><span class="avail-legend-dot" style="background:#6ee7b7"></span>ว่างทั้งหมด</span>
        <span><span class="avail-legend-dot" style="background:#fcd34d"></span>ว่างบางส่วน</span>
        <span><span class="avail-legend-dot" style="background:#fca5a5"></span>เต็ม/ไม่ว่าง</span>
      </div>
      ${dayDetail}
    </div>
  </div>`;
}
// รายละเอียดใบยืมที่จองวันนั้น — แสดงเฉพาะกับผู้ที่ล็อกอินแล้ว (เจ้าหน้าที่) เพื่อไม่ให้บุคคลทั่วไปเห็นข้อมูลผู้ยืมคนอื่น
function renderAvailDayBorrowList(cat, name, dayISO){
  const units = unitsForToolName(cat, name);
  const unitIds = new Set(units.map(u=>u.id));
  const matches = state.borrows.filter(b=>{
    if(b.status!=='active') return false;
    if(!dateRangesOverlap(b.borrowDate, b.returnDate, dayISO, dayISO)) return false;
    const list = (b.itemsExpanded && b.itemsExpanded.length) ? b.itemsExpanded : b.items;
    return list.some(it=>unitIds.has(it.equipmentId) && !it.returned);
  });
  if(!matches.length) return `<div class="hint-be">ไม่มีใบยืมในวันนี้</div>`;
  return matches.map(b=>`
    <div class="borrow-item-card">
      <div class="font-bold">${esc(b.code)} — ${esc(b.dept)}</div>
      <div class="text-sm subtle">ยืมตั้งแต่วันที่ ${fmtDateBE(b.borrowDate)} ถึงวันที่ ${fmtDateBE(b.returnDate)}</div>
    </div>`).join('');
}

function fiscalRange(fyBE){
  const gy = fyBE - 543;
  return { start: `${gy-1}-10-01`, end: `${gy}-09-30` };
}
function halfRange(mode, fyBE){
  const gy = fyBE - 543;
  if(mode==='oct-mar') return { start: `${gy-1}-10-01`, end: `${gy}-03-31` };
  return { start: `${gy}-04-01`, end: `${gy}-09-30` };
}
function monthRange(monthIdx, gy){
  const start = toLocalISODate(new Date(gy, monthIdx, 1));
  const end = toLocalISODate(new Date(gy, monthIdx+1, 0));
  return {start, end};
}
function weekRange(startISO){
  const s = new Date(startISO+'T00:00:00');
  const e = new Date(s); e.setDate(e.getDate()+6);
  return { start: startISO, end: toLocalISODate(e) };
}
function getReportRange(){
  const r = state.reports;
  if(r.mode==='week') return r.weekStart? weekRange(r.weekStart) : weekRange(todayISO());
  if(r.mode==='month') return monthRange(r.month, r.year);
  if(r.mode==='half') return halfRange(r.half, r.fy);
  if(r.mode==='fy') return fiscalRange(r.fy);
  return monthRange(new Date().getMonth(), new Date().getFullYear());
}
// ช่วงเวลาก่อนหน้า (ความยาวเท่ากับช่วงปัจจุบัน) ใช้สำหรับเปรียบเทียบ % เปลี่ยนแปลง
function getPreviousRange(range){
  const s = new Date(range.start+'T00:00:00');
  const e = new Date(range.end+'T00:00:00');
  const lengthDays = Math.round((e-s)/86400000);
  const prevEnd = new Date(s); prevEnd.setDate(prevEnd.getDate()-1);
  const prevStart = new Date(prevEnd); prevStart.setDate(prevStart.getDate()-lengthDays);
  return { start: toLocalISODate(prevStart), end: toLocalISODate(prevEnd) };
}
function filterBorrowsByRange(range){
  return state.borrows.filter(b=> b.borrowDate>=range.start && b.borrowDate<=range.end);
}
// ตัวกรองรายงาน: หน่วยงาน / จังหวัด / ประเภทเครื่องมือ (เลือกได้หลายอัน, ว่าง = ไม่กรอง)
/* ----- ตัวกรองรหัสครุภัณฑ์ -----
   รหัสครุภัณฑ์ของแต่ละชิ้นในใบยืม: ดูจาก itemsExpanded ก่อน ถ้าไม่มีให้ดูจากคลังเครื่องมือปัจจุบัน */
function unitAssetCodeOf(b, unitId){
  const rec = (b.itemsExpanded||[]).find(x=>x.equipmentId===unitId);
  let code = rec && rec.assetCode ? rec.assetCode : '';
  if(!isUsableAssetCode(code)){
    const eq = state.equipment.find(x=>x.id===unitId);
    if(eq && eq.assetCode) code = eq.assetCode;
  }
  return String(code||'').trim();
}
/* จำนวนชิ้นของรายการ (กลุ่ม) it ในใบยืม b ที่ผ่านตัวกรองรหัสครุภัณฑ์ — ถ้าไม่ได้เลือกตัวกรองจะได้ it.qty เท่าเดิม */
function reportItemQty(b, it){
  const assets = state.reports.filterAssets||[];
  if(!assets.length) return it.qty;
  const ids = (it.equipmentIds && it.equipmentIds.length) ? it.equipmentIds : (it.equipmentId ? [it.equipmentId] : []);
  if(ids.length) return ids.filter(id=>assets.includes(unitAssetCodeOf(b,id))).length;
  return String(it.assetCode||'').split(',').map(s=>s.trim()).filter(c=>assets.includes(c)).length;
}
// ตัวเลือกของตัวกรองรายงาน: แสดงเฉพาะค่าที่มีอยู่จริงในใบยืม (ไม่แสดงค่าที่ไม่เคยถูกยืมเลย)
// ค่าที่กำลังเลือกอยู่จะคงอยู่ในรายการเสมอ เพื่อให้กดยกเลิกได้
function reportFilterOptions(){
  const r = state.reports;
  const depts = new Set(), provs = new Set(), cats = new Set(), assetNames = {};
  state.borrows.forEach(b=>{
    if(b.dept) depts.add(b.dept);
    if(b.province) provs.add(b.province);
    (b.items||[]).forEach(it=>{ if(it.category) cats.add(it.category); });
    const list = (b.itemsExpanded && b.itemsExpanded.length) ? b.itemsExpanded : [];
    list.forEach(rec=>{
      const c = unitAssetCodeOf(b, rec.equipmentId) || String(rec.assetCode||'').trim();
      if(isUsableAssetCode(c) && !(c in assetNames)) assetNames[c] = rec.name || '';
    });
    if(!list.length){
      (b.items||[]).forEach(it=>{
        String(it.assetCode||'').split(',').map(s=>s.trim()).forEach(c=>{
          if(isUsableAssetCode(c) && !(c in assetNames)) assetNames[c] = it.name || '';
        });
      });
    }
  });
  (r.filterDepts||[]).forEach(v=>depts.add(v));
  (r.filterProvinces||[]).forEach(v=>provs.add(v));
  (r.filterCategories||[]).forEach(v=>cats.add(v));
  (r.filterAssets||[]).forEach(c=>{ if(!(c in assetNames)) assetNames[c] = ''; });
  // เรียงตามลำดับในรายการมาตรฐานก่อน ส่วนค่าอื่นที่ไม่อยู่ในรายการต่อท้ายตามตัวอักษร
  const order = (set, base)=>{
    const inBase = base.filter(x=>set.has(x));
    const rest = Array.from(set).filter(x=>!base.includes(x)).sort((a,b)=>a.localeCompare(b,'th'));
    return inBase.concat(rest);
  };
  const codes = Object.keys(assetNames).sort((a,b)=>a.localeCompare(b,'th',{numeric:true}));
  return {
    depts: order(depts, DEPTS), provinces: order(provs, PROVINCES), categories: order(cats, CATEGORIES),
    assets: codes, assetLabel: c=> assetNames[c] ? (c+' — '+assetNames[c]) : c
  };
}
function applyReportFilters(list){
  const r = state.reports;
  const depts = r.filterDepts||[], provs = r.filterProvinces||[], cats = r.filterCategories||[], assets = r.filterAssets||[];
  return list.filter(b=>{
    if(depts.length && !depts.includes(b.dept)) return false;
    if(provs.length && !provs.includes(b.province)) return false;
    if(cats.length && !(b.items||[]).some(it=>cats.includes(it.category))) return false;
    if(assets.length && !(b.items||[]).some(it=>(!cats.length || cats.includes(it.category)) && reportItemQty(b,it)>0)) return false;
    return true;
  });
}
function reportItemMatchesCatFilter(category){
  const cats = state.reports.filterCategories||[];
  return !cats.length || cats.includes(category);
}
function toggleReportFilter(type, value){
  const key = type==='dept'?'filterDepts': type==='province'?'filterProvinces': type==='asset'?'filterAssets':'filterCategories';
  const arr = state.reports[key];
  const i = arr.indexOf(value);
  if(i>=0) arr.splice(i,1); else arr.push(value);
  render();
}
function clearReportFilters(){
  state.reports.filterDepts = []; state.reports.filterProvinces = []; state.reports.filterCategories = []; state.reports.filterAssets = [];

}

function renderReportsTab(){
  const range = getReportRange();
  const list = applyReportFilters(filterBorrowsByRange(range));
  const byEquip = {}, byDept = {}, byCat = {}, equipCat = {}, byProvince = {}, byProvinceBorrows = {};
  let totalQty = 0, returnedCount = 0, lateReturnedCount = 0;
  list.forEach(b=>{
    if(b.status==='returned' || b.status==='late-returned' || b.status==='early-returned') returnedCount++;
    if(b.status==='late-returned') lateReturnedCount++;
    const prov = b.province || 'ไม่ระบุ';
    byProvinceBorrows[prov] = (byProvinceBorrows[prov]||0) + 1;
    b.items.forEach(it=>{
      if(!reportItemMatchesCatFilter(it.category)) return;
      const q = reportItemQty(b, it);   // นับเฉพาะชิ้นที่ตรงกับตัวกรองรหัสครุภัณฑ์ (ถ้าเลือกไว้)
      if(!q) return;
      byDept[b.dept] = (byDept[b.dept]||0) + q;
      byEquip[it.name] = (byEquip[it.name]||0) + q;
      byCat[it.category] = (byCat[it.category]||0) + q;
      equipCat[it.name] = it.category;
      byProvince[prov] = (byProvince[prov]||0) + q;
      totalQty += q;
    });
  });
  const equipEntries = Object.entries(byEquip).sort((a,b)=>b[1]-a[1]);
  const deptEntries = Object.entries(byDept).sort((a,b)=>b[1]-a[1]);
  const catEntries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const provinceEntries = Object.entries(byProvinceBorrows).sort((a,b)=>b[1]-a[1]).map(([prov,borrowCount])=>[prov, borrowCount, byProvince[prov]||0]);
  const maxEquip = Math.max(1, ...equipEntries.map(e=>e[1]));
  const maxDept = Math.max(1, ...deptEntries.map(e=>e[1]));
  const activeCount = list.length - returnedCount;
  const onTimeCount = returnedCount - lateReturnedCount;
  const onTimeRate = returnedCount>0 ? (onTimeCount/returnedCount*100) : null;

  // เปรียบเทียบกับช่วงเวลาก่อนหน้า (ความยาวเท่ากัน)
  const prevRange = getPreviousRange(range);
  const prevList = applyReportFilters(filterBorrowsByRange(prevRange));
  let prevTotalQty = 0, prevReturnedCount = 0, prevLateReturnedCount = 0;
  prevList.forEach(b=>{
    if(b.status==='returned' || b.status==='late-returned' || b.status==='early-returned') prevReturnedCount++;
    if(b.status==='late-returned') prevLateReturnedCount++;
    b.items.forEach(it=>{
      if(!reportItemMatchesCatFilter(it.category)) return;
      prevTotalQty += reportItemQty(b, it);
    });
  });
  const prevActiveCount = prevList.length - prevReturnedCount;
  const prevOnTimeCount = prevReturnedCount - prevLateReturnedCount;
  const prevOnTimeRate = prevReturnedCount>0 ? (prevOnTimeCount/prevReturnedCount*100) : null;
  function pctDelta(cur, prev){
    if(prev===0 && cur===0) return null;
    if(prev===0) return null; // หลีกเลี่ยงหารด้วยศูนย์ / ค่าที่ไม่สื่อความหมาย
    return ((cur-prev)/prev*100);
  }
  const deltaBorrows = pctDelta(list.length, prevList.length);
  const deltaQty = pctDelta(totalQty, prevTotalQty);
  const deltaActive = pctDelta(activeCount, prevActiveCount);
  const deltaReturned = pctDelta(returnedCount, prevReturnedCount);
  const deltaOnTime = (onTimeRate!==null && prevOnTimeRate!==null) ? (onTimeRate-prevOnTimeRate) : null;
  function deltaBadge(delta, invert){
    if(delta===null || !isFinite(delta)) return '';
    const good = invert ? delta<0 : delta>0;
    const bad = invert ? delta>0 : delta<0;
    const color = good? '#15803d' : (bad? '#dc2626':'#6b7280');
    const arrow = delta>0?'▲':(delta<0?'▼':'—');
    return `<span style="color:${color};font-size:11px;font-weight:700;margin-left:6px;white-space:nowrap">${arrow} ${Math.abs(delta).toFixed(0)}%</span>`;
  }
  function deltaPointBadge(delta){
    if(delta===null || !isFinite(delta)) return '';
    const color = delta>0? '#15803d' : (delta<0? '#dc2626':'#6b7280');
    const arrow = delta>0?'▲':(delta<0?'▼':'—');
    return `<span style="color:${color};font-size:11px;font-weight:700;margin-left:6px;white-space:nowrap">${arrow} ${Math.abs(delta).toFixed(1)} จุด</span>`;
  }

  // เครื่องมือที่ไม่ถูกยืมเลยในช่วงเวลาที่เลือก (เทียบกับคลังทั้งหมด ตามตัวกรองประเภท/หน่วยงานถ้ามี)
  const catFilterSet = state.reports.filterCategories||[];
  const assetFilterSet = state.reports.filterAssets||[];
  const allToolNames = {};
  state.equipment.forEach(e=>{
    if(catFilterSet.length && !catFilterSet.includes(e.category)) return;
    if(assetFilterSet.length && !assetFilterSet.includes(String(e.assetCode||'').trim())) return;
    const key = e.category+'|||'+e.name;
    if(!allToolNames[key]) allToolNames[key] = { category:e.category, name:e.name, total:0 };
    allToolNames[key].total++;
  });
  const underusedTools = Object.values(allToolNames)
    .filter(t=> !(byEquip[t.name] > 0))
    .sort((a,b)=>b.total-a.total)
    .slice(0,20);

  // จำนวนครั้งที่ยืม แยกเป็นรายเครื่อง (ตามหมายเลขครุภัณฑ์/ลำดับเครื่อง) — นับเฉพาะใบยืมที่อยู่ในช่วงเวลาที่เลือกไว้ด้านบนสุด (เดือน/6เดือน/ปีงบประมาณ/สัปดาห์) และตามตัวกรอง หน่วยงาน/จังหวัด/ประเภท ปัจจุบัน
  const unitBorrowList = applyReportFilters(filterBorrowsByRange(range));
  // เก็บรายการ "เครื่องมือที่ถูกยืม" ทั้งหมดจากใบยืม (พร้อมลายนิ้วมือ id/รหัสครุภัณฑ์/หมวดหมู่-ชื่อ-ลำดับ)
  // แทนที่จะนับใส่ Map ด้วย id ตรง ๆ อย่างเดียว เพราะถ้าแอดมินเคย "ล้างฐานข้อมูล" แล้วนำเข้าไฟล์เครื่องมือใหม่
  // ระบบจะสร้าง id ใหม่ทุกครั้ง ทำให้ id เก่าที่บันทึกไว้ในใบยืมไม่ตรงกับ id ปัจจุบันของเครื่องมือชิ้นนั้นอีกต่อไป
  // (ยอดยืมจะกลายเป็น 0 หมดทั้งที่จริงมีประวัติการยืมอยู่) จึงต้องไล่จับคู่ด้วยกฎเดียวกับ unitIsHeldForRange()
  // คือ 1) เทียบ id ก่อน 2) ถ้าไม่ตรงให้เทียบรหัสครุภัณฑ์ 3) ถ้าไม่มีรหัสครุภัณฑ์ทั้งสองฝั่ง ให้เทียบ
  // หมวดหมู่+ชื่อ+ลำดับเครื่องแทน เพื่อให้ยอดยืมสะสมยังคงเชื่อมโยงกลับมาได้ถูกต้อง
  const unitBorrowFingerprints = [];
  // จำนวนวันของการยืมครั้งนี้ = วันที่ยืม ถึง วันที่คืนตามใบยืม (นับรวมวันแรกและวันสุดท้าย)
  const borrowSpanDays = b=>{
    if(!b.borrowDate || !b.returnDate) return 1;
    const d = Math.round((new Date(b.returnDate+'T00:00:00') - new Date(b.borrowDate+'T00:00:00'))/86400000) + 1;
    return isFinite(d) && d>0 ? d : 1;
  };
  unitBorrowList.forEach(b=>{
    const spanDays = borrowSpanDays(b);
    const list = (b.itemsExpanded && b.itemsExpanded.length) ? b.itemsExpanded : (b.items||[]);
    list.forEach(it=>{
      if(!reportItemMatchesCatFilter(it.category)) return;
      if(it.equipmentIds && it.equipmentIds.length){
        it.equipmentIds.forEach(id=> unitBorrowFingerprints.push({ equipmentId:id, assetCode:it.assetCode||'', category:it.category, name:it.name, order: typeof it.order==='number'?it.order:null, days:spanDays }));
      } else {
        unitBorrowFingerprints.push({ equipmentId: it.equipmentId||null, assetCode:it.assetCode||'', category:it.category, name:it.name, order: typeof it.order==='number'?it.order:null, days:spanDays });
      }
    });
  });
  function statsForEquipment(e){
    const assetCodeUsable = isUsableAssetCode(e.assetCode);
    let n = 0, days = 0;
    unitBorrowFingerprints.forEach(fp=>{
      let hit = false;
      if(fp.equipmentId === e.id) hit = true;
      else if(assetCodeUsable && isUsableAssetCode(fp.assetCode) && String(fp.assetCode).trim()===String(e.assetCode).trim()) hit = true;
      else if(!assetCodeUsable && !isUsableAssetCode(fp.assetCode)
         && e.category && fp.category===e.category
         && e.name && fp.name===e.name
         && typeof e.order==='number' && typeof fp.order==='number'
         && e.order===fp.order) hit = true;
      if(hit){ n++; days += (fp.days||0); }
    });
    return { count:n, days };
  }
  function countBorrowsForEquipment(e){ return statsForEquipment(e).count; }
  const unitsByName = {};
  state.equipment.forEach(e=>{
    if(catFilterSet.length && !catFilterSet.includes(e.category)) return;
    if(assetFilterSet.length && !assetFilterSet.includes(String(e.assetCode||'').trim())) return;
    if(!unitsByName[e.name]) unitsByName[e.name] = [];
    unitsByName[e.name].push(e);
  });
  let unitRows = [];
  Object.keys(unitsByName).forEach(name=>{
    unitsByName[name].forEach((e,i)=>{
      unitRows.push({ name, unitLabel: unitsByName[name].length>1 ? `เครื่องที่ ${i+1}` : 'เครื่องเดียว', assetCode: e.assetCode||'-', category: e.category, ...(()=>{ const st = statsForEquipment(e); return { count: st.count, days: st.days }; })() });
    });
  });
  unitRows = unitRows.filter(r=> r.count>0);
  unitRows.sort((a,b)=> b.count-a.count || a.name.localeCompare(b.name,'th'));
  const unitTopN = state.reports.topUnitCount || 15;
  const unitTopForChart = unitRows.slice(0, unitTopN);
  const unitSearchVal = (state.reports.unitSearch||'').trim().toLowerCase();
  if(unitSearchVal){
    unitRows = unitRows.filter(r=> (r.name+' '+r.assetCode).toLowerCase().includes(unitSearchVal));
  }

  // ผู้ยืมที่เลยระยะเวลายืมซ้ำ (นับจากใบยืมทั้งหมดในระบบ ไม่จำกัดเฉพาะช่วงเวลาที่เลือก เพื่อเห็นภาพพฤติกรรมสะสม)
  const lateByBorrower = {};
  applyReportFilters(state.borrows).forEach(b=>{
    const key = b.dept+'|||'+b.name;
    if(!lateByBorrower[key]) lateByBorrower[key] = { dept:b.dept, name:b.name, lateCount:0, totalCount:0 };
    lateByBorrower[key].totalCount++;
    if(b.status==='late-returned') lateByBorrower[key].lateCount++;
  });
  const repeatLateReturners = Object.values(lateByBorrower)
    .filter(x=>x.lateCount>=2)
    .sort((a,b)=>b.lateCount-a.lateCount)
    .slice(0,15);


  const deptDetail = {};
  list.forEach(b=>{
    if(!deptDetail[b.dept]) deptDetail[b.dept] = { items:{}, active:0, returned:0, lateReturned:0 };
    const dd = deptDetail[b.dept];
    if(b.status==='active') dd.active++;
    else if(b.status==='returned' || b.status==='early-returned') dd.returned++;
    else if(b.status==='late-returned') dd.lateReturned++;
    itemGroupsForBorrow(b).forEach(g=>{
      if(!reportItemMatchesCatFilter(g.category)) return;
      let gQty = g.qty, gRet = g.returnedQty;
      if(assetFilterSet.length){
        const matched = g.unitIds.filter(id=>assetFilterSet.includes(unitAssetCodeOf(b,id)));
        gQty = matched.length;
        gRet = matched.filter(id=>g.returnedUnitIds.includes(id)).length;
        if(!gQty) return;
      }
      if(!dd.items[g.name]) dd.items[g.name] = { category: g.category, qty: 0, returnedQty: 0 };
      dd.items[g.name].qty += gQty;
      dd.items[g.name].returnedQty += gRet;
    });
  });
  const deptDetailEntries = Object.entries(deptDetail).sort((a,b)=>(b[1].active+b[1].returned+b[1].lateReturned)-(a[1].active+a[1].returned+a[1].lateReturned));


  const trendMonths = [];
  const now = new Date();
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    trendMonths.push({ y:d.getFullYear(), m:d.getMonth(), label: THAI_MONTHS_SHORT[d.getMonth()]+' '+String(beYear(d.getFullYear())).slice(-2) });
  }
  const trendCounts = trendMonths.map(tm=>{
    return applyReportFilters(state.borrows).filter(b=>{
      const d = new Date(b.borrowDate+'T00:00:00');
      return !isNaN(d) && d.getFullYear()===tm.y && d.getMonth()===tm.m;
    }).length;
  });


  const equipTopN = state.reports.topEquipCount || 8;
  state._reportChartData = {
    catEntries, equipEntries: equipEntries.slice(0, equipTopN), equipCat,
    statusCounts: [activeCount, returnedCount],
    trendLabels: trendMonths.map(t=>t.label), trendCounts,
    deptStatusLabels: deptDetailEntries.map(e=>e[0]),
    deptStatusActive: deptDetailEntries.map(e=>e[1].active),
    deptStatusReturned: deptDetailEntries.map(e=>e[1].returned),
    deptStatusLateReturned: deptDetailEntries.map(e=>e[1].lateReturned),
    provinceLabels: provinceEntries.map(e=>e[0]),
    provinceBorrowCounts: provinceEntries.map(e=>e[1]),
    provinceQtyCounts: provinceEntries.map(e=>e[2]),
    unitTopLabels: unitTopForChart.map(r=> r.unitLabel==='เครื่องเดียว' ? r.name : `${r.name} (${r.unitLabel})`),
    unitTopCounts: unitTopForChart.map(r=>r.count),
    unitTopColors: unitTopForChart.map(r=>(CATEGORY_COLOR[r.category]&&CATEGORY_COLOR[r.category].bg)||'#0891b2'),
  };

  return `
  <div class="mt-5 space-y-6" id="report-root">
    <div class="report-print-title" style="display:none">รายงานสรุปการยืม-คืนเครื่องมือ<br/><span style="font-weight:600;font-size:13px;color:#5b6b68">พิมพ์เมื่อ ${new Date().toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'})} • ช่วงข้อมูล: ${fmtDateBE(range.start)} — ${fmtDateBE(range.end)}</span></div>
    <div class="card p-5 no-print">
      <div class="flex flex-wrap gap-3 items-end">
        <div>
          <label class="lbl">ช่วงเวลา</label>
          <select id="r-mode" class="inp">
            <option value="week" ${state.reports.mode==='week'?'selected':''}>รายสัปดาห์</option>
            <option value="month" ${state.reports.mode==='month'?'selected':''}>รายเดือน</option>
            <option value="half" ${state.reports.mode==='half'?'selected':''}>ราย 6 เดือน</option>
            <option value="fy" ${state.reports.mode==='fy'?'selected':''}>รายปีงบประมาณ</option>
          </select>
        </div>
        ${state.reports.mode==='week' ? `
          <div><label class="lbl">วันเริ่มสัปดาห์</label><input type="date" id="r-week" class="inp" value="${state.reports.weekStart||todayISO()}"/></div>
        `:''}
        ${state.reports.mode==='month' ? `
          <div><label class="lbl">เดือน</label>
            <select id="r-month" class="inp">${THAI_MONTHS.map((m,i)=>`<option value="${i}" ${state.reports.month===i?'selected':''}>${m}</option>`).join('')}</select>
          </div>
          <div><label class="lbl">ปี พ.ศ.</label><input type="number" id="r-year" class="inp" value="${beYear(state.reports.year)}"/></div>
        `:''}
        ${state.reports.mode==='half' ? `
          <div><label class="lbl">ช่วง</label>
            <select id="r-half" class="inp">
              <option value="oct-mar" ${state.reports.half==='oct-mar'?'selected':''}>ตุลาคม - มีนาคม</option>
              <option value="apr-sep" ${state.reports.half==='apr-sep'?'selected':''}>เมษายน - กันยายน</option>
            </select>
          </div>
          <div><label class="lbl">ปีงบประมาณ พ.ศ.</label><input type="number" id="r-fy" class="inp" value="${state.reports.fy}"/></div>
        `:''}
        ${state.reports.mode==='fy' ? `
          <div><label class="lbl">ปีงบประมาณ พ.ศ.</label><input type="number" id="r-fy2" class="inp" value="${state.reports.fy}"/></div>
        `:''}
        <div class="flex gap-2 ml-auto">
          <button class="btn-ghost" data-act="export-excel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.16em;margin-right:0.32em;display:inline-block;flex:none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> ส่งออก Excel</button>
          <button class="btn-primary" data-act="print-report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.16em;margin-right:0.32em;display:inline-block;flex:none"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> พิมพ์รายงาน</button>
        </div>
      </div>
      <div class="text-sm subtle mt-3">ช่วงข้อมูล: ${fmtDateBE(range.start)} — ${fmtDateBE(range.end)} • พบใบยืม ${list.length} รายการ • เทียบกับช่วงก่อนหน้า ${fmtDateBE(prevRange.start)} — ${fmtDateBE(prevRange.end)}</div>
    </div>

    <div class="card p-5 no-print">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-bold text-sm">ตัวกรอง (เลือกได้หลายรายการ)</h3>
        ${(state.reports.filterDepts.length+state.reports.filterProvinces.length+state.reports.filterCategories.length+state.reports.filterAssets.length)>0 ?
          `<button class="btn-ghost" data-act="clear-report-filters">✕ ล้างตัวกรองทั้งหมด</button>` : ''}
      </div>
      <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-5">
        ${(()=>{ window.__rfo = reportFilterOptions(); return renderFilterDropdown('dept', 'หน่วยงาน', window.__rfo.depts, state.reports.filterDepts); })()}
        ${renderFilterDropdown('province', 'จังหวัด', window.__rfo.provinces, state.reports.filterProvinces)}
        ${renderFilterDropdown('category', 'ประเภทเครื่องมือ', window.__rfo.categories, state.reports.filterCategories, c=>catIcon(c)+' ')}
        ${renderFilterDropdown('asset', 'รหัสครุภัณฑ์', window.__rfo.assets, state.reports.filterAssets, null, window.__rfo.assetLabel)}
      </div>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
      <div class="card p-4 text-center"><div class="text-2xl font-bold" style="color:#0f766e">${list.length}</div><div class="text-xs subtle mt-1">ใบยืมทั้งหมด</div>${deltaBadge(deltaBorrows)}</div>
      <div class="card p-4 text-center"><div class="text-2xl font-bold" style="color:#0891b2">${totalQty}</div><div class="text-xs subtle mt-1">จำนวนเครื่องมือที่ยืม (ชิ้น)</div>${deltaBadge(deltaQty)}</div>
      <div class="card p-4 text-center"><div class="text-2xl font-bold" style="color:#b45309">${activeCount}</div><div class="text-xs subtle mt-1">กำลังยืมอยู่</div>${deltaBadge(deltaActive, true)}</div>
      <div class="card p-4 text-center"><div class="text-2xl font-bold" style="color:#15803d">${returnedCount}</div><div class="text-xs subtle mt-1">คืนแล้ว</div>${deltaBadge(deltaReturned)}</div>
      <div class="card p-4 text-center"><div class="text-2xl font-bold" style="color:${onTimeRate===null?'#6b7280':(onTimeRate>=90?'#15803d':onTimeRate>=75?'#b45309':'#dc2626')}">${onTimeRate===null?'—':onTimeRate.toFixed(0)+'%'}</div><div class="text-xs subtle mt-1">ตามระยะเวลา (จากที่คืนแล้ว)</div>${deltaPointBadge(deltaOnTime)}</div>
    </div>

    <div class="grid md:grid-cols-3 gap-5">
      <div class="card p-5">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-bold text-sm">สัดส่วนตามด้าน (จำนวนที่ยืม)</h3>
          ${catEntries.length? `<button class="chart-dl-btn no-print" data-act="expand-chart" data-chart="cat" data-title="สัดส่วนตามด้าน (จำนวนที่ยืม)" title="ขยายดูกราฟ">⤢</button>`:''}
        </div>
        ${catEntries.length===0? `<div class="empty-hint">ไม่มีข้อมูล</div>` : `<div class="report-chart-box" style="height:220px"><canvas id="chart-cat"></canvas></div>`}
      </div>
      <div class="card p-5">
        <div class="flex items-center justify-between mb-3 gap-2 flex-wrap">
          <h3 class="font-bold text-sm">เครื่องมือยอดนิยม (Top ${equipTopN===Infinity?'ทั้งหมด':equipTopN})</h3>
          <div class="flex items-center gap-2">
            <select id="r-top-equip" class="inp-sm no-print" style="width:auto;">
              ${[5,8,10,15,20].map(n=>`<option value="${n}" ${state.reports.topEquipCount===n?'selected':''}>Top ${n}</option>`).join('')}
              <option value="all" ${state.reports.topEquipCount===Infinity?'selected':''}>ทั้งหมด</option>
            </select>
            ${equipEntries.length? `<button class="chart-dl-btn no-print" data-act="expand-chart" data-chart="equip" data-title="เครื่องมือยอดนิยม (Top ${equipTopN===Infinity?'ทั้งหมด':equipTopN})" title="ขยายดูกราฟ">⤢</button>`:''}
          </div>
        </div>
        ${equipEntries.length===0? `<div class="empty-hint">ไม่มีข้อมูล</div>` : `
        <div class="flex flex-wrap gap-x-3 gap-y-1 mb-2" style="font-size:11px;">
          ${[...new Set(equipEntries.map(e=>equipCat[e[0]]).filter(Boolean))].map(c=>`
          <span class="flex items-center gap-1"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${(CATEGORY_COLOR[c]&&CATEGORY_COLOR[c].bg)||'#0891b2'}"></span>${esc(c)}</span>
          `).join('')}
        </div>
        <div class="report-chart-box" style="height:${Math.max(200, Math.min(equipEntries.length,equipTopN)*26)}px"><canvas id="chart-equip"></canvas></div>`}
      </div>
      <div class="card p-5">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-bold text-sm">สถานะใบยืม</h3>
          ${(list.length>0)? `<button class="chart-dl-btn no-print" data-act="expand-chart" data-chart="status" data-title="สถานะใบยืม" title="ขยายดูกราฟ">⤢</button>`:''}
        </div>
        ${list.length===0? `<div class="empty-hint">ไม่มีข้อมูล</div>` : `<div class="report-chart-box" style="height:220px"><canvas id="chart-status"></canvas></div>`}
      </div>
    </div>

    <div class="card p-5">
      <div class="flex items-center justify-between mb-3 gap-2 flex-wrap">
        <h3 class="font-bold text-sm">จำนวนครั้งที่ถูกยืม แยกเป็นรายเครื่อง (Top ${unitTopN===Infinity?'ทั้งหมด':unitTopN})</h3>
        <div class="flex items-center gap-2">
          <select id="r-top-unit" class="inp-sm no-print" style="width:auto;">
            ${[5,10,15,20,30].map(n=>`<option value="${n}" ${state.reports.topUnitCount===n?'selected':''}>Top ${n}</option>`).join('')}
            <option value="all" ${state.reports.topUnitCount===Infinity?'selected':''}>ทั้งหมด</option>
          </select>
          ${unitTopForChart.length? `<button class="chart-dl-btn no-print" data-act="expand-chart" data-chart="unitTop" data-title="จำนวนครั้งที่ถูกยืม แยกเป็นรายเครื่อง (Top ${unitTopN===Infinity?'ทั้งหมด':unitTopN})" title="ขยายดูกราฟ">⤢</button>`:''}
        </div>
      </div>
      ${unitTopForChart.length===0? `<div class="empty-hint">ไม่มีข้อมูล</div>` : `
      <div class="flex flex-wrap gap-x-3 gap-y-1 mb-2" style="font-size:11px;">
        ${[...new Set(unitTopForChart.map(r=>r.category).filter(Boolean))].map(c=>`
        <span class="flex items-center gap-1"><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${(CATEGORY_COLOR[c]&&CATEGORY_COLOR[c].bg)||'#0891b2'}"></span>${esc(c)}</span>
        `).join('')}
      </div>
      <div class="report-chart-box" style="height:${Math.max(220, unitTopForChart.length*32)}px"><canvas id="chart-unit-top"></canvas></div>`}
    </div>

    <div class="card p-5">
      <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
        <h3 class="font-bold text-sm">จำนวนครั้งที่ถูกยืม แยกเป็นรายเครื่อง</h3>
        <input id="r-unit-search" class="inp" style="max-width:280px" placeholder="ค้นหาชื่อเครื่องมือ หรือรหัสครุภัณฑ์..." value="${esc(state.reports.unitSearch||'')}"/>
      </div>
      <div class="text-xs subtle mb-3">นับเฉพาะใบยืมในช่วงเวลาที่เลือกไว้ด้านบนสุด และตามตัวกรองหน่วยงาน/จังหวัด/ประเภทด้านบน — แสดงเฉพาะเครื่องที่เคยถูกยืมอย่างน้อย 1 ครั้งในช่วงเวลานั้น ใช้ดูว่าเครื่องแต่ละตัว (เช่น "เครื่องที่ 1", "เครื่องที่ 2") ถูกยืมไปกี่ครั้งแล้ว • "รวมวันที่ยืม" นับจากวันที่ยืมถึงวันที่คืนตามใบยืม (นับรวมวันแรกและวันสุดท้าย) แล้วบวกทุกครั้งที่ยืม</div>
      ${unitRows.length===0? `<div class="empty-hint">${unitSearchVal? 'ไม่พบเครื่องมือที่ตรงกับคำค้นหา':'ยังไม่มีเครื่องมือที่ถูกยืมตามตัวกรองที่เลือก'}</div>` : `
      <div class="table-wrap" style="max-height:420px;overflow-y:auto">
        <table class="data-table">
          <thead><tr><th>ด้าน</th><th>เครื่องมือ</th><th>ลำดับเครื่อง</th><th>รหัสครุภัณฑ์</th><th class="c" style="width:14%">ยืมไปแล้ว (ครั้ง)</th><th class="c" style="width:16%">รวมวันที่ยืม (วัน)</th></tr></thead>
          <tbody>
            ${unitRows.map(r=>`
            <tr>
              <td><span class="mini-chip" style="--c:${CATEGORY_COLOR[r.category]?.bg||'#888'}">${esc(r.category)}</span></td>
              <td>${esc(r.name)}</td>
              <td class="text-xs">${esc(r.unitLabel)}</td>
              <td class="font-mono text-xs">${esc(r.assetCode)}</td>
              <td class="c font-bold">${r.count}</td>
              <td class="c font-bold">${r.days}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`}
    </div>

    <div class="card p-5">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-bold text-sm">แนวโน้มจำนวนใบยืม ย้อนหลัง 6 เดือน</h3>
        <button class="chart-dl-btn no-print" data-act="expand-chart" data-chart="trend" data-title="แนวโน้มจำนวนใบยืม ย้อนหลัง 6 เดือน" title="ขยายดูกราฟ">⤢</button>
      </div>
      <div class="report-chart-box" style="height:220px"><canvas id="chart-trend"></canvas></div>
    </div>

    <div class="card p-5">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-bold text-sm">หน่วยงานที่ยืม เทียบกับสถานะการยืม-คืน</h3>
        ${deptDetailEntries.length? `<button class="chart-dl-btn no-print" data-act="expand-chart" data-chart="deptStatus" data-title="หน่วยงานที่ยืม เทียบกับสถานะการยืม-คืน" title="ขยายดูกราฟ">⤢</button>`:''}
      </div>
      ${deptDetailEntries.length===0? `<div class="empty-hint">ไม่มีข้อมูล</div>` : `<div class="report-chart-box" style="height:${Math.max(220, deptDetailEntries.length*36)}px"><canvas id="chart-dept-status"></canvas></div>`}
    </div>

    <div class="card p-5">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-bold text-sm">การยืมแยกตามจังหวัด (พื้นที่ปฏิบัติงาน)</h3>
        ${provinceEntries.length? `<button class="chart-dl-btn no-print" data-act="expand-chart" data-chart="province" data-title="การยืมแยกตามจังหวัด (พื้นที่ปฏิบัติงาน)" title="ขยายดูกราฟ">⤢</button>`:''}
      </div>
      ${provinceEntries.length===0? `<div class="empty-hint">ไม่มีข้อมูล</div>` : `<div class="report-chart-box" style="height:${Math.max(220, provinceEntries.length*30)}px"><canvas id="chart-province"></canvas></div>`}
    </div>

    <div class="grid md:grid-cols-2 gap-5">
      <div class="card p-5">
        <h3 class="font-bold mb-3">เครื่องมือที่ไม่ถูกยืมเลยในช่วงเวลาที่เลือก</h3>
        <div class="text-xs subtle mb-3">เทียบจากคลังเครื่องมือทั้งหมด ${catFilterSet.length? '(กรองตามประเภทที่เลือก) ':''}เรียงตามจำนวนเครื่องทั้งหมดที่มี — เครื่องยิ่งเยอะยิ่งน่าสังเกตว่าไม่ถูกใช้</div>
        ${underusedTools.length===0? `<div class="empty-hint">ไม่มีเครื่องมือที่ว่างเปล่า — ทุกรายการถูกยืมอย่างน้อย 1 ครั้งในช่วงนี้</div>` : `
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>ด้าน</th><th>เครื่องมือ</th><th class="c" style="width:20%">จำนวนที่มี</th></tr></thead>
            <tbody>
              ${underusedTools.map(t=>`
              <tr>
                <td><span class="mini-chip" style="--c:${CATEGORY_COLOR[t.category]?.bg||'#888'}">${esc(t.category)}</span></td>
                <td>${esc(t.name)}</td>
                <td class="c font-bold">${t.total}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>`}
      </div>
      <div class="card p-5">
        <h3 class="font-bold mb-3">ผู้ยืมที่เลยระยะเวลายืมซ้ำ (Repeat late returners)</h3>
        <div class="text-xs subtle mb-3">นับจากใบยืมทั้งหมดในระบบตามตัวกรองปัจจุบัน (ไม่จำกัดเฉพาะช่วงเวลาที่เลือก) — แสดงเฉพาะผู้ที่เลยระยะเวลายืมตั้งแต่ 2 ครั้งขึ้นไป</div>
        ${repeatLateReturners.length===0? `<div class="empty-hint">ไม่พบผู้ยืมที่เลยระยะเวลายืมซ้ำ</div>` : `
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>หน่วยงาน</th><th>ผู้ยืม</th><th class="c" style="width:16%">เลยระยะเวลายืม</th><th class="c" style="width:16%">ใบยืมทั้งหมด</th></tr></thead>
            <tbody>
              ${repeatLateReturners.map(r=>`
              <tr>
                <td>${esc(r.dept)}</td>
                <td class="font-bold">${esc(r.name)}</td>
                <td class="c"><span class="pill pill-danger">${r.lateCount}</span></td>
                <td class="c">${r.totalCount}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>`}
      </div>
    </div>

const _reportChartInstances = {};
function _destroyChart(key){
  if(_reportChartInstances[key]){ try{ _reportChartInstances[key].destroy(); }catch(e){} delete _reportChartInstances[key]; }
}
function downloadReportChart(key){
  const inst = _reportChartInstances[key];
  if(!inst) return;
  try{
    const url = inst.toBase64Image('image/png', 1);
    const a = document.createElement('a');
    a.href = url;
    a.download = `รายงาน-กราฟ-${key}-${todayISO()}.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }catch(e){ console.error(e); }
}
function drawReportCharts(){

  Chart.defaults.font.family = "'Sarabun','Kanit',sans-serif";
  Chart.defaults.color = fontColor;
  Chart.defaults.set('plugins.datalabels', { display:false }); // ปิดไว้ก่อน แล้วเปิดเฉพาะกราฟที่ต้องการทีละอัน

  const catEl = document.getElementById('chart-cat');

    config = { type:'bar',
      data:{ labels:data.unitTopLabels, datasets:[{ label:'ยืมไปแล้ว (ครั้ง)', data:data.unitTopCounts, backgroundColor:data.unitTopColors }] },
      options:{ maintainAspectRatio:false, indexAxis:'y', plugins:{
        legend:{display:false},
        datalabels:{ display:true, anchor:'end', align:'end', color:fontColor, font:{weight:'600',size:13}, formatter:v=>v }
      }, scales:{ x:{ ticks:{precision:0}, grace:'12%' } } } };
  } else if(key==='deptStatus' && data.deptStatusLabels && data.deptStatusLabels.length){

      data:{

          { label:'เลยระยะเวลายืม', data:data.deptStatusLateReturned, backgroundColor:'#dc2626' },
        ]

      options:{ maintainAspectRatio:false, indexAxis:'y', plugins:{
        legend:{ position:'bottom', labels:{font:{size:13}} },

  if(config){
    _reportChartInstances.expand = new Chart(canvas, config);
  }

function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }
