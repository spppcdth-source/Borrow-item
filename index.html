/* ===================== ลากจัดลำดับเครื่องมือแบบอิสระ (คล้ายจัดลำดับเพลย์ลิสต์) ===================== */
function onDragHandlePointerDown(e){
  if(e.button!==undefined && e.button!==0) return; // เฉพาะคลิกซ้าย/แตะ
  const handle = e.target.closest('.drag-handle');
  if(!handle) return;
  const row = handle.closest('.reorder-row');
  if(!row) return;
  e.preventDefault();
  const container = row.parentElement;
  const rowRect = row.getBoundingClientRect();
  dragCtx = {
    row, container,
    startY: e.clientY,
    baseTop: rowRect.top,      // ตำแหน่ง top ตอนเริ่มลาก (คงที่ตลอดการลาก ใช้อ้างอิงตำแหน่งที่ "ควรอยู่" ตามเมาส์/นิ้ว)
    curStaticTop: rowRect.top, // ตำแหน่ง top จริงในเลย์เอาต์ปัจจุบัน (อัปเดตทุกครั้งที่มีการสลับตำแหน่งกับแถวข้างเคียง)
    height: rowRect.height,
    cat: row.dataset.cat,
    lastDY: 0,
  };
  row.classList.add('dragging-row');
  try{ row.setPointerCapture(e.pointerId); }catch(err){}
  row.addEventListener('pointermove', onRowPointerMove);
  row.addEventListener('pointerup', onRowPointerUp);
  row.addEventListener('pointercancel', onRowPointerUp);
}
function onRowPointerMove(e){
  if(!dragCtx) return;
  dragCtx.lastDY = e.clientY - dragCtx.startY;
  if(dragRAF) return;
  dragRAF = requestAnimationFrame(updateDragFrame);
}
function updateDragFrame(){
  dragRAF = null;
  if(!dragCtx) return;
  const { row, container } = dragCtx;
  const desiredTop = dragCtx.baseTop + dragCtx.lastDY; // ตำแหน่งที่อยากให้แถวไปอยู่ ณ ตอนนี้ (ตามเมาส์)
  const desiredCenter = desiredTop + dragCtx.height/2;
  const rows = Array.from(container.querySelectorAll('.reorder-row'));
  const curIndex = rows.indexOf(row);

  if(curIndex>0){
    const prev = rows[curIndex-1];
    const prevRect = prev.getBoundingClientRect();
    if(desiredCenter < prevRect.top + prevRect.height/2){
      container.insertBefore(row, prev);
      dragCtx.curStaticTop -= prevRect.height;
      flipSibling(prev, prevRect);
      applyDragTransform();
      return;
    }
  }
  if(curIndex < rows.length-1){
    const next = rows[curIndex+1];
    const nextRect = next.getBoundingClientRect();
    if(desiredCenter > nextRect.top + nextRect.height/2){
      container.insertBefore(next, row);
      dragCtx.curStaticTop += nextRect.height;
      flipSibling(next, nextRect);
      applyDragTransform();
      return;
    }
  }
  applyDragTransform();
}
// ตั้งค่า transform ของแถวที่ลากอยู่ ให้ตำแหน่งที่ "แสดงผลจริง" (ตำแหน่งในเลย์เอาต์ + transform)
// เท่ากับตำแหน่งที่ต้องการ (desiredTop) เสมอ ไม่ว่าจะสลับตำแหน่งในลิสต์ไปกี่ครั้งก็ตาม — จึงไม่มีการกระตุก/กระโดด
function applyDragTransform(){
  const desiredTop = dragCtx.baseTop + dragCtx.lastDY;
  const transformY = desiredTop - dragCtx.curStaticTop;
  dragCtx.row.style.transform = `translateY(${transformY}px)`;
}
// FLIP animation: ทำให้แถวที่ถูกสลับตำแหน่ง เลื่อนแบบนุ่มนวลแทนการกระโดดทันที
function flipSibling(el, oldRect){
  const newRect = el.getBoundingClientRect();
  const delta = oldRect.top - newRect.top;
  if(!delta) return;
  el.style.transition = 'none';
  el.style.transform = `translateY(${delta}px)`;
  requestAnimationFrame(()=>{
    el.style.transition = 'transform 140ms ease';
    el.style.transform = '';
  });
}
async function onRowPointerUp(e){
  if(!dragCtx) return;
  const {row, container, cat} = dragCtx;
  if(dragRAF){ cancelAnimationFrame(dragRAF); dragRAF = null; }
  row.classList.remove('dragging-row');
  row.style.transform = '';
  row.removeEventListener('pointermove', onRowPointerMove);
  row.removeEventListener('pointerup', onRowPointerUp);
  row.removeEventListener('pointercancel', onRowPointerUp);
  try{ row.releasePointerCapture(e.pointerId); }catch(err){}
  const rows = Array.from(container.querySelectorAll('.reorder-row'));
  const newNames = rows.map(r=>r.dataset.name);
  dragCtx = null;
  await saveEquipmentOrder(cat, newNames);
  render();
}

  }
  if(el.id==='calib-select-all'){
    const cm = state.manage.calib || {};
    let items = state.equipment.filter(x=>!!x.nextCalib);
    if(cm.catFilter) items = items.filter(x=>x.category===cm.catFilter);
    if(cm.search) items = items.filter(x=>(x.name+x.assetCode+x.brand+x.model).toLowerCase().includes(cm.search.toLowerCase()));
    items = items.map(x=>({...x, calibInfo:calibStatusInfo(x.nextCalib)}));
    if(cm.statusFilter==='danger') items = items.filter(x=>x.calibInfo.pill==='pill-danger');
    else if(cm.statusFilter==='warn') items = items.filter(x=>x.calibInfo.pill==='pill-warn');
    else if(cm.statusFilter==='ok') items = items.filter(x=>x.calibInfo.pill==='pill-ok');
    if(el.checked){ items.forEach(x=>state.calibSelected.add(x.id)); }
    else { items.forEach(x=>state.calibSelected.delete(x.id)); }
    render(); return;
  }
  if(el.classList && el.classList.contains('calib-row-check')){
    if(el.checked) state.calibSelected.add(el.dataset.id);
    else state.calibSelected.delete(el.dataset.id);
    renderSoft(); return;
  }
  if(el.classList && el.classList.contains('partial-return-check')){
    const uid = el.dataset.unit;
    if(el.checked) state.partialReturnSelected.add(uid);
    else state.partialReturnSelected.delete(uid);
    render(); return;
  }

  if(el.id==='import-file'){ importExcel(el.files[0]); return; }

  if(el.id==='ir-mode'){ itemReturnPeriod().mode = el.value; render(); return; }
  if(el.id==='ir-week'){ itemReturnPeriod().weekStart = el.value; render(); return; }
  if(el.id==='ir-month'){ itemReturnPeriod().month = parseInt(el.value); render(); return; }
  if(el.id==='ir-year'){ itemReturnPeriod().year = (parseInt(el.value)||beYear(new Date().getFullYear())) - 543; render(); return; }
  if(el.id==='ir-half'){ itemReturnPeriod().half = el.value; render(); return; }
  if(el.id==='ir-fy' || el.id==='ir-fy2'){ itemReturnPeriod().fy = parseInt(el.value) || (new Date().getFullYear()+543); render(); return; }
  if(el.id==='r-mode'){ state.reports.mode = el.value; render(); return; }
  if(el.id==='r-week'){ state.reports.weekStart = el.value; render(); return; }
  if(el.id==='r-month'){ state.reports.month = parseInt(el.value); render(); return; }
  if(el.id==='r-year'){ state.reports.year = (parseInt(el.value)||beYear(new Date().getFullYear())) - 543; render(); return; }
  if(el.id==='r-half'){ state.reports.half = el.value; render(); return; }
  if(el.id==='r-fy'){ state.reports.fy = parseInt(el.value); render(); return; }
  if(el.id==='r-fy2'){ state.reports.fy = parseInt(el.value); render(); return; }
  if(el.id==='r-top-equip'){ state.reports.topEquipCount = el.value==='all' ? Infinity : parseInt(el.value); render(); return; }
  if(el.id==='r-top-unit'){ state.reports.topUnitCount = el.value==='all' ? Infinity : parseInt(el.value); render(); return; }

function buildBorrowDraft(){
  const f = state.form;
  const nameEl = document.getElementById('f-name');
  const phoneEl = document.getElementById('f-phone');
  const posEl = document.getElementById('f-position');
  const noteEl = document.getElementById('f-notes');
  f.name = nameEl?nameEl.value:f.name;
  f.phone = phoneEl?phoneEl.value:f.phone;
  f.position = posEl?posEl.value:f.position;
  f.notes = noteEl?noteEl.value:f.notes;

  const errs = [];
  if(!f.dept) errs.push('กรุณาเลือกหน่วยงานผู้ยืม');
  if(!f.name) errs.push('กรุณากรอกชื่อ-นามสกุลผู้ยืม');
  if(!f.borrowDate) errs.push('กรุณาเลือกวันที่ยืม');
  if(!f.returnDate) errs.push('กรุณาเลือกวันที่คืน');
  if(f.borrowDate && f.borrowDate < todayISO()) errs.push('ไม่สามารถเลือกวันที่ยืมย้อนหลังได้ กรุณาเลือกวันที่ตั้งแต่วันนี้เป็นต้นไป');
  if(f.borrowDate && f.returnDate && f.returnDate < f.borrowDate) errs.push('วันที่คืนต้องไม่ก่อนวันที่ยืม');
  if(!f.province) errs.push('กรุณาระบุพื้นที่ปฏิบัติงาน');
  if(!PROVINCES.includes(f.province)) errs.push('กรุณาเลือกจังหวัดจากรายการที่ค้นหา');
  const pickKeys = Object.keys(f.picks);
  if(pickKeys.length===0) errs.push('กรุณาเลือกเครื่องมืออย่างน้อย 1 รายการ');

  if(errs.length) return { errs };

  const items = [];
  for(const key of pickKeys){
    const lastSep = key.lastIndexOf('|');
    const name = key.slice(0,lastSep), cat = key.slice(lastSep+1);
    const qty = isSingleQtyTool(name) ? 1 : f.picks[key];
    const group = groupEquipment(cat, f.borrowDate, f.returnDate).find(g=>g.name===name);
    if(!group || group.availItems.length < qty){
      return { errs: [`เครื่องมือ "${name}" มีจำนวนว่างไม่พอสำหรับช่วงวันที่ ${fmtDateBE(f.borrowDate)} ถึง ${fmtDateBE(f.returnDate)} (ว่างจริง ${group?group.availItems.length:0} เครื่อง มีคนจองช่วงวันที่ทับซ้อนอยู่แล้ว)`] };
    }
    const chosen = group.availItems.slice(0, qty);
    chosen.forEach(u=>{
      items.push({ equipmentId: u.id, name: u.name, assetCode: u.assetCode, category: cat, qty: 1 });
    });
   
  }
  
  const grouped = {};
  items.forEach(it=>{
    if(!grouped[it.name]) grouped[it.name] = { name: it.name, assetCode: it.assetCode, category: it.category, qty: 0, unitIds: [] };
    grouped[it.name].qty += 1;
    grouped[it.name].unitIds.push(it.equipmentId);
    if(grouped[it.name].qty>1) grouped[it.name].assetCode = grouped[it.name].unitIds.map(id=>{
      const u = state.equipment.find(x=>x.id===id); return u?u.assetCode:'';
    }).join(', ');
  });
  const finalItems = Object.values(grouped).map(g=>({
    name: g.name, assetCode: g.assetCode, category: g.category, qty: g.qty,
    equipmentId: g.unitIds[0], equipmentIds: g.unitIds
  }));

  const now = new Date();
  const borrow = {
    id: uid('BR'),
    code: nextBorrowCode(f.dept),
    createdAt: now.toISOString(),
    createdTime: nowTimeStr(),
    dept: f.dept, name: f.name, phone: f.phone, position: f.position,
    borrowDate: f.borrowDate, returnDate: f.returnDate, province: f.province, notes: f.notes,
    items: finalItems.map(it=>({ equipmentId: it.equipmentId, equipmentIds: it.equipmentIds, name: it.name, assetCode: it.assetCode, category: it.category, qty: it.qty })),
    status: 'active',
  };

  // เก็บ "ลายนิ้วมือ" ของเครื่องมือ (ชื่อ/รหัสครุภัณฑ์/หมวดหมู่/ลำดับ) ไว้ในแต่ละ itemsExpanded ด้วย
  // ไม่ใช่แค่ equipmentId เฉย ๆ เพราะถ้าแอดมิน "ล้างฐานข้อมูล" แล้วนำเข้าใหม่ ระบบจะสร้าง id ใหม่ทุกครั้ง
  // การมีข้อมูลเหล่านี้ติดไปกับใบยืม ทำให้ unitIsHeldForRange() เอาไปเทียบเพื่อเชื่อมโยงสถานะ "ถูกยืมอยู่"
  // กลับมาให้เครื่องมือชิ้นเดิมได้ ไม่ว่าจะมีรหัสครุภัณฑ์หรือไม่ก็ตาม
  borrow.itemsExpanded = [];
  finalItems.forEach(it=> it.equipmentIds.forEach(id=>{
    const eq = state.equipment.find(x=>x.id===id);
    borrow.itemsExpanded.push({
      equipmentId: id,
      name: eq ? eq.name : it.name,
      assetCode: eq ? eq.assetCode : (it.assetCode||''),
      category: eq ? eq.category : it.category,
      order: (eq && typeof eq.order==='number') ? eq.order : null,
    });
  }));

  return { errs: [], borrow };
}

  if(_submittingBorrow) return;

  state.pendingBorrow = null; // เคลียร์ก่อนรอบันทึก เพื่อไม่ให้เรียกซ้ำได้

      await saveBorrows();

    render();
    notifyAdmin(borrow.id, { auto:true });
  } finally { _submittingBorrow = false; }

async function updateEquipField(id, field, value){

async function updateCalibDate(id, value){
  const e = state.equipment.find(x=>x.id===id);
  if(!e) return;
  const prevValue = e.lastCalib || '';
  // เก็บวันที่เดิมสำรองไว้ทุกครั้งที่มีการเปลี่ยนแปลงค่า (ไม่ว่าจะเคลียร์ว่าง หรือเปลี่ยนเป็นวันที่อื่น)
  // เพื่อให้กดปุ่มกู้คืนย้อนกลับมาเป็นค่าก่อนหน้าได้ — เก็บไว้ในหน่วยความจำเท่านั้น ไม่บันทึกลงฐานข้อมูล
  // (รีเฟรชหน้าเว็บแล้วปุ่มกู้คืนจะหายไป)
  if((value||'') !== prevValue){
    state.calibDateBackup[id] = prevValue;
  }
  e.lastCalib = value;
  if(value && e.calibCycle){
    const d = new Date(value+'T00:00:00');
    d.setFullYear(d.getFullYear() + parseInt(e.calibCycle||1));
    e.nextCalib = toLocalISODate(d);
  } else {
    // ถ้าเคลียร์วันที่สอบเทียบล่าสุดออก ต้องเคลียร์วันสอบเทียบครั้งถัดไปด้วย ไม่งั้นจะค้างค่าเก่าไว้ผิดๆ
    e.nextCalib = null;
  }
  // ถ้าวันสอบเทียบครั้งถัดไปเลยกำหนดวันปัจจุบันแล้ว ให้ปรับสถานะใช้งานเป็น "รอสอบเทียบ" ทันที (ยกเว้นเครื่องมือที่ "ชำรุด")
  if(e.nextCalib && e.nextCalib < todayISO() && e.useStatus !== 'ชำรุด' && e.useStatus !== 'ส่งสอบเทียบ'){ e.useStatus = 'รอสอบเทียบ'; }
  await saveEquipment();
  render();
}
// กู้คืนวันที่สอบเทียบล่าสุดที่เพิ่งถูกเปลี่ยน/เคลียร์ไป กลับมาเป็นค่าก่อนหน้า พร้อมคำนวณวันสอบเทียบครั้งถัดไปกลับคืนด้วย แล้วเอาปุ่มกู้คืนออก (ไม่ต้องกดสลับไปมาได้อีก)
async function restoreCalibDate(id){
  const e = state.equipment.find(x=>x.id===id);
  const backup = state.calibDateBackup[id];
  if(!e || backup===undefined || backup===(e.lastCalib||'')) return;
  const value = backup;
  e.lastCalib = value;
  if(value && e.calibCycle){
    const d = new Date(value+'T00:00:00');
    d.setFullYear(d.getFullYear() + parseInt(e.calibCycle||1));
    e.nextCalib = toLocalISODate(d);
  } else {
    // กู้คืนกลับไปเป็นค่าว่าง ก็ต้องเคลียร์วันสอบเทียบครั้งถัดไปกลับไปด้วยเช่นกัน
    e.nextCalib = null;
  }
  if(e.nextCalib && e.nextCalib < todayISO() && e.useStatus !== 'ชำรุด' && e.useStatus !== 'ส่งสอบเทียบ'){ e.useStatus = 'รอสอบเทียบ'; }
  delete state.calibDateBackup[id]; // กู้คืนแล้ว ไม่ต้องแสดงปุ่มกู้คืนอีก
  await saveEquipment();
  render();
}
async function delEquip(id){
  if(!confirm('ยืนยันการลบเครื่องมือนี้?')) return;
  state.equipment = state.equipment.filter(e=>e.id!==id);
  await saveEquipment();
  render();
}
function clearEquip(){
  // ตรวจสอบก่อนว่ามีใบยืมที่ยังไม่คืน (active) อ้างอิงเครื่องมืออยู่หรือไม่ เพื่อเตือนแอดมิน
  // เพราะระบบจะจำเครื่องมือที่ถูกยืมค้างไว้ได้จากรหัสครุภัณฑ์ (ไม่ใช่แค่ id) — ถ้านำเข้าเครื่องมือใหม่
  // โดยใส่ "รหัสครุภัณฑ์" เดิมให้ตรงกับของเก่า ระบบจะเชื่อมโยงสถานะ "ถูกยืมอยู่" กลับมาให้อัตโนมัติ
  // แต่ถ้าเครื่องมือชิ้นนั้นไม่มีรหัสครุภัณฑ์ (หรือใส่ "ไม่มีเลขครุภัณฑ์") ระบบจะเชื่อมโยงคืนให้ไม่ได้
  const heldItemIds = new Set();
  state.borrows.forEach(b=>{
    if(b.status !== 'active') return;
    const list = (b.itemsExpanded && b.itemsExpanded.length) ? b.itemsExpanded : b.items;
    (list||[]).forEach(it=>{ if(!it.returned && it.equipmentId) heldItemIds.add(it.equipmentId); });
  });
  let warnHtml = 'ยืนยันล้างฐานข้อมูลเครื่องมือทั้งหมด? <b>การกระทำนี้ไม่สามารถย้อนกลับได้</b>';
  if(heldItemIds.size > 0){

async function saveEquipModal(id){

  const existing = id ? state.equipment.find(x=>x.id===id) : null;
  const obj = {
    category: val('em-category'), name: val('em-name'), assetCode: val('em-assetCode'),
    brand: val('em-brand'), model: val('em-model'), serial: val('em-serial'),
    condition: existing ? existing.condition : 'เครื่องมือสภาพสมบูรณ์', useStatus: existing ? existing.useStatus : 'ใช้งานได้',
    lastCalib: existing ? existing.lastCalib : '', calibCycle: 1,
    yearGot: val('em-yearGot'), params: val('em-params'),
  };
  if(!obj.name){ alert('กรุณากรอกชื่อเครื่องมือ'); return; }
  if(obj.lastCalib){
    const d = new Date(obj.lastCalib+'T00:00:00');
    d.setFullYear(d.getFullYear()+obj.calibCycle);
    obj.nextCalib = toLocalISODate(d);
  } else obj.nextCalib = null;
  // ถ้าวันสอบเทียบครั้งถัดไปเลยกำหนดวันปัจจุบันแล้ว ให้ปรับสถานะใช้งานเป็น "รอสอบเทียบ" ทันที (ยกเว้นเครื่องมือที่ "ชำรุด")
  if(obj.nextCalib && obj.nextCalib < todayISO() && obj.useStatus !== 'ชำรุด' && obj.useStatus !== 'ส่งสอบเทียบ'){ obj.useStatus = 'รอสอบเทียบ'; }

  if(id){
    const e = state.equipment.find(x=>x.id===id);
    Object.assign(e, obj);
  } else {
    obj.id = uid('EQ');
    obj.order = nextOrderForCategory(obj.category);
    state.equipment.push(obj);
  }
  await saveEquipment();
  state.manage.editing = null;
  render();
}

async function markCalibratedBulk(ids, details){
  const list = ids.map(id=>state.equipment.find(x=>x.id===id)).filter(Boolean);
  if(list.length===0) return;
  const todayStr = todayISO();
  const calibDate = (details && details.date) ? details.date : todayStr;
  list.forEach(e=>{
    const cycle = parseInt(e.calibCycle,10) || 1;
    const d = new Date(calibDate+'T00:00:00');
    d.setFullYear(d.getFullYear()+cycle);
    e.lastCalib = calibDate;
    e.nextCalib = toLocalISODate(d);
    e.calibStatus = ' สอบเทียบแล้ว';
    e.useStatus = 'ใช้งานได้';
    if(details){
      // เก็บข้อมูลรายละเอียดการสอบเทียบครั้งนี้ไว้ที่ตัวเครื่องมือ (ล่าสุด) และในประวัติ
      e.lastCalibAgency = details.agency || '';
      e.lastCalibCost = (typeof details.cost === 'number') ? details.cost : (parseFloat(details.cost)||0);
      e.lastCalibFixItems = details.fixItems || '';
      e.calibHistory = Array.isArray(e.calibHistory) ? e.calibHistory : [];
      e.calibHistory.push({
        date: calibDate,
        agency: details.agency || '',
        cost: (typeof details.cost === 'number') ? details.cost : (parseFloat(details.cost)||0),
        fixItems: details.fixItems || '',
        recordedAt: new Date().toISOString()
      });
    }
    // เครื่องมือนี้เพิ่งสอบเทียบเสร็จแล้ว ถือว่า "เคยเห็นแล้ว" ไม่ต้องขึ้นแจ้งเตือนซ้ำที่กระดิ่งอีก
    notifReadCalib.add(e.id);
  });
  await persistNotifReadState();
  await saveEquipment();
  if(list.length===1){
    showNotifToast('บันทึกผลการสอบเทียบแล้ว', `${list[0].name} — กำหนดครั้งถัดไป ${fmtDateBEShort2(list[0].nextCalib)}`, '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.16em;margin-right:0.32em;display:inline-block;flex:none"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>', 'new');
  } else {
    showNotifToast('บันทึกผลการสอบเทียบแล้ว', `บันทึกผลสำเร็จ ${list.length} รายการ`, '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.16em;margin-right:0.32em;display:inline-block;flex:none"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>', 'new');
  }
  render();
}

/* Excel import using SheetJS */
// ตอน "เพิ่ม/อัปเดต" (ไม่ใช่แทนที่ทั้งหมด) ระบบจะจับคู่แต่ละแถวในไฟล์กับเครื่องมือที่มีอยู่แล้วก่อน
// ชั้นหลัก: เทียบ "รหัสครุภัณฑ์" (เฉพาะรหัสที่ใช้งานได้จริง ไม่ใช่ค่าว่าง/"-"/"ไม่มีเลขครุภัณฑ์")
// ชั้นสำรอง: ถ้าทั้งสองฝั่งไม่มีรหัสครุภัณฑ์ที่ใช้งานได้ ให้เทียบจาก "หมวดหมู่ + ชื่อเครื่องมือ" แทน
// (สอดคล้องกับตรรกะจับคู่เครื่องมือที่ใช้อยู่แล้วในส่วนอื่นของระบบ เช่น unitIsHeldForRange)
// ถ้าเจอรายการที่ตรงกัน จะ "อัปเดต" ข้อมูล (เช่น วันสอบเทียบล่าสุด) ให้รายการเดิม โดยยังคง id / order /
// ประวัติสอบเทียบ-ซ่อมบำรุง (calibHistory, repairHistory) ของรายการเดิมไว้ทั้งหมด เพื่อไม่ให้ใบยืมที่ค้างอยู่
// หรือประวัติที่เคยบันทึกไว้หลุดการเชื่อมโยง — ถ้าไม่เจอ ถือว่าเป็นรายการใหม่ จึงค่อยสร้างรายการเพิ่ม
// ทำให้นำเข้าไฟล์ Excel ต้นฉบับซ้ำได้เรื่อยๆ โดยไม่สร้างรายการซ้ำ แค่ทำให้ข้อมูลตรงกับไฟล์ในคราวเดียว
function importExcel(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
      const header = rows[0];
      const parsedRows = [];
      const orderCounters = {};
      for(let i=1;i<rows.length;i++){
        const r = rows[i];
        if(!r || !r[1]) continue;
        const cat = r[0]||'';
        if(orderCounters[cat]===undefined) orderCounters[cat] = nextOrderForCategory(cat);
        parsedRows.push({
          category: cat, name: r[1]||'', dept: r[2]||'', yearGot: r[3]||'',
          condition: r[4]||'', calibStatus: r[5]||'', useStatus: r[6]||'ใช้งานได้',
          lastCalib: r[7]? excelDateToISO(r[7]) : null,
          calibCycle: 1, // รอบสอบเทียบคงที่ 1 ปี
          nextCalib: r[9]? excelDateToISO(r[9]) : null,
          brand: r[10]||'', model: r[11]||'', serial: r[12]||'', assetCode: r[13]||'', params: r[14]||'',
          fallbackOrder: orderCounters[cat]++,
        });
      }
      parsedRows.forEach(row=>{
        if(row.lastCalib && !row.nextCalib){
          const dd = new Date(row.lastCalib+'T00:00:00');
          dd.setFullYear(dd.getFullYear() + (parseInt(row.calibCycle,10)||1));
          row.nextCalib = toLocalISODate(dd);
        }
      });
      if(parsedRows.length===0){ alert('ไม่พบข้อมูลเครื่องมือในไฟล์ที่นำเข้า'); return; }
      const dbWasEmpty = state.equipment.length === 0; // ฐานข้อมูลว่าง (เช่น เพิ่งกดล้างข้อมูล) → นำเข้าแทนที่ทั้งหมดเลย ไม่ต้องถาม
      const merge = dbWasEmpty ? false : confirm(`พบเครื่องมือ ${parsedRows.length} รายการในไฟล์\n\nกด "ตกลง" เพื่อ "เพิ่ม/อัปเดต" ในฐานข้อมูลเดิม (รายการที่รหัสครุภัณฑ์ตรงกับของเดิมจะถูกอัปเดตข้อมูลให้ตรงกับไฟล์ ไม่สร้างซ้ำ)\nกด "ยกเลิก" เพื่อ "แทนที่" ฐานข้อมูลเดิมทั้งหมดด้วยไฟล์นี้`);
      let addedCount = 0, updatedCount = 0;
      if(merge){
        const existingBeforeImport = state.equipment.slice(); // จับคู่เฉพาะรายการที่มีอยู่ก่อนนำเข้า
        const matchedExistingIds = new Set();
        const rowMatch = new Array(parsedRows.length).fill(null);
        const codeOf = x => String(x.assetCode||'').trim();
        const rowCodes = new Set(parsedRows.filter(r=>isUsableAssetCode(r.assetCode)).map(codeOf));
        // รอบที่ 1: รหัสครุภัณฑ์ตรงกัน
        parsedRows.forEach((row,i)=>{
          if(!isUsableAssetCode(row.assetCode)) return;
          const m = existingBeforeImport.find(ex=> !matchedExistingIds.has(ex.id) && isUsableAssetCode(ex.assetCode) && codeOf(ex)===codeOf(row));
          if(m){ rowMatch[i]=m; matchedExistingIds.add(m.id); }
        });
        // รอบที่ 2: หมายเลขเครื่อง (Serial) ตรงกัน + หมวดหมู่/ชื่อเดียวกัน
        parsedRows.forEach((row,i)=>{
          if(rowMatch[i]) return;
          const sn = String(row.serial||'').trim();
          if(!sn || sn==='-') return;
          const m = existingBeforeImport.find(ex=> !matchedExistingIds.has(ex.id) && String(ex.serial||'').trim()===sn && ex.category===row.category && ex.name===row.name);
          if(m){ rowMatch[i]=m; matchedExistingIds.add(m.id); }
        });
        // รอบที่ 3: หมวดหมู่ + ชื่อเดียวกัน (แถวที่ยังไม่ถูกจับคู่ กับรายการเดิมที่ยังไม่ถูกจับคู่)
        // ไม่ดึงรายการเดิมที่รหัสครุภัณฑ์ไปตรงกับแถวอื่นในไฟล์ — กันเกิดรายการซ้ำเมื่อรหัสในไฟล์ใหม่ไม่ตรงกับของเดิม
        parsedRows.forEach((row,i)=>{
          if(rowMatch[i]) return;
          const m = existingBeforeImport.find(ex=> !matchedExistingIds.has(ex.id)
            && ex.category===row.category && ex.name===row.name
            && !(isUsableAssetCode(ex.assetCode) && rowCodes.has(codeOf(ex))));
          if(m){ rowMatch[i]=m; matchedExistingIds.add(m.id); }
        });
        parsedRows.forEach((row,i)=>{
          const match = rowMatch[i];
          if(match){
            // ยึดข้อมูลจากไฟล์เป็นหลัก: เขียนทับทุกช่อง แม้ในไฟล์เป็นค่าว่าง (เช่น ไม่มีวันสอบเทียบ ก็ล้างของเดิมออก)
            match.category = row.category; match.name = row.name; match.dept = row.dept; match.yearGot = row.yearGot;
            match.condition = row.condition; match.calibStatus = row.calibStatus; match.useStatus = row.useStatus;
            match.lastCalib = row.lastCalib; match.calibCycle = row.calibCycle; match.nextCalib = row.nextCalib;
            match.brand = row.brand; match.model = row.model; match.serial = row.serial;
            match.assetCode = row.assetCode; match.params = row.params;
            if(!row.lastCalib){ match.lastCalibAgency = ''; match.lastCalibCost = 0; match.lastCalibFixItems = ''; } // ไม่มีวันสอบเทียบล่าสุดในไฟล์ → ล้างรายละเอียดสอบเทียบครั้งล่าสุดที่ค้างอยู่ (ประวัติ calibHistory ยังเก็บไว้)
            match.importLockNextCalib = row.nextCalib || ''; // ล็อกสถานะตามไฟล์
            updatedCount++;
          }else{
            state.equipment.push({
              id: uid('EQ'), category: row.category, name: row.name, dept: row.dept, yearGot: row.yearGot,
              condition: row.condition, calibStatus: row.calibStatus, useStatus: row.useStatus,

      else alert(`นำเข้าข้อมูลสำเร็จ — แทนที่ข้อมูลเดิมด้วยข้อมูลจากไฟล์ ${addedCount} รายการ (สถานะและวันสอบเทียบตามไฟล์)`);
    }catch(err){

    }
  };
  reader.readAsArrayBuffer(file);
}
function excelDateToISO(v){
  if(v === null || v === undefined || v === '') return null;
  const pad = n => String(n).padStart(2,'0');
  const build = (y, m, d)=>{
    if(y > 2400) y -= 543;                 // ปี พ.ศ. -> ค.ศ.
    if(y < 100) y += 2000;                 // ปี 2 หลัก เช่น 26 -> 2026
    if(m < 1 || m > 12 || d < 1 || d > 31) return null;
    const dt = new Date(y, m-1, d);
    if(dt.getFullYear() !== y || dt.getMonth() !== m-1 || dt.getDate() !== d) return null; // เช่น 31/02
    return y + '-' + pad(m) + '-' + pad(d);
  };
  // 1) Date object (อ่านด้วย cellDates:true) — บวก 12 ชม. กันวันเพี้ยนจากการปัดเวลา/timezone
  if(v instanceof Date){
    if(isNaN(v)) return null;
    return toLocalISODate(new Date(v.getTime() + 12*3600*1000));
  }
  // 2) ตัวเลขซีเรียลของ Excel (เช่น 45527)
  if(typeof v === 'number'){
    if(v < 1 || v > 80000) return null;
    const dt = new Date(Math.round((v - 25569) * 86400000));
    return dt.getUTCFullYear() + '-' + pad(dt.getUTCMonth()+1) + '-' + pad(dt.getUTCDate());
  }
  // 3) ข้อความ — แปลงเลขไทย -> อารบิก และรวมตัวคั่นให้เป็นแบบเดียวกัน
  let s = String(v).trim().replace(/[๐-๙]/g, ch => String(ch.charCodeAt(0) - 0x0E50));
  s = s.replace(/\s+/g, '').replace(/[.\-]/g, '/');
  // ปี-เดือน-วัน (ISO) เช่น 2026/02/26
  let m = s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})(?!\d)/);
  if(m) return build(+m[1], +m[2], +m[3]);
  // วัน/เดือน/ปี เสมอ (ไม่ใช้ new Date(string) เพราะ JS จะตีความเป็น เดือน/วัน/ปี)
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4}|\d{2})(?!\d)/);
  if(m) return build(+m[3], +m[2], +m[1]);
  return null;
}

/* ===================== การคืนเครื่องมือ (คืนก่อน / ตามระยะเวลา / เลยระยะเวลายืม) =====================
   ผู้ดูแลระบบเป็นผู้กดคืนเครื่องมือเองเสมอ (ไม่มีการปิดใบยืมอัตโนมัติ)
   ระบบจะเทียบ "วันที่คืน (returnDate)" ที่กำหนดไว้ในใบยืม กับวันที่กดคืนจริง แล้วตั้งสถานะให้อัตโนมัติ:
     - กดคืนก่อนถึงวันครบกำหนด  -> 'early-returned'  (คืนก่อน)
     - กดคืนตรงวันครบกำหนดพอดี -> 'returned'         (ตามระยะเวลา)
     - กดคืนหลังวันครบกำหนดไปแล้ว -> 'late-returned'   (เลยระยะเวลายืม/เลยกำหนด)
====================================================================================== */
// หมวดของใบยืมที่ยัง "active" (ยังไม่คืน) เทียบกับวันครบกำหนดคืน ณ วันนี้
// ใช้จัดกลุ่มในเมนู "คืนเครื่องมือ" และเพื่อแจ้งเตือนใบยืมที่เลยกำหนดแล้ว
function borrowTimingCategory(b){
  const today = todayISO();
  if(!b.returnDate) return 'early';
  if(b.returnDate > today) return 'early';   // ยังไม่ถึงกำหนด (ถ้าคืนวันนี้ = คืนก่อน)
  if(b.returnDate === today) return 'ontime'; // ถึงกำหนดคืนพอดีวันนี้
  return 'late'; // เลยวันครบกำหนดคืนแล้ว แต่ยังไม่ได้คืน
}
function daysLate(b){
  if(!b.returnDate) return 0;
  const d1 = new Date(b.returnDate+'T00:00:00');
  const d2 = new Date(todayISO()+'T00:00:00');
  return Math.max(0, Math.round((d2-d1)/86400000));
}
function lateActiveBorrows(){
  return state.borrows.filter(b=>b.status==='active' && borrowTimingCategory(b)==='late');
}
/* ===================== Calendar logic ===================== */
function calShift(dir){
  let m = state.calendar.month + dir;
  let y = state.calendar.year;
  if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
  state.calendar.month=m; state.calendar.year=y; state.calendar.selectedDay=null;
  render();
}
async function returnBorrowNow(id){
  const b = state.borrows.find(x=>x.id===id);
  if(!b) return;
  const today = todayISO();
  let newStatus, confirmLabel;
  if(!b.returnDate || today < b.returnDate){ newStatus='early-returned'; confirmLabel='ก่อน'; }
  else if(today === b.returnDate){ newStatus='returned'; confirmLabel='ตามระยะเวลา'; }
  else { newStatus='late-returned'; confirmLabel=`เลยระยะเวลายืม ${daysLate(b)} วัน`; }
  if(!confirm(`ยืนยันคืนเครื่องมือ${confirmLabel}สำหรับใบยืม ${b.code} (${b.name})?\nเครื่องมือทุกชิ้นในใบยืมนี้จะกลับมาว่างให้ยืมใหม่ได้ทันที`)) return;
  (b.itemsExpanded||[]).forEach(rec=>{ if(!rec.returned){ rec.returned = true; rec.returnedAt = today; } });
  b.status = newStatus;
  b.actualReturnedAt = new Date().toISOString();
  await saveBorrows();
  render();
}

let _syncBusy = false;
async function pollRealtimeUpdates(){
  if(_syncBusy) return;
  _syncBusy = true;
  try{
    const [eq, br] = await Promise.all([ stGet('equipment:list', true), stGet('borrows:list', true) ]);
    applyEquipmentListUpdate(eq);
    applyBorrowsListUpdate(br);
  }catch(e){ /* เงียบไว้ ไม่รบกวนผู้ใช้ถ้าเน็ตหลุดชั่วคราว */ }
  finally{ _syncBusy = false; }
}

function startRealtimeSync(){
  let listenersOk = false;
  try{
    _unsubEquipmentList = db.collection(FS_COLLECTION).doc('equipment:list')
      .onSnapshot(
        snap=>{ if(snap.exists){ const d=snap.data(); applyEquipmentListUpdate(d && d.value); } },
        err=>{ console.warn('equipment realtime listener error, fallback to polling', err); startFallbackPolling(); }
      );
    _unsubBorrowsList = db.collection(FS_COLLECTION).doc('borrows:list')
      .onSnapshot(
        snap=>{ if(snap.exists){ const d=snap.data(); applyBorrowsListUpdate(d && d.value); } },
        err=>{ console.warn('borrows realtime listener error, fallback to polling', err); startFallbackPolling(); }
      );
    listenersOk = true;
  }catch(e){ console.warn('onSnapshot ใช้งานไม่ได้, ใช้ polling แทน', e); }

  if(!listenersOk) startFallbackPolling();

  // ซิงก์ทันทีเมื่อผู้ใช้กลับมาที่แท็บ/หน้าต่างนี้อีกครั้ง (เผื่อพลาดอัปเดตตอนแท็บถูกพักไว้)
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) pollRealtimeUpdates(); });
}

let _fallbackPollStarted = false;
function startFallbackPolling(){
  if(_fallbackPollStarted) return;
  _fallbackPollStarted = true;
  setInterval(pollRealtimeUpdates, 6000);
}

/* ===================== Data Science Additions: Risk Scoring / Recommendation / Data Quality ===================== */

// ---------- 3) Risk Scoring (คะแนนความเสี่ยง "ควรเฝ้าระวัง") ----------
function thaiYearToAD(y){
  if(!y) return null;
  return y > 2400 ? y - 543 : y;
}

function computeBorrowFrequency(equipmentId, assetCode, months = 12){
  const cutoff = new Date(); cutoff.setMonth(cutoff.getMonth() - months);
  let count = 0;
  state.borrows.forEach(b=>{
    const created = b.createdAt ? new Date(b.createdAt) : null;
    if(created && created < cutoff) return;
    (b.itemsExpanded && b.itemsExpanded.length ? b.itemsExpanded : (b.items||[])).forEach(it=>{
      if(it.equipmentId === equipmentId){ count++; return; }
      if(isUsableAssetCode(assetCode) && isUsableAssetCode(it.assetCode) && String(it.assetCode).trim()===String(assetCode).trim()) count++;
    });
  });
  return count;
}

function computeRiskScore(e){
  let score = 0;
  const reasons = [];

  if(e.useStatus === 'ชำรุด'){ score += 35; reasons.push('สถานะปัจจุบัน: ชำรุด'); }

  const adYear = thaiYearToAD(e.yearGot);
  if(adYear){
    const age = new Date().getFullYear() - adYear;
    if(age > 0){
      const ageScore = Math.min(20, age * 1.2);
      score += ageScore;
      if(age >= 10) reasons.push(`อายุใช้งาน ${age} ปี`);
    }
  }

  if(e.nextCalib){
    const next = new Date(e.nextCalib);
    if(!isNaN(next) && next < new Date()){
      score += 20;
      const overdueDays = Math.round((new Date() - next) / 86400000);
      reasons.push(`เลยกำหนดสอบเทียบ ${overdueDays} วัน`);
    }
  }

  const freq = computeBorrowFrequency(e.id, e.assetCode);
  const freqScore = Math.min(15, freq * 1.5);
  score += freqScore;
  if(freq >= 5) reasons.push(`ถูกยืม ${freq} ครั้งใน 12 เดือนล่าสุด`);

  if(e.condition === 'เสื่อมสภาพ' || e.condition === 'เครื่องมือที่ไม่พร้อมใช้งาน'){
    score += 10; reasons.push(`สภาพ: ${e.condition}`);
  }

  return { score: Math.min(100, Math.round(score)), reasons };
}

function buildRiskWatchlist(topN = 40){
  return state.equipment
    .map(e => ({ e, ...computeRiskScore(e) }))
    .filter(r => r.score >= 30)
    .sort((a,b) => b.score - a.score)
    .slice(0, topN);
}

function renderRiskWatchlistTable(){
  const rows = buildRiskWatchlist();
  return `

    ${rows.length===0 ? `<div class="empty-hint">ยังไม่มีเครื่องมือที่เข้าเกณฑ์ควรเฝ้าระวังในตอนนี้</div>` : `
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>ชื่อเครื่องมือ</th><th>รหัสครุภัณฑ์</th><th>หมวดหมู่</th><th>คะแนนความเสี่ยง</th><th>เหตุผล</th></tr></thead>
        <tbody>
          ${rows.map(r=>`
          <tr class="${r.score>=60?'calib-row-danger':(r.score>=45?'calib-row-warn':'')}">
            <td>${esc(r.e.name)}</td>
            <td class="font-mono text-xs">${esc(r.e.assetCode||'-')}</td>
            <td><span class="mini-chip" style="--c:${CATEGORY_COLOR[r.e.category]?.bg||'#888'}">${esc(r.e.category||'-')}</span></td>
            <td><b>${r.score}</b>/100</td>
            <td class="text-xs">${r.reasons.join(' • ')}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`}
  </div>`;
}

// ---------- 5) Recommendation (แนะนำเครื่องมือที่มักยืมคู่กัน) ----------
function buildCoOccurrenceMatrix(){
  const matrix = {};
  const singleCount = {};
  state.borrows.forEach(b=>{
    const names = [...new Set((b.items||[]).map(it=>it.name))];
    names.forEach(a=>{
      singleCount[a] = (singleCount[a]||0) + 1;
      if(!matrix[a]) matrix[a] = {};
      names.forEach(bName=>{
        if(a===bName) return;
        matrix[a][bName] = (matrix[a][bName]||0) + 1;
      });
    });
  });
  return { matrix, singleCount };
}

function recommendCoBorrowed(selectedNames, topN = 5){
  const { matrix, singleCount } = buildCoOccurrenceMatrix();
  const scores = {};
  selectedNames.forEach(name=>{
    const partners = matrix[name] || {};
    Object.entries(partners).forEach(([partnerName, count])=>{
      if(selectedNames.includes(partnerName)) return;
      const confidence = count / (singleCount[name] || 1);
      scores[partnerName] = (scores[partnerName]||0) + confidence;
    });
  });
  return Object.entries(scores)
    .sort((a,b)=>b[1]-a[1])
    .slice(0, topN)
    .map(([name, s])=>{
      const eq = state.equipment.find(x=>x.name===name);
      return { name, category: eq ? eq.category : (state.form.selectedCats[0]||''), confidence: Math.round(Math.min(1,s)*100) };
    });
}

function renderCoBorrowSuggestions(){
  const f = state.form;
  const pickedNames = [...new Set(Object.keys(f.picks||{}).map(key=> key.split('|')[0]))];
  if(!pickedNames.length) return '';
  const recs = recommendCoBorrowed(pickedNames).filter(r=>!pickedNames.includes(r.name));
  if(!recs.length) return '';
  return `
  <div class="chip-bg" style="padding:10px 14px;border-radius:12px;margin:-10px 0 16px 0;border:1px solid var(--border)">
    <div class="text-sm font-semibold mb-2">คนอื่นมักยืมคู่กับรายการที่คุณเลือก:</div>
    <div class="flex flex-wrap gap-2">
      ${recs.map(r=>`<button type="button" class="tab-btn" style="background:var(--card);color:var(--text);font-size:12px;padding:6px 12px" data-act="quick-add-suggestion" data-cat="${escAttr(r.category)}" data-name="${escAttr(r.name)}">
        + ${esc(r.name)} <span class="subtle">(${r.confidence}%)</span>
      </button>`).join('')}
    </div>
  </div>`;
}

// ---------- 6) Data Quality Checks (ตรวจสอบคุณภาพข้อมูล) ----------
function thaiDigitsToArabic(str){
  if(str==null) return str;
  const map = {'๐':'0','๑':'1','๒':'2','๓':'3','๔':'4','๕':'5','๖':'6','๗':'7','๘':'8','๙':'9'};
  return String(str).replace(/[๐-๙]/g, d => map[d]);
}

function runDataQualityChecks(){
  const issues = [];
  const nowADYear = new Date().getFullYear();

  const byAssetCode = {};
  state.equipment.forEach(e=>{
    if(!isUsableAssetCode(e.assetCode)) return;
    const key = String(e.assetCode).trim();
    (byAssetCode[key] = byAssetCode[key]||[]).push(e);
  });
  Object.entries(byAssetCode).forEach(([code, list])=>{
    if(list.length > 1){
      issues.push({ type:'duplicate-assetcode', severity:'high',
        message:`รหัสครุภัณฑ์ "${code}" ซ้ำกัน ${list.length} รายการ: ${list.map(e=>e.name).join(', ')}`,
        ids: list.map(e=>e.id) });
    }
  });

  state.equipment.forEach(e=>{
    ['assetCode','serial'].forEach(field=>{
      const v = e[field];
      if(v && /[๐-๙]/.test(String(v))){
        issues.push({ type:'thai-digit-mixed', severity:'low',
          message:`${field==='assetCode'?'รหัสครุภัณฑ์':'หมายเลขซีเรียล'} ของ "${e.name}" ใช้เลขไทย แนะนำแปลงเป็น "${thaiDigitsToArabic(v)}"`,
          ids:[e.id] });
      }
    });
  });

  state.equipment.forEach(e=>{
    if(e.lastCalib && e.nextCalib){
      const last = new Date(e.lastCalib), next = new Date(e.nextCalib);
      if(!isNaN(last) && !isNaN(next) && next < last){
        issues.push({ type:'calib-date-logic', severity:'high',
          message:`"${e.name}": วันสอบเทียบครั้งถัดไป (${e.nextCalib}) มาก่อนวันสอบเทียบล่าสุด (${e.lastCalib})`,
          ids:[e.id] });
      }
    }
  });

  state.equipment.forEach(e=>{
    const needsCalib = e.calibStatus && e.calibStatus.trim() !== 'ไม่ต้องส่งสอบเทียบ';
    if(needsCalib && !e.nextCalib){
      issues.push({ type:'missing-nextcalib', severity:'medium',
        message:`"${e.name}": ระบุว่าต้องสอบเทียบ (${e.calibStatus.trim()}) แต่ไม่มีวันสอบเทียบครั้งถัดไป`,
        ids:[e.id] });
    }
  });

  state.equipment.forEach(e=>{
    const adYear = e.yearGot > 2400 ? e.yearGot - 543 : e.yearGot;
    if(adYear && adYear > nowADYear){
      issues.push({ type:'future-year', severity:'medium',
        message:`"${e.name}": ปีที่ได้รับ (พ.ศ. ${e.yearGot}) อยู่ในอนาคต ตรวจสอบว่าใส่ปีถูกหรือไม่`,
        ids:[e.id] });
    }
  });

  const sevWeight = { high:0, medium:1, low:2 };
  return issues.sort((a,b)=> sevWeight[a.severity]-sevWeight[b.severity]);
}

function renderDataQualityPanel(){
  const issues = runDataQualityChecks();
  const counts = { high:0, medium:0, low:0 };
  issues.forEach(i=>counts[i.severity]++);
  return `
  <div class="card p-5">
    <h3 class="font-bold mb-1">ตรวจสอบคุณภาพข้อมูลเครื่องมือ</h3>
    <p class="text-sm subtle mb-4">ตรวจอัตโนมัติ: รหัสครุภัณฑ์ซ้ำ • เลขไทยปนอารบิก • วันที่สอบเทียบผิดตรรกะ • ข้อมูลสอบเทียบไม่ครบ • ปีที่ได้รับผิดปกติ</p>
    <div class="flex gap-2 mb-4 flex-wrap">
      <span class="pill pill-danger">รุนแรง ${counts.high}</span>
      <span class="pill pill-warn">ปานกลาง ${counts.medium}</span>
      <span class="pill">เล็กน้อย ${counts.low}</span>
    </div>
    ${issues.length===0 ? `<div class="empty-hint">ไม่พบปัญหาข้อมูลที่ตรวจสอบได้ในตอนนี้</div>` : `
    <div class="space-y-2" style="max-height:520px;overflow-y:auto">
      ${issues.map(i=>`
      <div class="notif-item ${i.severity==='high'?'calib-row-danger':(i.severity==='medium'?'calib-row-warn':'')}" style="border-radius:10px;cursor:default">
        <div class="notif-text">
          <div class="notif-sub" style="font-size:12.5px">[${i.severity==='high'?'รุนแรง':(i.severity==='medium'?'ปานกลาง':'เล็กน้อย')}] ${esc(i.message)}</div>
        </div>
      </div>`).join('')}
    </div>`}
  </div>`;
}

/* ===================== Boot ===================== */
(async function boot(){
  preloadSlipFonts(); // เริ่มโหลดฟอนต์ใบยืม (TH Sarabun PSK) ไว้ล่วงหน้าตั้งแต่เปิดหน้าเว็บ
  await authReady; // รอให้ล็อกอินแบบไม่ระบุตัวตนเสร็จก่อน ป้องกัน error permission-denied
  await initData();
  render();
  startRealtimeSync(); // real-time listener (onSnapshot) — อัปเดตทันทีที่มีการเปลี่ยนแปลง
  startLiveClock();
})();

</script>
<script id="dmy-date-js">
/* แสดงช่องวันที่ทั้งหมดเป็น วัน/เดือน/ปี (dd/mm/yyyy ค.ศ.) ไม่ขึ้นกับภาษาของเครื่อง
   ค่าจริงยังเก็บเป็น yyyy-mm-dd ใน input[type=date] เดิม โค้ดส่วนอื่นจึงทำงานเหมือนเดิม */
(function(){
  var PH='วัน/เดือน/ปี';
  var ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';
  function toDMY(iso){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||'');return m?m[3]+'/'+m[2]+'/'+m[1]:'';}
  function toISO(d){
    var m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(d); if(!m) return null;
    var dd=+m[1],mm=+m[2],yy=+m[3]; var t=new Date(yy,mm-1,dd);
    if(yy<1900||t.getFullYear()!==yy||t.getMonth()!==mm-1||t.getDate()!==dd) return null;
    return m[3]+'-'+m[2]+'-'+m[1];
  }
  function mask(v){
    var d=v.replace(/\D/g,'').slice(0,8), o=d.slice(0,2);
    if(d.length>2) o+='/'+d.slice(2,4);
    if(d.length>4) o+='/'+d.slice(4);
    return o;
  }
  function fire(el,type){el.dispatchEvent(new Event(type,{bubbles:true}));}
  function enhance(n){
    if(n.dataset.dmy) return; n.dataset.dmy='1';
    var small=n.classList.contains('inp-sm');
    var w=document.createElement('div'); w.className='dmy-wrap'+(small?' dmy-sm':'');
    var t=document.createElement('input'); t.type='text'; t.inputMode='numeric'; t.maxLength=10;
    t.autocomplete='off'; t.placeholder=PH; t.className=n.className+' dmy-text'; t.value=toDMY(n.value);
    if(n.disabled) t.disabled=true;
    // [แก้ไข] ช่องที่ติด data-calonly: พิมพ์ไม่ได้ ต้องเลือกจากปฏิทินเท่านั้น
    if(n.dataset.calonly){ t.readOnly=true; t.inputMode='none'; t.style.cursor='pointer'; t.title='คลิกเพื่อเลือกวันที่จากปฏิทิน';
      t.addEventListener('click',function(){ try{ n.showPicker ? n.showPicker() : (n.focus(), n.click()); }catch(e){ n.focus(); n.click(); } });
      t.addEventListener('keydown',function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); t.click(); } else if(ev.key!=='Tab'){ ev.preventDefault(); } });
    }
    var b=document.createElement('button'); b.type='button'; b.className='dmy-btn'; b.tabIndex=-1;
    b.title='เลือกจากปฏิทิน'; b.innerHTML=ICON;
    n.parentNode.insertBefore(w,n); w.appendChild(t); w.appendChild(n); w.appendChild(b);
    n.classList.add('dmy-native'); n.tabIndex=-1; n.setAttribute('aria-hidden','true');
    // ไม่ให้ event ของช่องพิมพ์หลุดไปถึงตัวจัดการเดิม (ตัวจัดการเดิมอ่านจาก input[type=date])
    ['input','change'].forEach(function(ev){t.addEventListener(ev,function(e){e.stopPropagation();});});
    t.addEventListener('input',function(){
      var pos=t.selectionStart, before=t.value; t.value=mask(before);
      t.classList.remove('dmy-bad');
      if(t.value===''){ if(n.value!==''){n.value='';fire(n,'input');fire(n,'change');} return; }
      if(t.value.length===10){
        var iso=toISO(t.value);
        var min=n.getAttribute('min'), max=n.getAttribute('max');
        if(!iso||(min&&iso<min)||(max&&iso>max)){ t.classList.add('dmy-bad'); t.title=iso?'วันที่อยู่นอกช่วงที่เลือกได้':'วันที่ไม่ถูกต้อง'; return; }
        t.title=''; if(n.value!==iso){ n.value=iso; fire(n,'input'); fire(n,'change'); }
      }
    });
    t.addEventListener('blur',function(){
      if(t.value.length&&t.value.length<10||t.classList.contains('dmy-bad')){ t.value=toDMY(n.value); t.classList.remove('dmy-bad'); }
    });
    n.addEventListener('change',function(){ t.value=toDMY(n.value); t.classList.remove('dmy-bad'); });
    b.addEventListener('click',function(){
      try{ n.showPicker ? n.showPicker() : (n.focus(), n.click()); }catch(e){ n.focus(); n.click(); }
    });
  }
  function scan(){ document.querySelectorAll('input[type="date"]:not([data-dmy])').forEach(enhance); }
  new MutationObserver(scan).observe(document.documentElement,{childList:true,subtree:true});
  scan();
})();
</script>
